pequenas também: como gastar o tempo livre, o que falar numa discussão, o que postar. Amar a Deus e amar o próximo é um critério simples que cabe em qualquer decisão.","pergunta":"Que decisão atual você pode avaliar com essa bússola?","pratica":"Passe essa decisão pelas duas perguntas e anote o que percebeu.","juntos":"","oracao":"Senhor, que o amor a ti e ao próximo seja a bússola das minhas escolhas. Amém."},{"id":"proposito-14","tema":"proposito","fase":3,"titulo":"Prosseguir para o alvo","ref":"Filipenses 3.12-14","link":"https://www.bible.com/pt/bible/129/PHP.3.12-14.NVI","versos":[[13,"Irmãos, não penso que eu mesmo já o tenha alcançado, mas uma coisa faço: esquecendo-me das coisas que ficaram para trás e avançando para as que estão adiante,"],[14,"prossigo para o alvo, a fim de ganhar o prêmio do chamado celestial de Deus em Cristo Jesus."]],"r1":"Paulo admite que ainda não chegou lá. Mas diz que esquece o que ficou para trás e avança para o que está adiante.","r2":"Propósito não é ter tudo resolvido. É seguir em frente, sem ficar preso a fracassos ou conquistas do passado. O alvo é Cristo.","r3":"Prosseguir não exige pressa. Exige direção. Defina uma meta espiritual pequena e realista, como ler um evangelho em um mês ou orar todas as manhãs. Avance um passo por dia. É assim que a jornada continua depois desta.","pergunta":"O que ficou para trás e ainda prende você?","pratica":"Escreva uma meta espiritual para os próximos três meses e compartilhe com alguém.","juntos":"","oracao":"Jesus, esqueço o que ficou para trás e prossigo para ti. Dá-me perseverança até o fim. Amém."},{"id":"fundamentos-01","tema":"fundamentos","fase":1,"titulo":"Como ler a Bíblia sem travar","ref":"Salmo 1.1-3","link":"https://www.bible.com/pt/bible/129/PSA.1.1-3.NVI","versos":[[2,"Ao contrário, sua satisfação está na lei do Senhor, e nessa lei medita dia e noite."],[3,"É como árvore plantada à beira de águas correntes: Dá fruto no tempo certo e suas folhas não murcham. Tudo o que ele faz prospera!"]],"r1":"O primeiro salmo compara quem medita na Palavra a uma árvore plantada junto a ribeiros. Ela não precisa se esforçar para ter água: as raízes estão no lugar certo.","r2":"Ler a Bíblia não precisa ser difícil. Comece por textos curtos, leia devagar e pergunte: o que isso diz sobre Deus? E sobre mim? O que posso praticar hoje?","r3":"Uma sugestão para começar: leia um capítulo do Evangelho de Marcos por dia. É curto, direto e mostra Jesus em ação. Antes de ler, ore: 'Senhor, fala comigo'. Depois, anote uma frase que chamou sua atenção.","pergunta":"O que mais te atrapalha na hora de ler a Bíblia?","pratica":"Leia o texto de hoje mais uma vez, devagar, e sublinhe a frase que mais chamou sua atenção.","juntos":"","oracao":"Senhor, quero ser como uma árvore plantada junto às águas. Dá-me prazer na tua Palavra. Amém."},{"id":"fundamentos-02","tema":"fundamentos","fase":1,"titulo":"Orar com palavras simples","ref":"Lucas 11.1-4","link":"https://www.bible.com/pt/bible/129/LUK.11.1-4.NVI","versos":[[1,"Certo dia Jesus estava orando em determinado lugar. Tendo terminado, um dos seus discípulos lhe disse: Senhor, ensina-nos a orar, como João ensinou aos discípulos dele."]],"r1":"Os discípulos viviam com Jesus e viam como Ele orava. Um dia pediram: Senhor, ensina-nos a orar.","r2":"Orar não exige palavras difíceis. É conversar com um Pai. Você pode agradecer, pedir, confessar, ou só contar como está. O importante é ser sincero.","r3":"Experimente orar em vários momentos curtos do dia: ao acordar, no trânsito, antes de comer, ao deitar. Orações curtas e sinceras mantêm a conversa com Deus aberta. Não existe hora errada para falar com o Pai.","pergunta":"Como é a sua oração hoje: frequente, rara, decorada, sincera?","pratica":"Faça uma oração em quatro partes: um obrigado, um pedido, uma confissão e uma entrega.","juntos":"","oracao":"Senhor, ensina-me a orar. Quero conversar contigo com sinceridade, como um filho fala com o pai. Amém."},{"id":"fundamentos-03","tema":"fundamentos","fase":1,"titulo":"Quem é Jesus","ref":"João 1.1-14","link":"https://www.bible.com/pt/bible/129/JHN.1.1-14.NVI","versos":[[14,"Aquele que é a Palavra tornou-se carne e viveu entre nós. Vimos a sua glória, glória como do Unigênito vindo do Pai, cheio de graça e de verdade."]],"r1":"João começa seu evangelho falando da Palavra que existia desde o princípio e era Deus. E então diz: a Palavra se tornou carne e viveu entre nós.","r2":"Em Jesus, Deus se aproximou. Ele não ficou distante esperando que a gente subisse até Ele. Ele desceu, viveu como um de nós e mostrou como Deus é.","r3":"Conhecer Jesus é como conhecer uma pessoa: leva tempo e convivência. Os evangelhos são o melhor lugar para começar. Repare em como Ele trata os doentes, as crianças, os pecadores e os orgulhosos. É assim que Deus é.","pergunta":"O que mais te impressiona na pessoa de Jesus?","pratica":"Leia um capítulo de um dos evangelhos esta semana prestando atenção em como Jesus trata as pessoas.","juntos":"","oracao":"Jesus, obrigado por vir até nós. Quero te conhecer de verdade e não só ouvir falar de ti. Amém."},{"id":"fundamentos-04","tema":"fundamentos","fase":1,"titulo":"O amor que dá sentido a tudo","ref":"João 3.16-17","link":"https://www.bible.com/pt/bible/129/JHN.3.16-17.NVI","versos":[[16,"Porque Deus tanto amou o mundo que deu o seu Filho Unigênito, para que todo o que nele crer não pereça, mas tenha a vida eterna."]],"r1":"Talvez seja o versículo mais conhecido da Bíblia. Ele resume a fé cristã: Deus amou o mundo de tal maneira que deu o seu Filho.","r2":"O versículo seguinte é tão importante quanto: Deus não enviou o Filho para condenar, mas para salvar. O coração de Deus para você é de amor.","r3":"Quando a culpa ou a sensação de não ser amado aparecer, volte a esse versículo. O amor de Deus não depende do seu desempenho de hoje. Ele foi demonstrado de uma vez por todas em Jesus.","pergunta":"Você se vê como alguém amado por Deus?","pratica":"Escreva o versículo 16 trocando 'o mundo' pelo seu nome e leia em voz alta.","juntos":"","oracao":"Deus, obrigado por me amar a ponto de dar o teu Filho. Recebo esse amor e quero viver nele. Amém."},{"id":"fundamentos-05","tema":"fundamentos","fase":1,"titulo":"Graça, não mérito","ref":"Efésios 2.4-9","link":"https://www.bible.com/pt/bible/129/EPH.2.4-9.NVI","versos":[[8,"Pois vocês são salvos pela graça, por meio da fé, e isto não vem de vocês, é dom de Deus;"],[9,"não por obras, para que ninguém se glorie."]],"r1":"Paulo diz que fomos salvos pela graça, por meio da fé, e que isso não vem de nós. É presente de Deus.","r2":"Muita gente vive a fé como um placar: faço o certo, Deus me ama mais; erro, Deus me ama menos. A graça quebra esse placar. O amor de Deus não se compra.","r3":"A graça muda a motivação. Você continua lendo a Bíblia, orando e servindo, mas não para ganhar pontos com Deus. Faz isso porque já foi amado. Isso tira um peso enorme e traz alegria para a vida de fé.","pergunta":"Você tem vivido a fé como presente ou como placar?","pratica":"Toda vez que se sentir 'em dívida' com Deus hoje, agradeça pela graça em vez de se cobrar.","juntos":"","oracao":"Pai, obrigado pela graça. Não mereço, mas recebo. Livra-me de tentar comprar o teu amor. Amém."},{"id":"fundamentos-06","tema":"fundamentos","fase":2,"titulo":"Nascer de novo","ref":"João 3.1-8","link":"https://www.bible.com/pt/bible/129/JHN.3.1-8.NVI","versos":[[3,"Em resposta, Jesus declarou: Digo-lhe a verdade: Ninguém pode ver o Reino de Deus, se não nascer de novo."]],"r1":"Nicodemos era um líder religioso respeitado. Foi ver Jesus à noite e ouviu algo que não esperava: é preciso nascer de novo.","r2":"Nascer de novo não é uma reforma de comportamento. É uma vida nova que Deus gera em quem confia em Jesus. Começa com uma entrega sincera.","r3":"Nascer de novo é o começo de uma caminhada, não o fim. Se você fez essa entrega, conte para alguém de fé e procure uma igreja onde possa crescer. Se ainda tem dúvidas, tudo bem: continue buscando, perguntando e lendo os evangelhos.","pergunta":"Você já entregou sua vida a Jesus? Se sim, como foi? Se não, o que te impede?","pratica":"Se fizer sentido para você, faça uma oração entregando sua vida a Jesus. Se já fez, agradeça pela vida nova.","juntos":"","oracao":"Jesus, quero nascer de novo e viver a vida que tu dás. Entrego a ti o meu coração. Amém."},{"id":"fundamentos-07","tema":"fundamentos","fase":2,"titulo":"O Espírito que ajuda","ref":"Romanos 8.26-27","link":"https://www.bible.com/pt/bible/129/ROM.8.26-27.NVI","versos":[[26,"Da mesma forma o Espírito nos ajuda em nossa fraqueza, pois não sabemos como orar, mas o próprio Espírito intercede por nós com gemidos inexprimíveis."]],"r1":"Paulo admite: muitas vezes não sabemos orar como deveríamos. E diz que o Espírito Santo nos ajuda nessa fraqueza.","r2":"Existem dias em que a oração não sai. Nesses dias, Deus não está esperando palavras bonitas. O Espírito intercede por você até nos suspiros.","r3":"Nos dias em que a oração não sair, você pode ler um salmo em voz alta como oração. Muitos cristãos fazem isso há séculos. As palavras dos salmos dão voz ao que a gente sente e não sabe dizer.","pergunta":"Já houve momentos em que você não sabia o que orar?","pratica":"Faça hoje uma oração sem palavras: fique em silêncio diante de Deus por dois minutos.","juntos":"","oracao":"Espírito Santo, quando eu não souber orar, ora por mim. Obrigado por me ajudar na fraqueza. Amém."},{"id":"fundamentos-08","tema":"fundamentos","fase":2,"titulo":"O fruto do Espírito","ref":"Gálatas 5.22-25","link":"https://www.bible.com/pt/bible/129/GAL.5.22-25.NVI","versos":[[22,"Mas o fruto do Espírito é amor, alegria, paz, paciência, amabilidade, bondade, fidelidade,"],[23,"mansidão e domínio próprio. Contra essas coisas não há lei."]],"r1":"Paulo descreve o fruto do Espírito: amor, alegria, paz, paciência, amabilidade, bondade, fidelidade, mansidão e domínio próprio.","r2":"Repare que é fruto, no singular. Não é uma lista de tarefas, é o resultado de uma vida ligada a Deus. Fruto cresce devagar e precisa de tempo.","r3":"Fruto aparece nas situações difíceis: paciência no trânsito, bondade com quem foi grosseiro, domínio próprio diante da tentação. Quando falhar, não desista. Peça perdão, peça ajuda e continue. O Espírito trabalha com paciência.","pergunta":"Qual dessas características você mais deseja ver crescer em você?","pratica":"Escolha uma dessas características e peça a Deus, todos os dias desta semana, que ela cresça em você.","juntos":"","oracao":"Espírito Santo, produz em mim o teu fruto. Faz crescer em mim [diga qual]. Amém."},{"id":"fundamentos-09","tema":"fundamentos","fase":2,"titulo":"Palavra viva","ref":"Hebreus 4.12-13","link":"https://www.bible.com/pt/bible/129/HEB.4.12-13.NVI","versos":[[12,"Pois a palavra de Deus é viva e eficaz, e mais afiada que qualquer espada de dois gumes; ela penetra ao ponto de dividir alma e espírito, juntas e medulas, e julga os pensamentos e intenções do coração."]],"r1":"Hebreus diz que a Palavra de Deus é viva e eficaz, mais afiada que uma espada. Ela alcança o que está no fundo do coração.","r2":"A Bíblia não é só um livro antigo para estudar. Quando lida com o coração aberto, ela lê a gente. Mostra motivações e cura feridas.","r3":"Um bom método é ler o mesmo texto três vezes: na primeira, para entender; na segunda, procurando uma palavra que chame atenção; na terceira, transformando essa palavra em oração. A Bíblia lida assim fala de um jeito diferente.","pergunta":"Em que momento a Bíblia já falou diretamente com você?","pratica":"Leia o texto de hoje pedindo: 'Senhor, o que queres me mostrar?'. Anote o que vier.","juntos":"","oracao":"Senhor, que a tua Palavra seja viva em mim. Mostra o que preciso ver e cura o que precisa ser curado. Amém."},{"id":"fundamentos-10","tema":"fundamentos","fase":2,"titulo":"Ninguém caminha sozinho","ref":"Hebreus 10.23-25","link":"https://www.bible.com/pt/bible/129/HEB.10.23-25.NVI","versos":[[24,"E consideremo-nos uns aos outros para incentivar-nos ao amor e às boas obras."],[25,"Não deixemos de reunir-nos como igreja, segundo o costume de alguns, mas encorajemo-nos uns aos outros, ainda mais quando vocês vêem que se aproxima o Dia."]],"r1":"Hebreus pede que pensemos em como estimular uns aos outros ao amor e às boas obras, sem deixar de nos reunir.","r2":"A fé não foi feita para ser vivida isolada. Uma comunidade de fé ajuda nas dúvidas, nas crises e nas alegrias. Ninguém foi feito para caminhar sozinho.","r3":"Participar de uma comunidade de fé pode começar com algo pequeno: ir a um culto, entrar num grupo pequeno, ajudar num projeto. Ninguém precisa chegar pronto. A igreja é lugar de gente em processo, como todos nós.","pergunta":"Você tem uma comunidade de fé? Como ela tem te ajudado?","pratica":"Procure alguém da sua igreja ou de fé para conversar esta semana. Se não tem igreja, pense em visitar uma.","juntos":"","oracao":"Senhor, obrigado pela igreja. Coloca pessoas de fé no meu caminho e me ensina a ser presença na vida delas. Amém."},{"id":"fundamentos-11","tema":"fundamentos","fase":2,"titulo":"Louvor em qualquer tempo","ref":"Salmo 34.1-8","link":"https://www.bible.com/pt/bible/129/PSA.34.1-8.NVI","versos":[[1,"Bendirei o Senhor o tempo todo! Os meus lábios sempre o louvarão."],[8,"Provem, e vejam como o Senhor é bom. Como é feliz o homem que nele se refugia!"]],"r1":"Davi escreveu esse salmo depois de fugir de um perigo real. Mesmo assim diz: bendirei o Senhor em todo o tempo.","r2":"Louvar não depende de tudo estar bem. É declarar quem Deus é, mesmo quando a situação não muda. E o salmo convida: provem e vejam como o Senhor é bom.","r3":"Louvar em tempos difíceis é declarar que Deus continua bom mesmo quando a vida não está. Monte uma pequena lista de músicas de louvor para os dias pesados. Ouvir e cantar ajuda o coração a lembrar do que é verdade.","pergunta":"Que motivo você tem para louvar a Deus hoje?","pratica":"Ouça uma música de louvor com atenção à letra e transforme em oração.","juntos":"Cantem ou ouçam juntos uma música de louvor e depois cada um diz por que quer louvar a Deus hoje.","oracao":"Senhor, bendirei o teu nome em todo o tempo. Tu és bom, e eu quero provar da tua bondade. Amém."},{"id":"fundamentos-12","tema":"fundamentos","fase":3,"titulo":"Fé como semente","ref":"Lucas 17.5-6","link":"https://www.bible.com/pt/bible/129/LUK.17.5-6.NVI","versos":[[5,"Os apóstolos disseram ao Senhor: Aumenta a nossa fé!"],[6,"Ele respondeu: Se vocês tiverem fé do tamanho de uma semente de mostarda, poderão dizer a esta amoreira: ‘Arranque-se e plante-se no mar’, e ela lhes obedecerá."]],"r1":"Os discípulos pediram: aumenta a nossa fé. Jesus respondeu falando de uma fé do tamanho de um grão de mostarda, a menor das sementes.","r2":"Jesus não pede uma fé enorme. Pede uma fé verdadeira, mesmo pequena. O poder não está no tamanho da fé, mas no Deus em quem ela confia.","r3":"Fé pequena também move montanhas porque quem move é Deus. Não espere ter fé grande para orar por algo grande. Ore com a fé que você tem, e peça a Deus que aumente essa fé no caminho.","pergunta":"Em que área sua fé parece pequena demais?","pratica":"Leve essa área a Deus em oração hoje, mesmo com a fé que você tem.","juntos":"","oracao":"Senhor, aumenta a minha fé. Mesmo pequena, ela está em ti, e isso basta. Amém."},{"id":"fundamentos-13","tema":"fundamentos","fase":3,"titulo":"Bem-aventurados","ref":"Mateus 5.1-10","link":"https://www.bible.com/pt/bible/129/MAT.5.1-10.NVI","versos":[[3,"Bem-aventurados os pobres em espírito, pois deles é o Reino dos céus."],[4,"Bem-aventurados os que choram, pois serão consolados."],[5,"Bem-aventurados os humildes, pois eles receberão a terra por herança."],[6,"Bem-aventurados os que têm fome e sede de justiça, pois serão satisfeitos."]],"r1":"No sermão do monte, Jesus chama de felizes pessoas que o mundo não chamaria: os humildes de espírito, os que choram, os mansos, os que têm fome de justiça.","r2":"O Reino de Deus vira os valores do mundo de cabeça para baixo. A felicidade que Jesus oferece não depende de sucesso, mas de estar perto dEle.","r3":"Escolha uma bem-aventurança para guiar a semana. Se for 'bem-aventurados os misericordiosos', procure uma oportunidade por dia de ser misericordioso. Os valores do Reino ficam reais quando viram prática.","pergunta":"Qual dessas bem-aventuranças fala mais com você hoje?","pratica":"Escolha uma bem-aventurança e pense em como vivê-la de forma concreta esta semana.","juntos":"","oracao":"Jesus, ensina-me a felicidade do teu Reino. Que eu seja manso, misericordioso e tenha fome de justiça. Amém."},{"id":"fundamentos-14","tema":"fundamentos","fase":3,"titulo":"Quem é o meu próximo","ref":"Lucas 10.25-37","link":"https://www.bible.com/pt/bible/129/LUK.10.25-37.NVI","versos":[[36,"Qual destes três você acha que foi o próximo do homem que caiu nas mãos dos assaltantes?"],[37,"Aquele que teve misericórdia dele, respondeu o perito na lei. Jesus lhe disse: Vá e faça o mesmo."]],"r1":"Um especialista na Lei perguntou: quem é o meu próximo? Jesus respondeu com a história de um samaritano que cuidou de um homem ferido na estrada.","r2":"Jesus inverte a pergunta. Não é 'quem merece minha ajuda', mas 'de quem eu posso me aproximar'. Próximo é quem precisa e está no meu caminho.","r3":"Ser próximo exige atenção. Às vezes a pessoa ferida está dentro de casa, no trabalho ou na vizinhança. Diminua o ritmo esta semana e repare nas pessoas ao seu redor. A compaixão começa com olhos abertos.","pergunta":"Quem está ferido no seu caminho e você tem evitado ver?","pratica":"Faça hoje algo concreto por alguém que precisa, mesmo que te tire da rotina.","juntos":"Escolham juntos alguém para ajudar e façam isso em família.","oracao":"Senhor, abre os meus olhos para quem está à beira do meu caminho. Que eu seja próximo de quem precisa. Amém."},{"id":"fundamentos-15","tema":"fundamentos","fase":3,"titulo":"A cruz e a esperança","ref":"Romanos 5.1-8","link":"https://www.bible.com/pt/bible/129/ROM.5.1-8.NVI","versos":[[8,"Mas Deus demonstra seu amor por nós: Cristo morreu em nosso favor quando ainda éramos pecadores."]],"r1":"Paulo diz que Cristo morreu por nós quando ainda éramos pecadores. Deus não esperou a gente melhorar para nos amar.","r2":"A cruz é a prova do amor de Deus. Por causa dela temos paz com Deus e uma esperança que não decepciona, mesmo no meio das dificuldades.","r3":"Quando você se sentir distante ou indigno, olhe para a cruz. Ela mostra quanto Deus estava disposto a dar para estar perto de você. Esse amor não muda com os seus dias bons ou ruins.","pergunta":"O que muda na sua vida saber que Deus te amou antes de você mudar?","pratica":"Escreva uma frase de gratidão pelo que Jesus fez na cruz e coloque em um lugar visível.","juntos":"","oracao":"Jesus, obrigado por morrer por mim quando eu ainda estava longe. Esse amor me dá paz e esperança. Amém."},{"id":"fundamentos-16","tema":"fundamentos","fase":3,"titulo":"Com você todos os dias","ref":"Mateus 28.16-20","link":"https://www.bible.com/pt/bible/129/MAT.28.16-20.NVI","versos":[[20,"ensinando-os a obedecer a tudo o que eu lhes ordenei. E eu estarei sempre com vocês, até o fim dos tempos."]],"r1":"As últimas palavras de Jesus no evangelho de Mateus são uma missão e uma promessa: vão e façam discípulos, e eu estarei com vocês todos os dias.","r2":"Todos os dias inclui os bons e os ruins, os cheios de fé e os de dúvida. Esta jornada termina, mas a presença dEle continua.","r3":"Ao terminar uma jornada, vale escolher como continuar: começar outra, reler os textos que mais marcaram, convidar alguém para caminhar junto. A presença de Jesus todos os dias é o que torna a caminhada possível.","pergunta":"Como você quer continuar caminhando com Deus depois desta jornada?","pratica":"Compartilhe com alguém algo que você aprendeu nesta jornada.","juntos":"","oracao":"Jesus, obrigado por estar comigo todos os dias. Que eu continue caminhando contigo e leve outros a te conhecer. Amém."}],"bonus":{"salmos":[{"id":"salmos-01","tema":"bonus","fase":1,"titulo":"Ele levanta a minha cabeça","ref":"Salmo 3.1-8","link":"https://www.bible.com/pt/bible/129/PSA.3.1-8.NVI","versos":[[3,"Mas tu, Senhor, és o escudo que me protege; és a minha glória e me fazes andar de cabeça erguida."],[5,"Eu me deito e durmo, e torno a acordar, porque é o Senhor que me sustém."]],"r1":"Davi escreveu este salmo fugindo do próprio filho, Absalão. Tinha inimigos por todos os lados. Mesmo assim, conseguiu dormir.","r2":"Deus é chamado de escudo e de quem levanta a cabeça. Quando a vergonha ou o medo fazem a gente baixar os olhos, Ele ergue o rosto.","r3":"Se o medo da noite vier, troque a lista de problemas por uma frase: 'tu és o meu escudo'. Repita devagar, respirando fundo. Davi dormiu cercado de inimigos porque sabia quem o guardava.","pergunta":"O que tem feito você andar de cabeça baixa?","pratica":"Antes de dormir, diga em voz baixa: 'Tu és o meu escudo'.","juntos":"","oracao":"Senhor, tu és o meu escudo e levantas a minha cabeça. Hoje eu me deito e durmo, porque tu me sustentas. Amém."},{"id":"salmos-02","tema":"bonus","fase":1,"titulo":"À sombra do Altíssimo","ref":"Salmo 91.1-4","link":"https://www.bible.com/pt/bible/129/PSA.91.1-4.NVI","versos":[[1,"Aquele que habita no abrigo do Altíssimo e descansa à sombra do Todo-poderoso"],[2,"pode dizer ao Senhor: Tu és o meu refúgio e a minha fortaleza, o meu Deus, em quem confio."]],"r1":"O Salmo 91 fala de quem habita no abrigo do Altíssimo. A imagem é de um pássaro que protege os filhotes debaixo das asas.","r2":"Habitar é morar, não visitar. A proteção de Deus é para quem faz dEle a sua casa, voltando para Ele todos os dias.","r3":"Morar no abrigo de Deus começa com pequenos retornos ao longo do dia. Uma oração antes de dormir é uma forma de voltar para casa. Deixe que as últimas palavras do seu dia sejam para Ele.","pergunta":"O que significa, para você, morar no abrigo de Deus?","pratica":"Leia o salmo inteiro antes de dormir, devagar.","juntos":"","oracao":"Senhor, tu és o meu refúgio e a minha fortaleza. Guarda-me debaixo das tuas asas esta noite. Amém."},{"id":"salmos-03","tema":"bonus","fase":1,"titulo":"O guarda que não dorme","ref":"Salmo 121.1-8","link":"https://www.bible.com/pt/bible/129/PSA.121.1-8.NVI","versos":[[2,"O meu socorro vem do Senhor, que fez os céus e a terra."],[3,"Ele não permitirá que você tropece; o seu protetor se manterá alerta,"],[4,"sim, o protetor de Israel não dormirá, ele está sempre alerta!"]],"r1":"Este era um salmo cantado por peregrinos a caminho de Jerusalém. Eles olhavam para os montes e lembravam de onde vinha o socorro.","r2":"O salmo repete que Deus não cochila nem dorme. Você pode dormir porque alguém fica acordado cuidando de você.","r3":"Antes de apagar a luz, entregue a Deus as pessoas da sua casa, uma por uma, pelo nome. Depois, descanse sabendo que o guarda de Israel não dorme.","pergunta":"O que você precisa entregar ao guarda que não dorme?","pratica":"Deixe um papel ao lado da cama com o versículo 2.","juntos":"","oracao":"Senhor, o meu socorro vem de ti. Tu não dormes. Guarda a minha casa e o meu sono esta noite. Amém."},{"id":"salmos-04","tema":"bonus","fase":1,"titulo":"Lembro de ti na cama","ref":"Salmo 63.1-8","link":"https://www.bible.com/pt/bible/129/PSA.63.1-8.NVI","versos":[[6,"Quando me deito lembro-me de ti; penso em ti durante as vigílias da noite."],[7,"Porque és a minha ajuda, canto de alegria à sombra das tuas asas."]],"r1":"Davi estava no deserto. Sem conforto, ele lembrava de Deus deitado na cama e pensava nEle nas vigílias da noite.","r2":"As noites de insônia podem virar tempo de oração. Em vez de brigar com o sono, dá para conversar com Deus e lembrar do cuidado dEle.","r3":"Se a insônia vier, evite brigar com ela. Leia um salmo devagar, faça uma oração simples ou apenas respire lembrando que Deus está ali. Às vezes o sono chega quando a gente para de exigir que ele chegue.","pergunta":"Como você costuma passar as noites em que não consegue dormir?","pratica":"Na próxima noite difícil, troque o celular por uma oração lenta, lembrando uma coisa boa que Deus já fez.","juntos":"","oracao":"Senhor, à sombra das tuas asas eu canto. Quando o sono não vier, que eu me lembre de ti. Amém."},{"id":"salmos-05","tema":"bonus","fase":1,"titulo":"Mais que os guardas pela manhã","ref":"Salmo 130.1-6","link":"https://www.bible.com/pt/bible/129/PSA.130.1-6.NVI","versos":[[5,"Espero no Senhor com todo o meu ser, e na sua palavra ponho a minha esperança."],[6,"Espero pelo Senhor mais do que as sentinelas pela manhã; sim, mais do que as sentinelas esperam pela manhã!"]],"r1":"O salmista clama das profundezas. Ele espera pelo Senhor mais do que os guardas da noite esperam pelo amanhecer.","r2":"O guarda sabe que a manhã vem, mesmo que demore. Assim é a esperança em Deus: a noite pode ser longa, mas o dia chega.","r3":"Esperar a manhã é confiar que ela vem. Escreva o que você está esperando de Deus e coloque a data. Daqui a um tempo, volte a essa anotação e veja como Deus agiu, mesmo que de um jeito diferente do esperado.","pergunta":"Que noite você está esperando que amanheça?","pratica":"Escreva o que você está esperando e termine com: 'Eu espero no Senhor'.","juntos":"","oracao":"Senhor, das profundezas eu clamo a ti. Espero por ti mais que o guarda pela manhã. Amém."}],"gratidao":[{"id":"gratidao-01","tema":"bonus","fase":1,"titulo":"Noite de gratidão em família","ref":"Salmo 100.1-5","link":"https://www.bible.com/pt/bible/129/PSA.100.1-5.NVI","versos":[[4,"Entrem por suas portas com ações de graças, e em seus átrios, com louvor; dêem-lhe graças e bendigam o seu nome."],[5,"Pois o Senhor é bom e o seu amor leal é eterno; a sua fidelidade permanece por todas as gerações."]],"r1":"O Salmo 100 é um convite à alegria: entrem pelas portas com ações de graças. A gratidão é a porta de entrada da presença de Deus.","r2":"Uma família que agradece junta aprende a enxerg /* ===================== motor do plano ===================== */
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function embaralha(a, r) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function escolhe(pool, n, r, comecaFase = true) {
  // prefere sessões ainda não feitas; respeita progressão por fase
  const nunca = pool.filter(s => !S.feitas[s.id]), ja = pool.filter(s => S.feitas[s.id]);

  if (n >= pool.length) base = pool.slice();
  const fases = [1, 2, 3].map(f => base.filter(s => s.fase === f));
  const quota = [Math.ceil(n * .4), Math.ceil(n * .35), n];
  const out = [];
  for (let f = 0; f < 3; f++) for (const s of fases[f]) { if (out.length >= n) break; if (out.filter(x => x.fase === f + 1).length < quota[f]) out.push(s); }
  for (const s of base) { if (out.length >= n) break; if (!out.includes(s)) out.push(s); }
  return comecaFase ? out.sort((a, b) => a.fase - b.fase || base.indexOf(a) - base.indexOf(b)) : out;
}
function gerarPlano(p, seed) {
  const r = rng(seed);
  const total = p.semanas * p.freq;
  const [t1, t2] = p.temas;
  const pool1 = D.sessoes.filter(s => s.tema === t1), pool2 = t2 ? D.sessoes.filter(s => s.tema === t2) : [], poolF = D.sessoes.filter(s => s.tema === "fundamentos");
  let n1 = Math.min(pool1.length, Math.round(total * (t2 ? .62 : .75)));
  let n2 = t2 ? Math.min(pool2.length, Math.round(total * .24)) : 0;
  let nF = total - n1 - n2;
  if (nF > poolF.length) { const extra = nF - poolF.length; nF = poolF.length; const a = Math.min(extra, pool1.length - n1); n1 += a; n2 += Math.min(extra - a, pool2.length - n2); }
  if (nF < 0) nF = 0;
  const L1 = escolhe(pool1, n1, r);
  const L2 = escolhe(pool2, n2, r);
  let LF;
  const iniciante = p.caminhada === "comecando" || p.caminhada === "voltando";
  const fecho = poolF.find(s => s.id === "fundamentos-16");
  if (iniciante) {
    const basicos = ["fundamentos-01", "fundamentos-02", "fundamentos-04", "fundamentos-05", "fundamentos-03"].map(i => SESS[i]);
    LF = basicos.slice(0, nF);
    if (nF > basicos.length) LF = LF.concat(escolhe(poolF.filter(s => !basicos.includes(s) && s !== fecho), nF - basicos.length - (nF >= 6 ? 1 : 0), r));
  } else LF = escolhe(poolF.filter(s => s !== fecho), Math.max(0, nF - (nF >= 2 ? 1 : 0)), r);
  if (nF >= 2 && !LF.includes(fecho) && LF.length < nF) LF.push(fecho);
  // monta a sequência: tema principal como espinha, intercalando os outros em posições regulares
  const seq = L1.slice();
  const intercala = (lista, desloc) => { lista.forEach((s, k) => { const pos = Math.min(seq.length, Math.round((k + desloc) * (seq.length + lista.length) / (lista.length + .5))); seq.splice(pos, 0, s); }); };
  intercala(L2, .7);
  const fim = LF.includes(fecho) ? fecho : null;
  const meio = LF.filter(s => s !== fim);
  if (iniciante) { meio.slice(0, 2).reverse().forEach(s => seq.unshift(s)); intercala(meio.slice(2), .5); } else intercala(meio, .5);
  if (fim) seq.push(fim);
  const titulo = TITULOS[t1] + (t2 ? " e " + TEMA[t2].nome.toLowerCase() : "");
  return { id: "j" + seed.toString(36), seed, titulo, temas: p.temas.filter(Boolean), inicio: hojeISO(), sessoes: seq.map(s => s.id), feitas: {}, concluida: false,
           freq: p.freq, dias: p.dias.slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)), minutos: p.minutos, com: p.com };
}
function agenda(j) {
  // data prevista de cada sessão: a partir do início, nos dias escolhidos
  const out = []; let d = deISO(j.inicio); let guard = 0;
  while (out.length < j.sessoes.length && guard++ < 400) { if (j.dias.includes(d.getDay())) out.push(new Date(d)); d = somaDias(d, 1); }
  return out;
}

  if (p.notif === "nao") return `<a class="mini" href="#perfil" style="text-decoration:none;color:inherit;grid-template-columns:auto 1fr;align-items:center;display:grid;gap:12px"><span style="color:var(--red)">${ico("sino", 24)}</span><span><b style="font-size:14.5px">Ativar lembretes</b><br><small class="muted">Receba um aviso no horário da sua sessão.</small></span></a>`;
  return `<p class="muted" style="font-size:13px;text-align:center">${ico("sino", 14)} Lembrete às ${esc(p.hora)} nos dias da jornada${nativo() ? "" : " (no app para Android)"}.</p>`;
}
function vHoje() {
  const nv = nivel(S.xp), j = S.jornada;

    </div>`;
  }
  const ag = agenda(j), idx = proximaIdx(j);
  const hoje = deISO(hojeISO());
  let cartao;
  if (idx === -1) {
    cartao = `<section class="proxima"><span class="rotulo">Jornada concluída</span><h2>Você terminou “${esc(j.titulo)}”</h2>
      <p style="opacity:.85">Que tal começar outra? O novo plano evita repetir as sessões que você já fez.</p><button class="btn" id="nova">Começar nova jornada</button></section>`;
  } else {
    const s = SESS[j.sessoes[idx]], d = ag[idx];
    const quando = iso(d) === hojeISO() ? "Sessão de hoje" : d < hoje ? "Sessão pendente" : "Próxima sessão · " + DIAS_L[d.getDay()];
    const barras = Array.from({ length: 7 }, (_, i) => `<i class="${i < Math.round(7 * Object.keys(j.feitas).length / j.sessoes.length) ? "on" : ""}"></i>`).join("");
    cartao = `<section class="proxima"><div class="barras" aria-hidden="true">${barras}</div><span class="rotulo">${quando}</span>
      <h2>${esc(s.titulo)}</h2><p class="ref">${esc(s.ref)}</p>
      <div class="meta"><span class="chip">${ico(s.tema, 15)} ${TEMA[s.tema].nome}</span><span class="chip">${minDe(j)} min</span><span class="chip">${idx + 1} de ${j.sessoes.length}</span></div>
      <button class="btn" id="iniciar">${d > hoje ? "Adiantar esta sessão" : "Começar sessão"} ${ico("seta", 20)}</button></section>`;
  }
  const semIni = deISO(semanaChave(new Date()));
  const dots = Array.from({ length: 7 }, (_, k) => {
    const d = somaDias(semIni, k), di = iso(d);
    const feito = Object.values(j.feitas).some(ts => iso(new Date(ts)) === di) || Object.values(S.bonus).some(ts => iso(new Date(ts)) === di);
    const plan = j.dias.includes(d.getDay());
    return `<span class="${di === hojeISO() ? "hoje" : ""}"><i class="${feito ? "feito" : plan ? "plan" : ""}">${feito ? ico("check", 14, 3) : ""}</i>${DIAS_C[d.getDay()].slice(0, 3)}</span>`;
  }).join("");
  setTimeout(() => {
    const b = $("#iniciar"); if (b) b.onclick = () => abrirSessao(j.sessoes[idx], false);
    const n = $("#nova"); if (n) n.onclick = () => { arquivaJornada("concluida"); S.jornada = null; salvar(); iniciarNova(); };
  });
  return `<div class="view">${cabeca}
    <div class="saud"><h1>${saudacao()}, ${esc(S.perfil.nome)}</h1><p>${idx === -1 ? "Parabéns pela constância." : "Um passo de cada vez."}</p></div>
    ${cartao}
    <div class="grade2">
      <div class="mini"><span class="rotulo">Meta da semana</span><div style="display:flex;align-items:center;gap:10px">${anelSVG(Math.min(feitasSemana(), j.freq), j.freq, 58)}<small class="muted" style="line-height:1.3">${feitasSemana() >= j.freq ? "Meta cumprida!" : (j.freq - feitasSemana()) + " para a meta"}</small></div></div>
      <a class="mini" href="#conquistas" style="text-decoration:none;color:inherit"><span class="rotulo">Seu nível</span><div style="display:flex;align-items:center;gap:8px">${arvore(nv.i, 52)}<div><div style="font-weight:700;font-size:18px;line-height:1.1">${nv.nome}</div><small class="muted">${nv.max ? (nv.max - S.xp) + " XP para " + nv.prox : "nível máximo"}</small></div></div></a>
    </div>
    <div class="card"><span class="rotulo">Esta semana</span><div class="semana-dots" style="margin-top:10px">${dots}</div></div>
    <div class="card palavra-dia"><span class="rotulo">Palavra do dia</span><blockquote>${esc(vd.t)}</blockquote><cite>${esc(vd.ref)} · NVI</cite></div>
    ${linhaLembrete()}
  </div>`;
}
const minDe = j => Math.max(10, j.minutos || 10);

/* ---------- JORNADA ---------- */
function vJornada() {
  const j = S.jornada;
  const hist = S.historico.length ? `<div class="card"><span class="rotulo">Jornadas anteriores</span>${S.historico.slice().reverse().map(h => `<div class="linha"><span>${esc(h.titulo)}</span><span class="muted">${h.encerrada ? `encerrada · ${h.n}/${h.total}` : `${h.n} sessões`}</span></div>`).join("")}</div>` : "";
  if (!j) {
    setTimeout(() => { const n = $("#nova"); if (n) n.onclick = iniciarNova; });
    return `<div class="view">${topo()}<div class="jhead"><span class="rotulo">Sua jornada</span><h1>Nenhuma jornada ativa</h1><p class="muted">Monte uma nova quando quiser. Leva uns 2 minutos.</p></div>
      <button class="btn" id="nova">Montar nova jornada</button>${hist}</div>`;
  }
  const ag = agenda(j), idx = proximaIdx(j);
  const feitas = Object.keys(j.feitas).length, pct = Math.round(100 * feitas / j.sessoes.length);
  const sem = [];
  j.sessoes.forEach((id, i) => { const w = Math.floor(i / j.freq); (sem[w] = sem[w] || []).push(i); });
  setTimeout(() => {
    document.querySelectorAll(".sess").forEach(b => b.onclick = () => {
      const i = Number(b.dataset.i), id = j.sessoes[i];
      if (j.feitas[id] || i === idx) abrirSessao(id, !!j.feitas[id]);
      else toast("Faça as sessões na ordem. A próxima é a destacada.");
    });
    const e = $("#encerrar"); if (e) e.onclick = abrirEncerrar;
    const n = $("#nova"); if (n) n.onclick = () => { arquivaJornada("concluida"); S.jornada = null; salvar(); iniciarNova(); };
  });
  return `<div class="view">${topo(`<span class="chip red">${pct}%</span>`)}
    <div class="jhead"><span class="rotulo">Sua jornada</span><h1>${esc(j.titulo)}</h1>
      <div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
      <p class="muted" style="font-size:13.5px">${feitas} de ${j.sessoes.length} sessões · ${j.freq}x por semana · ${minDe(j)} min</p></div>
    ${sem.map((lista, w) => {
      const ok = lista.filter(i => j.feitas[j.sessoes[i]]).length;
      return `<div class="semana"><h3><span>Semana ${w + 1}</span><span>${ok}/${lista.length}</span></h3>${lista.map(i => {
        const s = SESS[j.sessoes[i]], f = j.feitas[s.id];
        return `<button class="sess ${f ? "feita" : ""} ${i === idx ? "prox" : ""}" data-i="${i}"><span class="st">${f ? ico("check", 16, 3) : ""}</span>
          <span class="t"><b>${esc(s.titulo)}</b><small>${esc(s.ref)} · ${TEMA[s.tema].nome}</small></span><span class="dt">${f ? "feita" : dataCurta(ag[i])}</span></button>`;
      }).join("")}</div>`;
    }).join("")}
    ${idx === -1 ? `<button class="btn" id="nova">Começar nova jornada</button>` : `<button class="btn ghost" id="encerrar">Encerrar esta jornada</button>`}
    ${hist}
  </div>`;
}

/* ---------- encerrar jornada ---------- */
const MOTIVOS = [["nova", "Quero começar outra jornada", "Outro tema ou outro ritmo", "estrela"], ["tema", "O tema não era o que eu precisava", "Quero tratar de outro assunto", "bussola"],
  ["ritmo", "O ritmo ficou puxado", "Não estou conseguindo manter os dias", "relogio"], ["duracao", "As sessões estão longas ou curtas", "Quero ajustar o tempo", "relogio"],
  ["pausa", "Vou dar uma pausa", "Volto depois", "lua"], ["outro", "Outro motivo", "Quero contar com minhas palavras", "pena"]];
let EN = null;
function abrirEncerrar() {
  EN = { passo: 0, motivo: null, outro: "", depois: null };
  document.body.style.overflow = "hidden";
  renderEncerrar();
}
function fechaEncerrar() { $("#camada").innerHTML = ""; document.body.style.overflow = ""; EN = null; }
function renderEncerrar() {
  const j = S.jornada, feitas = Object.keys(j.feitas).length;
  let corpo = "", btn = "Continuar", pronto = false;
  if (EN.passo === 0) {
    corpo = `<div class="passo"><span class="rotulo">Encerrar jornada</span><h2>Por que você quer encerrar agora?</h2>
      <p class="muted">Sua resposta ajuda a deixar as próximas jornadas mais do seu jeito.</p>
      <div class="opcoes">${MOTIVOS.map(([v, b, sm, ic]) => `<button class="op" data-v="${v}" aria-pressed="${EN.motivo === v}"><span class="ic">${ico(ic)}</span><span><b>${b}</b><small>${sm}</small></span></button>`).join("")}</div>
      ${EN.motivo === "outro" ? `<textarea class="campo" id="outro-in" placeholder="Conte o motivo (opcional)" style="min-height:100px">${esc(EN.outro)}</textarea>` : ""}</div>`;
    pronto = !!EN.motivo;
  } else {
    corpo = `<div class="passo"><span class="rotulo">Encerrar jornada</span><h2>E agora, o que você quer fazer?</h2>
      <div class="card" style="display:grid;gap:4px"><b>${esc(j.titulo)}</b><small class="muted">${feitas} de ${j.sessoes.length} sessões feitas. Seu XP, seus selos e seu diário continuam com você.</small></div>
      <div class="opcoes">
        <button class="op" data-d="nova" aria-pressed="${EN.depois === "nova"}"><span class="ic">${ico("estrela")}</span><span><b>Montar uma nova jornada</b><small>Escolher outro tema ou ritmo agora</small></span></button>
        <button class="op" data-d="pausa" aria-pressed="${EN.depois === "pausa"}"><span class="ic">${ico("lua")}</span><span><b>Só encerrar por enquanto</b><small>Começo outra quando quiser</small></span></button>
      </div></div>`;
    pronto = !!EN.depois; btn = "Encerrar jornada";
  }
  $("#camada").innerHTML = `<div class="tela" role="dialog" aria-modal="true" aria-label="Encerrar jornada"><div class="tela-in">
    <div class="tela-top"><button class="fechar" id="en-sair" aria-label="Cancelar">${ico("x", 20)}</button><div class="passos"><i class="on"></i><i class="${EN.passo ? "on" : ""}"></i></div></div>
    ${corpo}
    <div class="tela-acoes"><button class="btn" id="en-ok" ${pronto ? "" : "disabled"}>${btn}</button><button class="btn ghost" id="en-volta">${EN.passo ? "Voltar" : "Continuar a jornada"}</button></div></div></div>`;
  $("#en-sair").onclick = fechaEncerrar;
  $("#en-volta").onclick = () => { if (EN.passo) { EN.passo = 0; renderEncerrar(); } else fechaEncerrar(); };
  document.querySelectorAll("#camada .op").forEach(b => b.onclick = () => {
    if (b.dataset.v) { EN.motivo = b.dataset.v; if (EN.motivo === "nova") EN.depois = "nova"; if (EN.motivo === "pausa") EN.depois = "pausa"; }
    if (b.dataset.d) EN.depois = b.dataset.d;
    renderEncerrar();
  });
  const o = $("#outro-in"); if (o) o.oninput = () => { EN.outro = o.value.slice(0, 500); };
  $("#en-ok").onclick = () => {
    if (EN.passo === 0) { EN.passo = 1; renderEncerrar(); return; }
    S.encerramentos = S.encerramentos || [];
    S.encerramentos.push({ jornada: j.id, titulo: j.titulo, feitas, total: j.sessoes.length, motivo: EN.motivo, outro: EN.outro.trim(), quando: Date.now() });
    arquivaJornada("encerrada");
    S.jornada = null; salvar(); agendaNotif();
    const depois = EN.depois;
    fechaEncerrar();
    if (depois === "nova") iniciarNova();
    else { location.hash = "#hoje"; rota(); toast("Jornada encerrada. Volte quando quiser."); }
  };
}
function arquivaJornada(tipo) {
  const j = S.jornada; if (!j || S.historico.some(h => h.id === j.id)) return;
  S.historico.push({ id: j.id, titulo: j.titulo, n: Object.keys(j.feitas).length, total: j.sessoes.length, encerrada: tipo === "encerrada", fim: Date.now() });
}

/* ---------- CONQUISTAS ---------- */
function arvore(i, tam = 120) {
  // planta que cresce com o nível: semente, broto, raiz, ramo, árvore, fruto, pomar
  const ink = "var(--ink)", g = "var(--gold)", gs = "var(--gold-soft)", r = "var(--red)";
  let s = `<svg width="${tam}" height="${tam}" viewBox="0 0 120 120" role="img" aria-label="Nível ${NIVEIS[i][0]}"><line x1="12" y1="96" x2="108" y2="96" stroke="${ink}" stroke-width="2.5" stroke-linecap="round"/>`;
  const folha = (x, y, rot, sc = 1) => `<ellipse cx="${x}" cy="${y}" rx="${9 * sc}" ry="${4.6 * sc}" transform="rotate(${rot} ${x} ${y})" fill="${gs}" stroke="${ink}" stroke-width="2"/>`;
  if (i === 0) s += `<ellipse cx="60" cy="104" rx="8" ry="5.5" fill="${gs}" stroke="${ink}" stroke-width="2"/><path d="M60 98v-6" stroke="${ink}" stroke-width="2.4" stroke-linecap="round"/>`;
  if (i === 1) s += `<path d="M60 96V74" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/>${folha(51, 76, -30)}${folha(69, 72, 30)}`;
  if (i === 2) s += `<path d="M60 96v10M60 100l-9 8M60 100l9 8" stroke="${ink}" stroke-width="2" stroke-linecap="round"/><path d="M60 96V62" stroke="${ink}" stroke-width="2.8" stroke-linecap="round"/>${folha(50, 80, -30)}${folha(70, 74, 30)}${folha(51, 64, -40)}${folha(69, 60, 40)}`;
  if (i === 3) s += `<path d="M60 96V50M60 72l-14-10M60 64l13-11" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>${folha(44, 58, -40)}${folha(76, 50, 40)}${folha(52, 46, -60)}${folha(66, 42, 60)}${folha(50, 80, -25)}${folha(70, 76, 25)}`;
  if (i >= 4 && i <= 5) {
    s += `<path d="M60 96V58M60 74l-12-10M60 68l11-9" stroke="${ink}" stroke-width="4" stroke-linecap="round"/>`;
    s += `<g fill="${gs}" stroke="${ink}" stroke-width="2.2"><circle cx="44" cy="52" r="15"/><circle cx="76" cy="50" r="16"/><circle cx="60" cy="38" r="18"/><circle cx="60" cy="58" r="12"/></g>`;
    if (i === 5) s += `<g fill="${r}"><circle cx="47" cy="49" r="3.6"/><circle cx="68" cy="34" r="3.6"/><circle cx="78" cy="55" r="3.6"/><circle cx="56" cy="58" r="3.6"/></g>`;
  }
  if (i === 6) {
    const t = (x, sc) => `<path d="M${x} 96V${96 - 30 * sc}" stroke="${ink}" stroke-width="${3 * sc}" stroke-linecap="round"/><g fill="${gs}" stroke="${ink}" stroke-width="2"><circle cx="${x}" cy="${96 - 38 * sc}" r="${15 * sc}"/></g><g fill="${r}"><circle cx="${x - 5 * sc}" cy="${96 - 40 * sc}" r="${3 * sc}"/><circle cx="${x + 6 * sc}" cy="${96 - 34 * sc}" r="${3 * sc}"/></g>`;
    s += t(32, .8) + t(88, .8) + t(60, 1.15);
  }
  return s + `</svg>`;
}

      <div class="linha"><span>Terminar a jornada</span><span>+200</span></div></div>
  </div>`;
}
function abrirPremio(id) {
  const p = PREMIOS.find(x => x.id === id), nv = nivel(S.xp);
  if (nv.i < p.nivel) return toast("Continue: este prêmio libera no nível " + NIVEIS[p.nivel][0] + ".");
  if (id === "salmos" || id === "gratidao") return modalBonus(id);
  let corpo = "";
  if (id === "cartao") {
    const s = SESS[S.jornada.sessoes[0]], v = s.versos[0];
    corpo = `<div class="cartao-verso"><div class="barras"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><p>“${esc(v[1])}”</p>
      <small style="font-weight:600">${esc(s.ref.split(".")[0])}.${v[0]} · NVI</small><small style="opacity:.7">${esc(S.jornada.titulo)} · Semear</small></div>
      <p class="muted" style="font-size:13px">Tire um print da tela para salvar ou compartilhar.</p>`;
  }
  if (id === "cupom") corpo = `<p>Use este código no checkout de qualquer material da Palavra &amp; Oração:</p><div class="cupom" id="cupom-txt">PALAVRA30</div><button class="btn sec" id="copiar">Copiar código</button>`;
  if (id === "dourado") corpo = `<div style="display:grid;justify-items:center;gap:10px;text-align:center"><span class="pi" style="width:84px;height:84px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center">${ico("coroa", 42)}</span>
    <p>Você chegou ao nível Fruto. Assim que uma nova jornada for lançada, ela aparece aqui primeiro para você.</p></div>`;
  modal(`<span class="rotulo">Prêmio</span><h2 style="font-size:22px">${p.nome}</h2>${corpo}<button class="btn" data-fecha>Fechar</button>`);
  const c = $("#copiar");
  if (c) c.onclick = () => { navigator.clipboard.writeText("PALAVRA30").then(() => toast("Código copiado")).catch(() => { const r = document.createRange(); r.selectNodeContents($("#cupom-txt")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Selecione e copie o código"); }); };
}
function modalBonus(id) {
  const lista = id === "salmos" ? D.bonus.salmos : D.bonus.gratidao;
  modal(`<span class="rotulo">Bônus liberado</span><h2 style="font-size:22px">${id === "salmos" ? "Salmos para noites difíceis" : "Noite de gratidão em família"}</h2>
    <div style="display:grid;gap:8px">${lista.map(s => `<button class="sess ${S.bonus[s.id] ? "feita" : ""}" data-b="${s.id}"><span class="st">${S.bonus[s.id] ? ico("check", 16, 3) : ""}</span><span class="t"><b>${esc(s.titulo)}</b><small>${esc(s.ref)}</small></span></button>`).join("")}</div>
    <button class="btn sec" data-fecha>Fechar</button>`);
  document.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { fechaModal(); abrirSessao(b.dataset.b, false, true); });
}

/* ---------- PERFIL ---------- */
function vPerfil() {
  const p = S.perfil, nat = nativo();
  setTimeout(() => {

/* ===================== notificações ===================== */
function nativo() { return typeof window.AppNativo === "object" && window.AppNativo && typeof window.AppNativo.agendar === "function"; }
function permissaoNotif() { try { return !!window.AppNativo.permitido(); } catch (e) { return null; } }
function pedirPermissaoNotif() { try { if (nativo() && window.AppNativo.pedirPermissao) window.AppNativo.pedirPermissao(); } catch (e) {} }
const LEVES = [
  "Um café, um salmo e cinco minutos de paz. Topa?", "Respira. Deus continua no controle.", "Já agradeceu por alguma coisa hoje?",
  "Pausa de um minuto: feche os olhos, respire fundo e diga “obrigado, Senhor”.", "Que tal mandar uma mensagem de carinho para alguém da família hoje?",
  "Lembrete do dia: você não precisa carregar tudo sozinho.", "Ore por alguém hoje. Pode ser só uma frase, pelo nome.",
  "O Salmo 119 é o maior capítulo da Bíblia. Hoje, um versículo já basta.", "Deus não espera perfeição. Espera você.",
];
const TIT_LEMBRETE = ["Hora da sua jornada", "Seu momento com Deus", "{nome}, sua sessão está pronta", "Uma pausa para a Palavra"];
function agendaNotif(teste = false) {
  if (!nativo()) return;
  const lista = [];
  try {
    if (S && S.perfil && S.perfil.notif && S.perfil.notif !== "nao") {
      const p = S.perfil, j = S.jornada, agora = Date.now();
      const [hh, mm] = (p.hora || "20:30").split(":").map(Number);
      const r = rng((Math.floor(agora / 864e5) * 31 + 7) >>> 0);
      const nome = p.nome || "";
      // próximas sessões por data prevista (pendentes vão para o próximo dia da jornada)
      const pend = [];
      if (j) {
        const ag = agenda(j);
        j.sessoes.forEach((id, i) => { if (!j.feitas[id]) pend.push([id, ag[i]]); });
      }
      const ultima = (() => { const ids = j ? Object.entries(j.feitas).sort((a, b) => b[1] - a[1]) : []; return ids.length ? SESS[ids[0][0]] : null; })();
      let k = 0;
      for (let dd = 0; dd < 14; dd++) {
        const dia = somaDias(deISO(hojeISO()), dd), di = iso(dia);
        const diaSessao = j && j.dias.includes(dia.getDay()) && pend.length;
        const feitoHoje = j && Object.values(j.feitas).some(ts => iso(new Date(ts)) === di);
        if (diaSessao && !feitoHoje) {
          const [sid] = pend[Math.min(k, pend.length - 1)]; k++;
          const s = SESS[sid];
          const q = new Date(dia); q.setHours(hh, mm, 0, 0);
          lista.push({ q: q.getTime(), t: TIT_LEMBRETE[Math.floor(r() * TIT_LEMBRETE.length)].replace("{nome}", nome), x: `“${s.titulo}” · ${minDe(j)} min. Abra quando puder.` });
          const n = new Date(dia);
          if (hh < 19) n.setHours(20, 30, 0, 0); else n.setHours(Math.min(22, hh + 1), hh + 1 >= 22 ? 0 : mm, 0, 0);
          if (n.getTime() - q.getTime() >= 45 * 60000) lista.push({ q: n.getTime(), t: "Ainda dá tempo", x: `Sua sessão de hoje leva ${minDe(j)} minutos. Que tal agora?` });
        } else if (p.notif === "tudo") {
          const q = new Date(dia); q.setHours(9 + Math.floor(r() * 10), Math.floor(r() * 4) * 15, 0, 0);
          const tipo = dd % 5;
          let t, x;
          if (tipo === 0 || tipo === 3) { const v = versoDoDia(dia); t = "Palavra para hoje"; x = `“${v.t}” (${v.ref})`; }
          else if (tipo === 1 && ultima) { t = "Para pensar hoje"; x = ultima.pergunta; }
          else if (tipo === 2 && ultima) { t = "Lembrou da prática?"; x = ultima.pratica; }
          else { t = "Semear"; x = LEVES[Math.floor(r() * LEVES.length)]; }
          lista.push({ q: q.getTime(), t, x });
        }
      }
      if (teste) lista.unshift({ q: agora + 5000, t: "Tudo certo com as notificações", x: `Olá, ${nome}! É assim que os lembretes vão chegar.` });
    }
    const futuras = lista.filter(n => n.q > Date.now()).sort((a, b) => a.q - b.q).slice(0, 40);
    window.AppNativo.agendar(JSON.stringify(futuras));
  } catch (e) {}
}

  const hoje = hojeISO();
  const e = S.diario.find(x => x.sid === SE.s.id && iso(new Date(x.data)) === hoje);
  if (e) e.texto = t; else S.diario.push({ id: "d" + Date.now().toString(36), sid: SE.s.id, pergunta: SE.s.pergunta, data: Date.now(), texto: t });
  if (S.diario.length > 300) S.diario = S.diario.slice(-300);
  salvar();
}
function concluir() {
  const { s, revisao, bonus } = SE, j = S.jornada, ganhos = [];
  const nvAntes = nivel(S.xp).i;
  const add = (n, t) => { S.xp += n; ganhos.push([t, n]); };
  if (SE.fezPratica && !S.praticas[s.id]) { S.praticas[s.id] = Date.now(); add(10, "Prática da semana"); }
  let fimJornada = false;
  if (!revisao) {
    if (bonus) { if (!S.bonus[s.id]) { S.bonus[s.id] = Date.now(); add(20, "Sessão bônus concluída"); } }
    else if (!j.feitas[s.id]) {
      j.feitas[s.id] = Date.now();
      S.feitas[s.id] = (S.feitas[s.id] || 0) + 1;
      if (j.com !== "sozinho") S.juntas = (S.juntas || 0) + 1;
      add(20, "Sessão concluída");
      if (S.diario.some(e => e.sid === s.id && iso(new Date(e.data)) === hojeISO()) && !(S.diarioXp && S.diarioXp[s.id])) { S.diarioXp = S.diarioXp || {}; S.diarioXp[s.id] = 1; add(10, "Escreveu no diário"); }
      if (SE.oculto >= 2) add(5, "Versículo memorizado");
      const wk = semanaChave(new Date());
      S.semanas[wk] = (S.semanas[wk] || 0) + 1;
      if (S.semanas[wk] >= j.freq && !S.metas[wk]) { S.metas[wk] = true; add(50, "Meta da semana cumprida"); }
      if (proximaIdx(j) === -1) { j.concluida = true; fimJornada = true; add(200, "Jornada concluída"); arquivaJornada("concluida"); }
    }
  }
  const novos = checaSelos({ hora: new Date().getHours() });
  const nvDepois = nivel(S.xp);
  salvar(); agendaNotif();
  const premio = nvDepois.i > nvAntes ? PREMIOS.find(p => p.nivel === nvDepois.i) : null;
  const idx = j ? proximaIdx(j) : -1, prox = idx >= 0 ? SESS[j.sessoes[idx]] : null;
  const ag = j ? agenda(j) : [];
  $("#camada").innerHTML = `<div class="tela"><div class="tela-in"><div class="fim">
    <div class="ok">${ico("check", 50, 3)}</div>
    <h1>${fimJornada ? "Jornada concluída!" : revisao ? "Bom rever" : "Sessão concluída"}</h1>
    <p class="muted">${fimJornada ? `Você completou “${esc(j.titulo)}”. Que Deus continue guiando seus passos, ${esc(S.perfil.nome)}.` : revisao ? "Voltar à Palavra sempre faz bem." : "Que esta palavra acompanhe o seu dia."}</p>
    ${ganhos.length ? `<div class="ganhos">${ganhos.map(([t, n], k) => `<div class="ganho" style="animation-delay:${.1 + k * .12}s"><span>${t}</span><b>+${n} XP</b></div>`).join("")}</div>` : ""}
    ${nvDepois.i > nvAntes ? `<div class="novo-selo"><span class="md">${arvore(nvDepois.i, 40)}</span><div><b>Novo nível: ${nvDepois.nome}</b><br><small class="muted">${premio ? "Prêmio liberado: " + premio.nome : "Continue crescendo."}</small></div></div>` : ""}
    ${novos.map(id => { const x = SELOS.find(z => z[0] === id); return `<div class="novo-selo"><span class="md">${ico(x[3], 24)}</span><div><b>Selo: ${x[1]}</b><br><small class="muted">${x[2]}</small></div></div>`; }).join("")}
    ${!bonus && prox ? `<div class="card" style="width:100%;text-align:left"><span class="rotulo">Próxima sessão · ${dataCurta(ag[idx])}</span><p style="font-weight:600;margin-top:4px">${esc(prox.titulo)}</p></div>` : ""}
    </div><div class="tela-acoes"><button class="btn" id="voltar-ini">${fimJornada ? "Ver minhas conquistas" : "Voltar ao início"}</button></div></div></div>`;
  if (ganhos.length || novos.length) confete(fimJornada ? 90 : 36);
  $("#voltar-ini").onclick = () => { $("#camada").innerHTML = ""; document.body.style.overflow = ""; SE = null; location.hash = fimJornada ? "#conquistas" : "#hoje"; rota(); };
}

/* ===================== utilidades de interface ===================== */
function confete(n) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("div"); c.className = "confete";
  const cores = ["var(--red)", "var(--gold)", "var(--ink)", "var(--gold-soft)"];
  for (let k = 0; k < n; k++) { const i = document.createElement("i"); i.style.left = Math.random() * 100 + "%"; i.style.background = cores[k % 4]; i.style.animationDuration = (1.6 + Math.random() * 1.6) + "s"; i.style.animationDelay = Math.random() * .4 + "s"; c.appendChild(i); }
  document.body.appendChild(c); setTimeout(() => c.remove(), 3800);
}
function modal(html) {
  const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div class="card" role="dialog" aria-modal="true">${html}</div>`;
  m.addEventListener("click", e => { if (e.target === m || e.target.closest("[data-fecha]")) fechaModal(); });
  document.body.appendChild(m);
}
function fechaModal() { document.querySelectorAll(".modal").forEach(m => m.remove()); }
let toastT;
function toast(t) { document.querySelectorAll(".toast").forEach(x => x.remove()); const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = t; document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2600); }

/* ===================== início ===================== */
S = lerLocal();
if (S && !S.perfil) S = null;
if (S && S.perfil && !S.perfil.hora) { S.perfil.hora = ({ manha: "07:00", tarde: "12:30", noite: "20:30" })[S.perfil.horario] || "20:30"; S.perfil.notif = S.perfil.notif || "tudo"; }
if (S && S.perfil && S.jornada && !S.premium) obFase = "plano";
rota();
conectaRemoto();
agendaNotif();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S && S.perfil) agendaNotif(); });
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
