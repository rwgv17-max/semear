<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Semear</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#EBEBE8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;1,400;1,500&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Semear">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: um app de celular de uma coluna (máx. 480px), barra de abas fixa embaixo; sessões abrem em tela cheia por cima. */
:root {
  --bg: #EBEBE8; --surface: #FFFFFF; --sunk: #E2E2DE; --ink: #161616; --muted: #66645F; --line: #D6D5D0;
  --red: #C6142A; --red-ink: #FFFFFF; --red-soft: #F7DDE0; --gold: #A8780F; --gold-soft: #F4E7C5; --ok: #2E7A4B;
  --shadow: 0 1px 2px rgba(20,18,14,.06), 0 8px 24px rgba(20,18,14,.07);
  --f-ui: "Poppins", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-word: "Crimson Pro", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --r: 18px; --tab: 68px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121114; --surface: #1C1A1F; --sunk: #242128; --ink: #F2EDE5; --muted: #A49E96; --line: #322E36;
  --red: #E5404F; --red-ink: #FFFFFF; --red-soft: #3A1A20; --gold: #E2B65B; --gold-soft: #3A3020; --ok: #5DBA80;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121114; --surface: #1C1A1F; --sunk: #242128; --ink: #F2EDE5; --muted: #A49E96; --line: #322E36;
  --red: #E5404F; --red-ink: #FFFFFF; --red-soft: #3A1A20; --gold: #E2B65B; --gold-soft: #3A3020; --ok: #5DBA80;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { margin: 0; line-height: 1.15; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; padding-block: 18px calc(var(--tab) + 28px + env(safe-area-inset-bottom, 0px)); }
.app.sem-abas { padding-bottom: 32px; }
.view { display: grid; gap: 18px; }
.rotulo { font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.word { font-family: var(--f-word); }

/* barra superior com os 7 traços (identidade da jornada) */
.topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.marca { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; line-height: 1.05; }
.marca svg { flex: none; }
.marca small { display: block; font-size: 10.5px; font-weight: 500; color: var(--muted); letter-spacing: .02em; margin-top: 2px; }
.broto-hero { width: 128px; height: 128px; margin-left: -10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 99px; background: var(--sunk); color: var(--ink); }
.chip.red { background: var(--red-soft); color: var(--red); }
.chip.gold { background: var(--gold-soft); color: var(--gold); }

.card { background: var(--surface); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 14px;
  background: var(--red); color: var(--red-ink); font-weight: 600; font-size: 15.5px; width: 100%; transition: transform .12s ease, opacity .2s; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn.sec { background: var(--sunk); color: var(--ink); }
.btn.ghost { background: transparent; color: var(--muted); min-height: 44px; font-weight: 500; }
.link { color: var(--red); font-weight: 600; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }

/* ---------- onboarding ---------- */
.ob { display: grid; gap: 22px; padding-top: 6px; }
.ob-prog { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
.ob-prog i { height: 5px; border-radius: 3px; background: var(--line); }
.ob-prog i.on { background: var(--red); }
.ob h1 { font-size: 27px; font-weight: 700; }
.ob .sub { color: var(--muted); font-size: 15px; }
.opcoes { display: grid; gap: 10px; }
.opcoes.duas { grid-template-columns: repeat(var(--n, 2), 1fr); }
[hidden] { display: none !important; }
.op { text-align: left; background: var(--surface); border: 2px solid transparent; border-radius: 16px; padding: 14px 16px; display: flex; gap: 13px; align-items: center;
  box-shadow: var(--shadow); transition: border-color .15s, transform .12s; min-width: 0; }
.op:active { transform: scale(.985); }
.op[aria-pressed="true"] { border-color: var(--red); }
.op .ic { flex: none; width: 42px; height: 42px; border-radius: 12px; background: var(--sunk); display: grid; place-items: center; color: var(--ink); }
.op[aria-pressed="true"] .ic { background: var(--red); color: var(--red-ink); }
.op b { display: block; font-weight: 600; font-size: 15px; line-height: 1.25; }
.op small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.35; margin-top: 2px; }
.op.num { justify-content: center; text-align: center; flex-direction: column; gap: 0; padding: 16px 8px; }
.op.num b { font-size: 26px; }
.dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dia { aspect-ratio: 1; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); font-weight: 600; font-size: 13px; border: 2px solid transparent; }
.dia[aria-pressed="true"] { background: var(--red); color: var(--red-ink); }
.campo { width: 100%; font: inherit; font-size: 17px; padding: 15px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.campo:focus { outline: none; border-color: var(--red); }
.ob-acoes { display: grid; gap: 6px; position: sticky; bottom: 0; padding: 12px 0 calc(8px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 28%); }
.hero-ob { display: grid; gap: 18px; padding-top: 20px; }
.hero-ob .sete { font-weight: 700; font-size: 132px; line-height: .78; color: var(--red); letter-spacing: -.05em; }
.hero-ob h1 { font-size: 34px; }
.lista-check { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.lista-check li { display: flex; gap: 10px; align-items: flex-start; }
.lista-check li::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: 8px; border-radius: 2px; background: var(--red); }

.montando { display: grid; place-items: center; align-content: center; text-align: center; gap: 16px; min-height: 70vh; }
.montando ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; color: var(--muted); }
.montando li.on { color: var(--ink); font-weight: 600; }
.spinner { width: 54px; height: 54px; border-radius: 50%; border: 5px solid var(--line); border-top-color: var(--red); animation: gira 0.9s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }

.plano-hero { background: var(--ink); color: var(--bg); border-radius: 22px; padding: 22px; display: grid; gap: 14px; }
.plano-hero .rotulo { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.plano-hero h1 { font-size: 28px; }
.plano-hero .chip { background: color-mix(in srgb, var(--bg) 14%, transparent); color: var(--bg); }
.semana-prev { display: grid; gap: 8px; }
.semana-prev h3 { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
.item-s { display: flex; gap: 12px; align-items: center; padding: 11px 14px; background: var(--surface); border-radius: 14px; }
.item-s .d { flex: none; width: 40px; text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; line-height: 1.2; }
.item-s .d b { display: block; font-size: 17px; color: var(--ink); }
.item-s .t { min-width: 0; }
.item-s .t b { display: block; font-size: 14.5px; font-weight: 600; line-height: 1.3; }
.item-s .t small { color: var(--muted); font-size: 12.5px; }

.paywall { display: grid; gap: 14px; }
.planos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.preco { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 2px; position: relative; }
.preco[aria-pressed="true"] { border-color: var(--red); }
.preco b { font-size: 22px; }
.preco small { color: var(--muted); font-size: 12px; }
.preco .tag { position: absolute; top: -10px; right: 10px; background: var(--gold); color: #fff; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; letter-spacing: .04em; }
.aviso-teste { font-size: 12.5px; color: var(--muted); text-align: center; }

/* ---------- abas ---------- */
.abas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line); padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.abas nav { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.abas a { display: grid; justify-items: center; gap: 2px; padding: 6px 0; color: var(--muted); text-decoration: none; font-size: 11.5px; font-weight: 500; }
.abas a[aria-current="page"] { color: var(--red); font-weight: 600; }

/* ---------- hoje ---------- */
.saud h1 { font-size: 26px; }
.saud p { color: var(--muted); }
.proxima { background: var(--ink); color: var(--bg); border-radius: 22px; padding: 20px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.proxima .rotulo { color: color-mix(in srgb, var(--bg) 65%, transparent); }
.proxima h2 { font-size: 24px; }
.proxima .ref { font-family: var(--f-word); font-style: italic; font-size: 18px; opacity: .85; }
.proxima .meta { display: flex; gap: 8px; flex-wrap: wrap; }
.proxima .chip { background: color-mix(in srgb, var(--bg) 14%, transparent); color: var(--bg); }
.proxima .btn { background: var(--red); }
.proxima .barras { position: absolute; right: 18px; top: 22px; display: flex; gap: 4px; }
.proxima .barras i { width: 14px; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--bg) 25%, transparent); }
.proxima .barras i.on { background: var(--red); }
.grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mini { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 8px; align-content: start; min-width: 0; }
.mini .n { font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.mini .n small { font-size: 14px; color: var(--muted); font-weight: 500; }
.anel { width: 64px; height: 64px; }
.palavra-dia { display: grid; gap: 10px; }
.palavra-dia blockquote { margin: 0; font-family: var(--f-word); font-size: 21px; line-height: 1.4; font-style: italic; }
.palavra-dia cite { font-style: normal; font-size: 13px; color: var(--muted); font-weight: 600; }
.semana-dots { display: flex; gap: 6px; }
.semana-dots span { flex: 1; display: grid; justify-items: center; gap: 4px; font-size: 10.5px; color: var(--muted); font-weight: 600; }
.semana-dots i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.semana-dots i.plan { border-color: var(--red); }
.semana-dots i.feito { background: var(--red); border-color: var(--red); color: var(--red-ink); }
.semana-dots span.hoje { color: var(--ink); }

/* ---------- jornada ---------- */
.jhead { display: grid; gap: 10px; }
.jhead h1 { font-size: 26px; }
.prog { height: 10px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--red); border-radius: 99px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.semana { display: grid; gap: 8px; }
.semana h3 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; display: flex; justify-content: space-between; }
.sess { width: 100%; text-align: left; display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); }
.sess .st { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.sess.feita .st { background: var(--red); border-color: var(--red); color: var(--red-ink); }
.sess.prox { outline: 2px solid var(--red); }
.sess.prox .st { border-color: var(--red); }
.sess .t { min-width: 0; flex: 1; }
.sess .t b { display: block; font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.sess .t small { color: var(--muted); font-size: 12.5px; }
.sess .dt { font-size: 12px; color: var(--muted); font-weight: 600; text-align: right; flex: none; }

/* ---------- conquistas ---------- */
.nivel-card { display: grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: center; }
.nivel-card h2 { font-size: 26px; }
.xpbar { height: 9px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--gold); }
.selos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.selo { background: var(--surface); border-radius: 16px; padding: 14px 8px; text-align: center; display: grid; justify-items: center; gap: 6px; box-shadow: var(--shadow); min-width: 0; }
.selo .md { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold); }
.selo.off .md { background: var(--sunk); color: var(--muted); opacity: .6; }
.selo b { font-size: 12.5px; line-height: 1.25; font-weight: 600; }
.selo small { font-size: 11px; color: var(--muted); line-height: 1.3; }
.selo.off b { color: var(--muted); }
.premios { display: grid; gap: 10px; }
.premio { display: flex; gap: 14px; align-items: center; padding: 14px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); text-align: left; width: 100%; }
.premio .pi { flex: none; width: 46px; height: 46px; border-radius: 13px; background: var(--gold-soft); color: var(--gold); display: grid; place-items: center; }
.premio.off .pi { background: var(--sunk); color: var(--muted); }
.premio .t { flex: 1; min-width: 0; }
.premio .t b { display: block; font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.premio .t small { color: var(--muted); font-size: 12.5px; }

/* ---------- perfil ---------- */
.linha { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.linha:last-child { border-bottom: 0; }
.linha span:last-child { font-weight: 600; text-align: right; }
.diario-item { display: grid; gap: 6px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.diario-item:last-child { border-bottom: 0; }
.diario-item p { font-family: var(--f-word); font-size: 18px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.diario-item small { color: var(--muted); font-size: 12px; font-weight: 600; }

/* ---------- sessão em tela cheia ---------- */
.tela { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; overscroll-behavior: contain;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tela-in { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 22px; }
.tela-top { display: flex; align-items: center; gap: 12px; }
.fechar { width: 40px; height: 40px; border-radius: 12px; background: var(--surface); display: grid; place-items: center; flex: none; box-shadow: var(--shadow); }
.passos { flex: 1; display: flex; gap: 4px; }
.passos i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.passos i.on { background: var(--red); }
.passo { flex: 1; display: grid; gap: 18px; align-content: start; animation: entra .35s cubic-bezier(.2,.8,.2,1); }
@keyframes entra { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.passo h2 { font-size: 26px; }
.passo .txt { font-size: 17px; line-height: 1.65; display: grid; gap: 14px; }
.escritura { background: var(--surface); border-radius: 20px; padding: 22px 20px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.escritura p { font-family: var(--f-word); font-size: 23px; line-height: 1.45; }
.escritura sup { font-family: var(--f-ui); font-size: 11px; font-weight: 700; color: var(--red); margin-right: 4px; vertical-align: 6px; }
.escritura .cred { font-size: 11px; color: var(--muted); }
.oracao-txt { font-family: var(--f-word); font-style: italic; font-size: 23px; line-height: 1.5; }
.respira { display: grid; place-items: center; gap: 18px; padding: 10px 0 0; text-align: center; }
.circulo { width: 170px; height: 170px; border-radius: 50%; background: radial-gradient(circle, var(--gold-soft), transparent 70%); display: grid; place-items: center; position: relative; }
.circulo::after { content: ""; position: absolute; inset: 22px; border-radius: 50%; border: 3px solid var(--gold); animation: resp 8s ease-in-out infinite; }
@keyframes resp { 0%,100% { transform: scale(.62); opacity: .55; } 45%,55% { transform: scale(1); opacity: 1; } }
.circulo span { font-size: 13px; font-weight: 600; color: var(--gold); z-index: 1; }
textarea.campo { min-height: 150px; resize: vertical; font-family: var(--f-word); font-size: 19px; line-height: 1.5; }
.salvo { font-size: 12.5px; color: var(--ok); font-weight: 600; min-height: 18px; }
.toggle { display: flex; gap: 12px; align-items: center; padding: 14px 16px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); width: 100%; text-align: left; border: 2px solid transparent; }
.toggle[aria-pressed="true"] { border-color: var(--ok); }
.toggle .bx { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; }
.toggle[aria-pressed="true"] .bx { background: var(--ok); border-color: var(--ok); color: #fff; }
.junto { background: var(--gold-soft); border-radius: 16px; padding: 14px 16px; display: grid; gap: 4px; }
.junto b { color: var(--gold); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.timer { font-size: 54px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }
.tela-acoes { display: grid; gap: 8px; position: sticky; bottom: 0; padding-top: 12px; background: linear-gradient(transparent, var(--bg) 30%); }

.na-pratica { background: var(--red-soft); border-radius: 18px; padding: 18px; display: grid; gap: 8px; }
.na-pratica .rotulo { color: var(--red); }
.na-pratica p { font-size: 16.5px; line-height: 1.6; }
.lista-num { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.mem p { line-height: 1.7; }
.mem .oc { color: var(--red); letter-spacing: .05em; font-family: var(--f-ui); font-size: 16px; }
.toggle .bx { font-size: 13px; font-weight: 700; }
a.btn { text-decoration: none; }
.passo.fixo { animation: none; }
/* conclusão */
.fim { text-align: center; display: grid; gap: 18px; justify-items: center; padding-top: 18px; }
.fim .ok { width: 96px; height: 96px; border-radius: 50%; background: var(--red); color: var(--red-ink); display: grid; place-items: center; animation: pop .55s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
.fim h1 { font-size: 30px; }
.ganhos { display: grid; gap: 8px; width: 100%; }
.ganho { display: flex; justify-content: space-between; padding: 12px 16px; background: var(--surface); border-radius: 14px; font-weight: 500; animation: entra .4s both; }
.ganho b { color: var(--gold); font-variant-numeric: tabular-nums; }
.novo-selo { display: flex; gap: 12px; align-items: center; text-align: left; padding: 14px; border-radius: 16px; background: var(--gold-soft); width: 100%; animation: entra .4s .3s both; }
.novo-selo .md { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--surface); color: var(--gold); display: grid; place-items: center; }
.confete { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.confete i { position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px; animation: cai linear forwards; }
@keyframes cai { to { transform: translateY(110vh) rotate(540deg); } }

/* modal */
.modal { position: fixed; inset: 0; z-index: 70; background: rgba(10,9,12,.5); display: grid; align-items: end; justify-items: center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.modal .card { width: 100%; max-width: 480px; display: grid; gap: 14px; animation: entra .3s; max-height: 88vh; overflow-y: auto; }
.cartao-verso { border-radius: 20px; padding: 30px 24px; background: var(--ink); color: var(--bg); display: grid; gap: 16px; }
.cartao-verso p { font-family: var(--f-word); font-size: 24px; line-height: 1.4; font-style: italic; }
.cartao-verso .barras { display: flex; gap: 4px; }
.cartao-verso .barras i { width: 16px; height: 4px; border-radius: 2px; background: var(--red); }
.cupom { font-size: 26px; font-weight: 700; letter-spacing: .12em; text-align: center; padding: 16px; border: 2px dashed var(--gold); border-radius: 14px; color: var(--gold); user-select: all; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab) + 18px + env(safe-area-inset-bottom, 0px)); z-index: 80; background: var(--ink); color: var(--bg);
  padding: 10px 18px; border-radius: 99px; font-size: 13.5px; font-weight: 600; animation: entra .25s; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

<script id="dados" type="application/json">{"temas":[{"id":"intimidade","nome":"Intimidade com Deus","sub":"Uma vida de oração mais real"},{"id":"casamento","nome":"Casamento","sub":"Mais união, diálogo e perdão"},{"id":"filhos","nome":"Filhos e família","sub":"Fé que passa de geração em geração"},{"id":"trabalho","nome":"Trabalho e vocação","sub":"Fé na segunda-feira de manhã"},{"id":"financas","nome":"Finanças e provisão","sub":"Contentamento, sabedoria e generosidade"},{"id":"ansiedade","nome":"Ansiedade e paz","sub":"Entregar o peso e descansar"},{"id":"relacionamentos","nome":"Perdão e relacionamentos","sub":"Curar mágoas e construir pontes"},{"id":"proposito","nome":"Propósito e decisões","sub":"Direção para os próximos passos"}],"sessoes":[{"id":"intimidade-01","tema":"intimidade","fase":1,"titulo":"Conhecido por inteiro","ref":"Salmo 139.1-10","link":"https://www.bible.com/pt/bible/129/PSA.139.1-10.NVI","versos":[[1,"Senhor, tu me sondas e me conheces."],[2,"Sabes quando me sento e quando me levanto; de longe percebes os meus pensamentos."],[3,"Sabes muito bem quando trabalho e quando descanso; todos os meus caminhos te são bem conhecidos."]],"r1":"Davi começa com uma frase que dá alívio e um pouco de medo: Deus o conhece por inteiro. Sabe quando ele senta e quando levanta, conhece seus pensamentos antes de virarem palavra.","r2":"Isso quer dizer que você não precisa se arrumar para falar com Deus. Ele já sabe o que você sente. A oração começa quando você para de esconder e simplesmente se apresenta como está.","r3":"Na prática, isso muda o jeito de começar a oração. Em vez de procurar as palavras certas, comece pelo que é verdade agora: 'Senhor, hoje estou cansado', 'hoje estou feliz', 'hoje não sei o que sinto'. Deus não precisa de apresentação. Ele quer encontro.","pergunta":"O que você tem evitado contar a Deus, mesmo sabendo que Ele já sabe?","pratica":"Hoje, separe dois minutos de silêncio e diga a Deus, com suas palavras, como você chegou até aqui nesta semana.","juntos":"","oracao":"Senhor, tu me conheces melhor do que eu mesmo. Não quero me esconder de ti. Recebe o que eu sou hoje, com o que está bem e com o que está fora do lugar. Em nome de Jesus, amém.","extra":{"ref":"Salmo 139.13-18","link":"https://www.bible.com/pt/bible/129/PSA.139.13-18.NVI","frase":"Continue a leitura e repare como Deus cuidou de você antes mesmo de você nascer."}},{"id":"intimidade-02","tema":"intimidade","fase":1,"titulo":"Um lugar secreto","ref":"Mateus 6.5-8","link":"https://www.bible.com/pt/bible/129/MAT.6.5-8.NVI","versos":[[6,"Mas quando você orar, vá para seu quarto, feche a porta e ore a seu Pai, que está no secreto. Então seu Pai, que vê no secreto, o recompensará."]],"r1":"Jesus não condena a oração em público. Ele fala de quem ora para ser visto. E propõe outra coisa: entrar no quarto, fechar a porta e falar com o Pai em segredo.","r2":"O quarto pode ser o carro antes de sair para o trabalho, a cozinha antes de todos acordarem ou o banho. O que importa é ter um lugar onde não há plateia, só você e Deus.","r3":"Ter um lugar fixo ajuda o corpo a entender que ali é hora de parar. Com o tempo, sentar naquele canto já acalma a mente. Se em algum dia o lugar não estiver disponível, não desista: um minuto no corredor também é quarto fechado quando o coração está aberto.","pergunta":"Qual pode ser o seu lugar secreto nesta jornada?","pratica":"Escolha um lugar e um horário fixos para as próximas sessões. Avise quem mora com você, se precisar.","juntos":"Combinem um momento da casa em que todos façam silêncio por alguns minutos, cada um no seu canto.","oracao":"Pai, obrigado por me ouvir mesmo quando ninguém vê. Ensina-me a buscar a tua presença e não a aprovação dos outros. Que este tempo seja só nosso. Amém."},{"id":"intimidade-03","tema":"intimidade","fase":1,"titulo":"Venham a mim","ref":"Mateus 11.28-30","link":"https://www.bible.com/pt/bible/129/MAT.11.28-30.NVI","versos":[[28,"Venham a mim, todos os que estão cansados e sobrecarregados, e eu lhes darei descanso."],[29,"Tomem sobre vocês o meu jugo e aprendam de mim, pois sou manso e humilde de coração, e vocês encontrarão descanso para as suas almas."]],"r1":"O convite de Jesus não é para quem está bem resolvido. É para os cansados e sobrecarregados. Ele não pede que você resolva tudo antes de chegar.","r2":"Jesus fala de um jugo suave. Jugo é a peça que une dois bois para puxarem juntos. A imagem é clara: Ele não tira você da vida, Ele caminha ao seu lado e divide o peso.","r3":"Descansar em Jesus não acontece só no domingo. Acontece no meio da semana, quando você para dois minutos no trabalho, respira e lembra que não está sozinho. Repita mentalmente o convite dEle sempre que sentir o peso aumentar: 'venham a mim'.","pergunta":"Que peso você está carregando sozinho hoje?","pratica":"Escreva em um papel três coisas que estão pesando. Leia em voz alta para Deus e entregue uma por uma.","juntos":"","oracao":"Jesus, eu aceito o teu convite. Estou cansado de carregar tudo sozinho. Ensina-me a caminhar no teu ritmo e a encontrar descanso em ti. Amém.","extra":{"ref":"Isaías 40.28-31","link":"https://www.bible.com/pt/bible/129/ISA.40.28-31.NVI","frase":"Isaías fala da força que Deus dá a quem está cansado."}},{"id":"intimidade-04","tema":"intimidade","fase":1,"titulo":"A voz do Pastor","ref":"João 10.1-15","link":"https://www.bible.com/pt/bible/129/JHN.10.1-15.NVI","versos":[[14,"Eu sou o bom pastor; conheço as minhas ovelhas; e elas me conhecem;"]],"r1":"Na época de Jesus, várias ovelhas dormiam no mesmo curral. De manhã, cada pastor chamava as suas, e elas reconheciam a voz dele no meio de todas as outras.","r2":"Reconhecer a voz de Deus é fruto de convivência. Quanto mais tempo você passa na Palavra e em oração, mais fácil fica separar a voz dEle do barulho de todo dia.","r3":"Uma forma simples de treinar o ouvido é terminar cada oração com alguns segundos de silêncio, perguntando: 'Senhor, o que queres me dizer?'. Nem sempre virá uma resposta clara. Mas quem cria o hábito de escutar percebe, com o tempo, quando a Palavra começa a falar mais alto que o barulho.","pergunta":"Quais vozes têm falado mais alto na sua vida ultimamente?","pratica":"Reduza hoje uma fonte de barulho: menos notícias, menos rede social ou um tempo sem fone de ouvido.","juntos":"","oracao":"Bom Pastor, quero conhecer a tua voz. Silencia em mim o que me afasta de ti e me ajuda a te seguir com confiança. Amém."},{"id":"intimidade-05","tema":"intimidade","fase":1,"titulo":"Sede de Deus","ref":"Salmo 42.1-5","link":"https://www.bible.com/pt/bible/129/PSA.42.1-5.NVI","versos":[[1,"Como a corça anseia por águas correntes, a minha alma anseia por ti, ó Deus."],[2,"A minha alma tem sede de Deus, do Deus vivo. Quando poderei entrar para apresentar-me a Deus?"]],"r1":"O salmista compara a falta de Deus à sede de uma corça. Sede não é um desejo qualquer. É uma necessidade que o corpo sente e não deixa você esquecer.","r2":"Às vezes a gente tenta matar essa sede com outras coisas: trabalho, distração, compras, aprovação. O salmo convida a dar nome à sede verdadeira e levá-la a quem pode saciá-la.","r3":"Repare nos momentos do dia em que o vazio aparece: o fim da tarde, a hora de deitar, o domingo à noite. São bons momentos para uma oração curta. Em vez de abrir o celular por reflexo, abra a conversa com Deus por alguns minutos.","pergunta":"Com o que você tem tentado preencher o vazio que só Deus preenche?","pratica":"Toda vez que beber água hoje, faça uma oração curta: 'Senhor, tenho sede de ti'.","juntos":"","oracao":"Deus, a minha alma tem sede de ti. Perdoa as vezes que procurei em outros lugares o que só tu podes dar. Enche o meu coração da tua presença. Amém.","extra":{"ref":"João 4.13-14","link":"https://www.bible.com/pt/bible/129/JHN.4.13-14.NVI","frase":"Jesus fala da água que mata a sede para sempre."}},{"id":"intimidade-06","tema":"intimidade","fase":2,"titulo":"Permanecer","ref":"João 15.1-11","link":"https://www.bible.com/pt/bible/129/JHN.15.1-11.NVI","versos":[[5,"Eu sou a videira; vocês são os ramos. Se alguém permanecer em mim e eu nele, esse dá muito fruto; pois sem mim vocês não podem fazer coisa alguma."]],"r1":"Jesus usa a imagem da videira. O ramo não dá fruto fazendo força. Dá fruto porque está ligado ao tronco, recebendo a seiva todos os dias.","r2":"Permanecer é uma palavra de constância. Não é ter um momento forte e sumir por semanas. É voltar todos os dias, mesmo nos dias sem vontade, para continuar ligado à fonte.","r3":"Permanecer também tem a ver com rotina. Ligar o celular de manhã e ler uma notificação antes de qualquer outra coisa é um hábito. Ler um versículo antes disso também pode ser. Pequenos hábitos repetidos são a forma mais concreta de continuar ligado à videira.","pergunta":"Em que área você tem tentado dar fruto com a sua própria força?","pratica":"Escolha um versículo desta leitura e coloque como tela de bloqueio do celular por uma semana.","juntos":"","oracao":"Jesus, tu és a videira e eu sou o ramo. Sem ti não consigo nada que dure. Quero permanecer em ti, nos dias bons e nos difíceis. Amém."},{"id":"intimidade-07","tema":"intimidade","fase":2,"titulo":"Marta e Maria","ref":"Lucas 10.38-42","link":"https://www.bible.com/pt/bible/129/LUK.10.38-42.NVI","versos":[[41,"Respondeu o Senhor: Marta! Marta! Você está preocupada e inquieta com muitas coisas;"],[42,"todavia apenas uma é necessária. Maria escolheu a boa parte, e esta não lhe será tirada."]],"r1":"Marta estava servindo, o que é bom. Mas estava tão ocupada que se irritou com a irmã e até com Jesus. Maria escolheu sentar e ouvir.","r2":"Jesus não diz que o trabalho de Marta não importa. Ele diz que só uma coisa é necessária. Antes de fazer coisas para Deus, é preciso estar com Deus.","r3":"Talvez a sua agenda não mude esta semana. Mas a ordem pode mudar. Experimente colocar o encontro com Deus antes das tarefas, mesmo que por poucos minutos. Marta e Maria moravam na mesma casa. Dá para servir bem e ainda assim começar aos pés de Jesus.","pergunta":"Você tem sido mais Marta ou mais Maria nesta fase da vida?","pratica":"Antes de começar a lista de tarefas amanhã, faça cinco minutos de 'Maria': sente, leia um versículo e ore.","juntos":"","oracao":"Senhor, ando agitado com muitas coisas. Ensina-me a escolher a melhor parte, a me sentar aos teus pés antes de correr. Amém."},{"id":"intimidade-08","tema":"intimidade","fase":2,"titulo":"Aquietem-se","ref":"Salmo 46.1-11","link":"https://www.bible.com/pt/bible/129/PSA.46.1-11.NVI","versos":[[10,"Parem de lutar! Saibam que eu sou Deus! Serei exaltado entre as nações, serei exaltado na terra."]],"r1":"O salmo descreve terremotos, mares bravos e nações em guerra. No meio disso, Deus diz: parem e reconheçam que eu sou Deus.","r2":"Aquietar-se não é ficar sem fazer nada. É parar de tentar controlar o que não está nas suas mãos e lembrar quem governa a história.","r3":"Um bom exercício é listar o que está fora do seu controle hoje e, item por item, dizer: 'isso é contigo, Senhor'. Depois, escolha o que está ao seu alcance e faça com calma. Aquietar-se não é parar a vida. É parar de brigar com ela.","pergunta":"O que você está tentando controlar que não depende de você?","pratica":"Faça hoje três minutos de silêncio completo, sem pedir nada. Apenas respire e repita: 'Tu és Deus'.","juntos":"","oracao":"Deus, tu és o meu refúgio. Quando tudo parece tremer, me ajuda a parar e lembrar que tu continuas no controle. Amém."},{"id":"intimidade-09","tema":"intimidade","fase":2,"titulo":"O Pai nosso","ref":"Mateus 6.9-13","link":"https://www.bible.com/pt/bible/129/MAT.6.9-13.NVI","versos":[[9,"Vocês, orem assim: ‘Pai nosso, que estás nos céus! Santificado seja o teu nome."],[10,"Venha o teu Reino; seja feita a tua vontade, assim na terra como no céu."]],"r1":"Os discípulos pediram que Jesus os ensinasse a orar, e Ele deu um modelo curto. Começa olhando para Deus, antes de olhar para as necessidades.","r2":"Repare na ordem: o nome de Deus, o Reino, a vontade dEle, e só depois o pão, o perdão e a proteção. Quem ora assim aprende a colocar a vida no lugar certo.","r3":"Você pode usar o Pai Nosso como um roteiro durante a semana. Em cada dia, demore em uma frase: segunda, 'santificado seja o teu nome'; terça, 'venha o teu Reino'; e assim por diante. Uma oração conhecida ganha vida nova quando é feita devagar.","pergunta":"Qual parte do Pai Nosso é mais difícil de você dizer com sinceridade?","pratica":"Ore o Pai Nosso devagar, parando em cada frase para dizer com suas palavras o que ela significa para você hoje.","juntos":"Orem o Pai Nosso juntos, cada pessoa dizendo uma frase.","oracao":"Pai nosso, que estás nos céus, santificado seja o teu nome. Venha o teu Reino na minha casa, na minha rotina e no meu coração. Amém.","extra":{"ref":"Lucas 11.5-13","link":"https://www.bible.com/pt/bible/129/LUK.11.5-13.NVI","frase":"Jesus continua ensinando sobre insistir na oração."}},{"id":"intimidade-10","tema":"intimidade","fase":2,"titulo":"Quando Deus parece longe","ref":"Salmo 13.1-6","link":"https://www.bible.com/pt/bible/129/PSA.13.1-6.NVI","versos":[[5,"Eu, porém, confio em teu amor; o meu coração exulta em tua salvação."],[6,"Quero cantar ao Senhor pelo bem que me tem feito."]],"r1":"O salmo começa com quatro perguntas: até quando? Davi sente que Deus o esqueceu. A Bíblia não esconde esse sentimento, ela dá palavras a ele.","r2":"No final, nada mudou lá fora, mas Davi decide confiar. A fé não é ausência de dúvida. É continuar falando com Deus mesmo quando Ele parece em silêncio.","r3":"Se você está num tempo de silêncio de Deus, não precisa fingir que está tudo bem. Continue falando com Ele, mesmo que seja para dizer 'eu não te sinto'. Converse também com alguém de fé que você confia. Às vezes Deus responde pela voz de um amigo.","pergunta":"Você já passou por um tempo em que Deus pareceu distante? O que te ajudou?","pratica":"Escreva sua própria versão do Salmo 13: comece com suas perguntas honestas e termine com uma frase de confiança.","juntos":"","oracao":"Senhor, às vezes não te sinto perto. Mesmo assim, escolho confiar no teu amor. Ainda vou cantar pelo bem que tens feito. Amém."},{"id":"intimidade-11","tema":"intimidade","fase":3,"titulo":"Lâmpada para os pés","ref":"Salmo 119.105-112","link":"https://www.bible.com/pt/bible/129/PSA.119.105-112.NVI","versos":[[105,"A tua palavra é lâmpada que ilumina os meus passos e luz que clareia o meu caminho."]],"r1":"Uma lâmpada antiga iluminava só alguns passos à frente. Não mostrava a estrada inteira, mas mostrava onde pisar agora.","r2":"A Palavra de Deus funciona assim. Nem sempre mostra todo o futuro, mas ilumina a próxima decisão. Ler a Bíblia todo dia é acender a lâmpada para o passo de hoje.","r3":"Quando a dúvida aparecer nesta semana, faça a pergunta da lâmpada: o que eu já sei de Deus que ajuda nesta decisão? Muitas escolhas difíceis ficam mais simples quando a gente lembra do que já está claro: amor, verdade, justiça e cuidado com o próximo.","pergunta":"Qual é o próximo passo que você precisa de luz para dar?","pratica":"Antes de uma decisão hoje, por menor que seja, pergunte: o que eu já sei da Palavra que me ajuda aqui?","juntos":"","oracao":"Senhor, a tua Palavra é lâmpada para os meus pés. Não preciso ver tudo, só o próximo passo. Ilumina o meu caminho hoje. Amém.","extra":{"ref":"Salmo 119.9-16","link":"https://www.bible.com/pt/bible/129/PSA.119.9-16.NVI","frase":"Outros versos do mesmo salmo sobre guardar a Palavra no coração."}},{"id":"intimidade-12","tema":"intimidade","fase":3,"titulo":"Confissão que liberta","ref":"1 João 1.5-10","link":"https://www.bible.com/pt/bible/129/1JN.1.5-10.NVI","versos":[[9,"Se confessarmos os nossos pecados, ele é fiel e justo para perdoar os nossos pecados e nos purificar de toda injustiça."]],"r1":"João fala de andar na luz. Andar na luz não é ser perfeito. É não esconder, trazer à luz o que está errado.","r2":"A promessa é forte: se confessarmos, Deus é fiel e justo para perdoar e purificar. A culpa escondida pesa. A confissão abre espaço para a graça.","r3":"Confessar não é um momento de se humilhar diante de Deus. É um momento de alívio. Depois de confessar, troque a culpa por gratidão. Se o erro feriu alguém, o próximo passo pode ser pedir perdão também a essa pessoa. Andar na luz inclui os relacionamentos.","pergunta":"Existe algo que você precisa confessar a Deus hoje?","pratica":"Faça uma oração de confissão específica, dando nome ao erro. Depois agradeça pelo perdão, sem ficar se punindo.","juntos":"","oracao":"Pai, eu confesso [diga com suas palavras]. Obrigado porque és fiel para perdoar. Recebo o teu perdão e quero andar na luz. Amém.","extra":{"ref":"Salmo 32.1-5","link":"https://www.bible.com/pt/bible/129/PSA.32.1-5.NVI","frase":"Davi descreve o alívio de confessar."}},{"id":"intimidade-13","tema":"intimidade","fase":3,"titulo":"Gratidão em tudo","ref":"1 Tessalonicenses 5.16-18","link":"https://www.bible.com/pt/bible/129/1TH.5.16-18.NVI","versos":[[16,"Alegrem-se sempre."],[17,"Orem continuamente."],[18,"Dêem graças em todas as circunstâncias, pois esta é a vontade de Deus para vocês em Cristo Jesus."]],"r1":"Paulo escreve três ordens curtas: alegrem-se sempre, orem continuamente, deem graças em tudo. Ele escreveu isso a uma igreja que sofria perseguição.","r2":"Dar graças em tudo não é agradecer pelo que é ruim. É encontrar motivos de gratidão dentro de qualquer situação. A gratidão muda o jeito de enxergar o dia.","r3":"Gratidão cresce com prática. Se no primeiro dia você achar só uma coisa para agradecer, tudo bem. No terceiro, vai achar mais. Repare em detalhes: a água quente do banho, uma mensagem carinhosa, o pão na mesa. Quem agradece pelo pequeno aprende a enxergar Deus no dia a dia.","pergunta":"Quais são três coisas pelas quais você pode agradecer hoje, mesmo num dia difícil?","pratica":"Antes de dormir, anote três motivos de gratidão do dia. Repita por sete dias.","juntos":"No jantar, cada pessoa da casa conta um motivo de gratidão do dia.","oracao":"Senhor, obrigado. Mesmo no que não entendo, há marcas do teu cuidado. Ensina-me a enxergar e a agradecer. Amém."},{"id":"intimidade-14","tema":"intimidade","fase":3,"titulo":"De todo o coração","ref":"Marcos 12.28-34","link":"https://www.bible.com/pt/bible/129/MRK.12.28-34.NVI","versos":[[30,"Ame o Senhor, o seu Deus de todo o seu coração, de toda a sua alma, de todo o seu entendimento e de todas as suas forças’."]],"r1":"Perguntaram a Jesus qual era o mandamento mais importante. Ele respondeu com amor: amar a Deus com tudo, coração, alma, entendimento e força.","r2":"Amar a Deus de todo o coração é o centro da vida com Ele. Não é uma tarefa a mais na agenda. É a fonte de onde sai o amor pelos outros.","r3":"Amar a Deus com as forças pode significar servir alguém mesmo cansado. Com a mente, pode significar estudar a Bíblia com atenção. Com a alma, pode ser um tempo de adoração. Escolha uma dessas áreas esta semana e ofereça a Deus de propósito.","pergunta":"Qual parte de você ainda está fora desse amor: o coração, a mente, as forças?","pratica":"Escolha um gesto concreto de amor a Deus hoje: um tempo de louvor, uma oferta, um serviço escondido.","juntos":"","oracao":"Deus, quero te amar com tudo o que sou. Ocupa o centro da minha vida. Que o meu amor por ti transborde para quem está perto de mim. Amém."},{"id":"casamento-01","tema":"casamento","fase":1,"titulo":"Dois que se tornam um","ref":"Gênesis 2.18-24","link":"https://www.bible.com/pt/bible/129/GEN.2.18-24.NVI","versos":[[24,"Por essa razão, o homem deixará pai e mãe e se unirá à sua mulher, e eles se tornarão uma só carne."]],"r1":"Antes de qualquer outra instituição, Deus criou o casamento. Ele olhou para Adão e disse que não era bom o homem estar só.","r2":"Tornar-se um só não apaga quem cada um é. É construir algo novo que pertence aos dois. Isso pede deixar coisas para trás e escolher o outro todos os dias.","r3":"Uma forma prática de viver isso é tomar decisões importantes juntos. Antes de dizer sim a um compromisso, a uma compra grande ou a uma visita longa da família, pergunte ao cônjuge. Tornar-se um só passa pela agenda, pelo dinheiro e pelas prioridades.","pergunta":"O que o seu casamento ainda precisa 'deixar' para se tornar mais 'um'?","pratica":"Diga ao seu cônjuge, hoje, uma coisa em que vocês dois formam um bom time.","juntos":"Conversem: em que área vocês se sentem mais unidos? E em qual ainda estão separados?","oracao":"Senhor, obrigado pelo casamento que criaste. Ensina-nos a ser um, sem deixar de ser quem somos. Une o que está separado entre nós. Amém.","extra":{"ref":"Mateus 19.4-6","link":"https://www.bible.com/pt/bible/129/MAT.19.4-6.NVI","frase":"Jesus retoma este texto ao falar do casamento."}},{"id":"casamento-02","tema":"casamento","fase":1,"titulo":"O amor é paciente","ref":"1 Coríntios 13.4-7","link":"https://www.bible.com/pt/bible/129/1CO.13.4-7.NVI","versos":[[4,"O amor é paciente, o amor é bondoso. Não inveja, não se vangloria, não se orgulha."],[5,"Não maltrata, não procura seus interesses, não se ira facilmente, não guarda rancor."],[6,"O amor não se alegra com a injustiça, mas se alegra com a verdade."],[7,"Tudo sofre, tudo crê, tudo espera, tudo suporta."]],"r1":"Esse texto é lido em muitos casamentos, mas Paulo não o escreveu para noivos. Escreveu para uma igreja cheia de brigas. É um texto para os dias difíceis.","r2":"Repare que o amor aqui é descrito por atitudes: ser paciente, não guardar rancor, não buscar os próprios interesses. Amor, na Bíblia, é algo que se faz.","r3":"Leia de novo o texto e repare em quais atitudes você já pratica. Agradeça a Deus por elas. Depois, escolha a que mais falta e peça ajuda. Amor maduro não nasce pronto. Ele é treinado nos dias comuns, nos detalhes que ninguém vê.","pergunta":"Qual dessas atitudes do amor está mais em falta na sua casa hoje?","pratica":"Escolha uma atitude do texto e pratique de propósito com seu cônjuge nas próximas 24 horas.","juntos":"Leiam o texto em voz alta, trocando a palavra 'amor' pelo nome de cada um. Riam, e depois conversem.","oracao":"Pai, o meu amor tem limites, o teu não. Ensina-me a amar com paciência e bondade, sem guardar a conta dos erros. Amém."},{"id":"casamento-03","tema":"casamento","fase":1,"titulo":"Cordão de três dobras","ref":"Eclesiastes 4.9-12","link":"https://www.bible.com/pt/bible/129/ECC.4.9-12.NVI","versos":[[12,"Um homem sozinho pode ser vencido, mas dois conseguem defender-se. Um cordão de três dobras não se rompe com facilidade."]],"r1":"O texto fala de dois que trabalham juntos, que se levantam quando um cai, que se aquecem nas noites frias. E termina com um cordão de três dobras.","r2":"Muita gente lê aqui o casal com Deus no meio. Dois fios sozinhos se desgastam. Quando Deus é o terceiro fio, o cordão aguenta o que a vida puxar.","r3":"O terceiro fio não aparece sozinho. Ele é fortalecido quando o casal ora junto, mesmo que seja uma oração curta antes de dormir, quando vai junto à igreja, quando conversa sobre a fé. Se orar juntos ainda é estranho, comece com um minuto e uma frase cada um.","pergunta":"Em que momento recente um de vocês levantou o outro?","pratica":"Agradeça ao seu cônjuge por uma vez em que ele ou ela te ajudou a levantar.","juntos":"Façam uma oração juntos de mãos dadas, pedindo que Deus seja o terceiro fio.","oracao":"Senhor, sê o terceiro fio do nosso casamento. Quando um cair, que o outro levante. Quando a noite for fria, aquece o nosso lar. Amém."},{"id":"casamento-04","tema":"casamento","fase":1,"titulo":"Ouvir antes de falar","ref":"Tiago 1.19-20","link":"https://www.bible.com/pt/bible/129/JAS.1.19-20.NVI","versos":[[19,"Meus amados irmãos, tenham isto em mente: Sejam todos prontos para ouvir, tardios para falar e tardios para irar-se,"]],"r1":"Tiago dá uma regra simples: pronto para ouvir, tardio para falar, tardio para se irar. Parece óbvio, mas na hora da discussão a gente faz o contrário.","r2":"Ouvir de verdade é tentar entender o que o outro sente, não preparar a resposta enquanto ele fala. Muitas brigas acabam quando alguém se sente realmente ouvido.","r3":"Uma dica simples para as conversas difíceis: antes de responder, repita com suas palavras o que você entendeu. 'Você está dizendo que se sentiu sozinha naquela noite, é isso?'. Isso evita muita briga por mal-entendido e mostra que você está, de fato, ouvindo.","pergunta":"Quando foi a última vez que você ouviu seu cônjuge sem interromper?","pratica":"Hoje, pergunte 'como foi o seu dia?' e só ouça. Não dê conselho, não corrija, só faça perguntas.","juntos":"Cada um fala por três minutos sobre algo que preocupa. O outro só escuta e depois resume o que entendeu.","oracao":"Senhor, coloca um freio na minha língua e abre os meus ouvidos. Que o meu cônjuge se sinta ouvido e amado por mim. Amém."},{"id":"casamento-05","tema":"casamento","fase":2,"titulo":"Palavras que constroem","ref":"Efésios 4.29-32","link":"https://www.bible.com/pt/bible/129/EPH.4.29-32.NVI","versos":[[29,"Nenhuma palavra torpe saia da boca de vocês, mas apenas a que for útil para edificar os outros, conforme a necessidade, para que conceda graça aos que a ouvem."]],"r1":"Paulo pede que nenhuma palavra torpe saia da boca, só o que edifica. Edificar é construir. As palavras levantam paredes ou derrubam.","r2":"No casamento, a intimidade faz a gente baixar a guarda e às vezes falar do pior jeito justamente com quem mais ama. O sarcasmo e a crítica constante desgastam aos poucos.","r3":"Repare no tom, não só nas palavras. 'Você nunca ajuda' e 'eu queria sua ajuda nisso' falam do mesmo problema, mas abrem portas diferentes. Troque frases com 'você sempre' e 'você nunca' por frases que começam com 'eu sinto' ou 'eu preciso'.","pergunta":"Que frase você costuma usar que machuca mais do que ajuda?","pratica":"Faça um 'jejum de crítica' por um dia: nenhuma reclamação sobre o cônjuge, só elogios sinceros.","juntos":"Cada um diz ao outro uma frase que gostaria de ouvir com mais frequência.","oracao":"Pai, que as minhas palavras construam o meu casamento. Perdoa o que eu disse para ferir. Coloca na minha boca palavras de graça. Amém.","extra":{"ref":"Provérbios 18.21","link":"https://www.bible.com/pt/bible/129/PRO.18.21.NVI","frase":"A língua tem poder sobre a vida e a morte."}},{"id":"casamento-06","tema":"casamento","fase":2,"titulo":"Antes do sol se pôr","ref":"Efésios 4.26-27","link":"https://www.bible.com/pt/bible/129/EPH.4.26-27.NVI","versos":[[26,"Quando vocês ficarem irados, não pequem. Apaziguem a sua ira antes que o sol se ponha,"],[27,"e não dêem lugar ao diabo."]],"r1":"Paulo não proíbe sentir raiva. Ele diz: não pequem por causa dela e não deixem o sol se pôr sobre a ira de vocês.","r2":"Raiva guardada vira mágoa, e mágoa vira distância. Nem toda conversa se resolve numa noite, mas dá para não dormir de costas, com a porta fechada por dentro.","r3":"Nem toda conversa precisa terminar com solução naquela noite. Às vezes o melhor é dizer: 'estou chateado, mas quero resolver isso com você amanhã com calma'. O que não pode é a raiva virar silêncio por dias. O sol que se põe sobre a ira esfria o casamento.","pergunta":"Existe alguma mágoa antiga que ainda não foi conversada?","pratica":"Se houver algo pendente, dê o primeiro passo hoje com uma frase simples: 'podemos conversar sobre aquilo?'.","juntos":"Combinem uma regra para as próximas brigas: antes de dormir, cada um diz 'ainda estou chateado, mas estou com você'.","oracao":"Senhor, não quero que a raiva faça morada na nossa casa. Dá-me coragem para dar o primeiro passo e humildade para ouvir. Amém."},{"id":"casamento-07","tema":"casamento","fase":2,"titulo":"Submissão de mão dupla","ref":"Efésios 5.21-33","link":"https://www.bible.com/pt/bible/129/EPH.5.21-33.NVI","versos":[[21,"Sujeitem-se uns aos outros, por temor a Cristo."],[25,"Maridos, amem suas mulheres, assim como Cristo amou a igreja e entregou-se a si mesmo por ela"]],"r1":"Esse texto costuma gerar discussão, mas repare como ele começa: sujeitem-se uns aos outros. A submissão, aqui, vai nas duas direções, por respeito a Cristo.","r2":"Aos maridos, Paulo pede o amor mais alto possível: amar como Cristo amou a igreja e se entregou por ela. O padrão do casamento cristão é o serviço, não o controle.","r3":"Servir não é ser capacho. É escolher, por amor, pensar no outro primeiro. Na prática, pode ser fazer o café, cuidar das crianças para o outro descansar, ouvir sem pressa. Quando os dois servem, ninguém precisa disputar quem manda.","pergunta":"O que significaria, na prática, servir mais o seu cônjuge esta semana?","pratica":"Faça hoje uma tarefa que normalmente é do seu cônjuge, sem avisar e sem esperar agradecimento.","juntos":"Perguntem um ao outro: 'o que eu posso fazer esta semana para te ajudar?'.","oracao":"Jesus, tu amaste a ponto de te entregar. Ensina-nos a servir um ao outro como tu serviste. Livra o nosso lar do orgulho. Amém."},{"id":"casamento-08","tema":"casamento","fase":2,"titulo":"Perdoar de novo","ref":"Colossenses 3.12-14","link":"https://www.bible.com/pt/bible/129/COL.3.12-14.NVI","versos":[[13,"Suportem-se uns aos outros e perdoem as queixas que tiverem uns contra os outros. Perdoem como o Senhor lhes perdoou."]],"r1":"Paulo pede que a gente se vista de compaixão, bondade, humildade, mansidão e paciência. E acrescenta: suportem-se uns aos outros e perdoem.","r2":"Quem convive perdoa muitas vezes, às vezes pela mesma coisa. Perdoar não é fingir que não doeu. É decidir não cobrar a dívida, como Deus não cobra a nossa.","r3":"Perdoar pode ser um processo. Se a mágoa for grande, talvez seja preciso perdoar de novo amanhã, quando a lembrança voltar. Isso é normal. E, se houver situações de abuso ou violência, perdoar não significa permanecer em risco: procure ajuda pastoral e profissional.","pergunta":"Há algo que você perdoou só pela metade?","pratica":"Escreva o que você ainda cobra do seu cônjuge. Ore entregando isso a Deus e, se for o caso, rasgue o papel.","juntos":"Se for seguro e saudável, conversem sobre algo antigo e digam um ao outro: 'eu te perdoo'.","oracao":"Senhor, assim como me perdoaste, quero perdoar. Tira de mim a lista de cobranças. Veste-me de amor, que é o elo perfeito. Amém."},{"id":"casamento-09","tema":"casamento","fase":2,"titulo":"Bondade e bênção","ref":"1 Pedro 3.7-9","link":"https://www.bible.com/pt/bible/129/1PE.3.7-9.NVI","versos":[[8,"Quanto ao mais, tenham todos o mesmo modo de pensar, sejam compassivos, amem-se fraternalmente, sejam misericordiosos e humildes."],[9,"Não retribuam mal com mal nem insulto com insulto; pelo contrário, bendigam; pois para isso vocês foram chamados, para receberem bênção por herança."]],"r1":"Pedro pede que todos tenham o mesmo modo de pensar, compaixão, amor fraternal, misericórdia e humildade. E que não retribuam mal com mal.","r2":"No casamento, é fácil entrar no jogo do 'você fez, eu faço'. Pedro propõe o contrário: responder com bênção. Uma resposta bondosa quebra o ciclo.","r3":"Experimente esta semana responder uma provocação com uma pergunta gentil: 'você está bem? parece que o dia foi pesado'. Muitas vezes a irritação do outro esconde cansaço, preocupação ou medo. Abençoar é olhar além da reação e enxergar a pessoa.","pergunta":"Quando seu cônjuge erra, sua tendência é revidar, se fechar ou abençoar?","pratica":"Na próxima vez que sentir vontade de revidar, troque por uma frase gentil e observe o que acontece.","juntos":"Cada um conta ao outro qual gesto de bondade o faz se sentir mais amado.","oracao":"Pai, quero responder com bênção, não com troco. Dá-me um coração humilde e compassivo dentro de casa. Amém."},{"id":"casamento-10","tema":"casamento","fase":2,"titulo":"As raposinhas","ref":"Cânticos 2.10-15","link":"https://www.bible.com/pt/bible/129/SNG.2.10-15.NVI","versos":[[15,"Apanhem para nós as raposas, as raposinhas que estragam as vinhas, pois as nossas vinhas estão floridas."]],"r1":"Cântico dos Cânticos é um poema de amor entre um casal. No meio dele aparece um pedido curioso: apanhem as raposinhas que estragam as vinhas.","r2":"Grandes crises nem sempre começam grandes. Começam com pequenas coisas: falta de tempo a dois, celular na mesa, piadas que ferem. São raposinhas que vão comendo a vinha.","r3":"Uma boa ideia é marcar uma conversa de 'manutenção' por mês: o que está funcionando entre nós? O que está incomodando? As raposinhas são mais fáceis de pegar quando ainda são pequenas, antes de virarem mágoas grandes.","pergunta":"Quais são as 'raposinhas' que estão estragando o seu casamento?","pratica":"Escolha uma raposinha e elimine esta semana. Exemplo: celular fora do quarto depois das 22h.","juntos":"Façam juntos uma lista de raposinhas e escolham uma para combater esta semana.","oracao":"Senhor, protege o nosso casamento das pequenas coisas que vão nos afastando. Dá-nos olhos para perceber e coragem para mudar. Amém."},{"id":"casamento-11","tema":"casamento","fase":3,"titulo":"Amor que não se apaga","ref":"Cânticos 8.6-7","link":"https://www.bible.com/pt/bible/129/SNG.8.6-7.NVI","versos":[[7,"Nem muitas águas conseguem apagar o amor; os rios não conseguem levá-lo na correnteza. Se alguém oferecesse todas as riquezas da sua casa para adquirir o amor, seria totalmente desprezado."]],"r1":"O poema diz que nem muitas águas conseguem apagar o amor. É uma imagem de um amor que resiste a enchentes.","r2":"Esse tipo de amor não depende só de sentimento, que vai e vem. Ele é alimentado por escolhas, por memória e por aliança. É ele que segura nos anos difíceis.","r3":"Guarde memórias de propósito: uma foto impressa, um bilhete, uma data celebrada. Nos dias difíceis, essas lembranças ajudam a lembrar por que vocês escolheram caminhar juntos. O amor que resiste às águas é alimentado por gratidão.","pergunta":"O que já tentou apagar o amor de vocês e não conseguiu?","pratica":"Relembre com seu cônjuge um momento difícil que vocês atravessaram juntos e agradeça por terem passado por ele.","juntos":"Vejam fotos antigas de vocês e contem um ao outro o que mais admiravam no começo.","oracao":"Deus, que o nosso amor seja forte como o teu. Quando vierem as águas, guarda a chama acesa. Obrigado por tudo o que já atravessamos. Amém."},{"id":"casamento-12","tema":"casamento","fase":3,"titulo":"Servir um ao outro","ref":"Gálatas 5.13-15","link":"https://www.bible.com/pt/bible/129/GAL.5.13-15.NVI","versos":[[13,"Irmãos, vocês foram chamados para a liberdade. Mas não usem a liberdade para dar ocasião à vontade da carne; pelo contrário, sirvam uns aos outros mediante o amor."]],"r1":"Paulo diz que fomos chamados para a liberdade, mas não para usar a liberdade como desculpa para o egoísmo. Pelo contrário: sirvam uns aos outros em amor.","r2":"O casamento revela o nosso egoísmo como poucas coisas. Servir é o remédio. Não por obrigação, mas porque o amor de Cristo nos ensinou a pensar no outro.","r3":"Uma pergunta simples pode mudar o dia: 'tem alguma coisa que eu possa fazer por você hoje?'. Faça essa pergunta de verdade e esteja disposto a ouvir a resposta. Servir com alegria é uma das formas mais claras de dizer 'eu te amo'.","pergunta":"Em que situação do dia a dia o seu egoísmo aparece mais?","pratica":"Pergunte ao seu cônjuge qual pequena ajuda faria diferença no dia dele e faça.","juntos":"Escolham juntos uma forma de servir alguém fora de casa nesta semana.","oracao":"Jesus, livra-me de viver o casamento pensando só em mim. Ensina-me a servir com alegria, como tu serviste. Amém."},{"id":"casamento-13","tema":"casamento","fase":3,"titulo":"Casa sobre a rocha","ref":"Mateus 7.24-27","link":"https://www.bible.com/pt/bible/129/MAT.7.24-27.NVI","versos":[[24,"Portanto, quem ouve estas minhas palavras e as pratica é como um homem prudente que construiu a sua casa sobre a rocha."],[25,"Caiu a chuva, transbordaram os rios, sopraram os ventos e deram contra aquela casa, e ela não caiu, porque tinha seus alicerces na rocha."]],"r1":"As duas casas da parábola enfrentaram a mesma chuva e o mesmo vento. A diferença não estava na tempestade, estava no alicerce.","r2":"Todo casamento passa por tempestades. O que segura é o que foi construído antes: ouvir a Palavra e praticá-la. Alicerce se faz em dia de sol.","r3":"Alicerce também se constrói com tempo a dois. Separe pelo menos uma noite por mês só para vocês, mesmo que seja em casa, depois que as crianças dormirem. Casais que cuidam do relacionamento em tempos bons atravessam melhor os tempos ruins.","pergunta":"Que hábito pode fortalecer o alicerce do seu casamento?","pratica":"Proponha ao seu cônjuge um hábito simples: orar juntos um minuto antes de dormir.","juntos":"Escolham juntos um hábito para as próximas quatro semanas e marquem no calendário.","oracao":"Senhor, queremos construir sobre a rocha. Que a tua Palavra seja o alicerce da nossa casa, para que fique de pé em qualquer tempestade. Amém."},{"id":"casamento-14","tema":"casamento","fase":3,"titulo":"Renovar a aliança","ref":"Rute 1.16-17","link":"https://www.bible.com/pt/bible/129/RUT.1.16-17.NVI","versos":[[16,"Rute, porém, respondeu: Não insistas comigo que te deixe e não mais a acompanhe. Aonde fores irei, onde ficares ficarei! O teu povo será o meu povo e o teu Deus será o meu Deus!"]],"r1":"Rute disse essas palavras à sogra, Noemi, numa hora de perda. Por isso a frase virou símbolo de compromisso: aonde você for, irei.","r2":"Aliança é mais que contrato. É dizer 'estou com você' quando não há nada a ganhar. Renovar esse compromisso de tempos em tempos lembra a escolha que vocês fizeram.","r3":"Renovar a aliança não exige festa. Pode ser um momento simples, os dois de mãos dadas, dizendo em voz alta o que querem construir daqui para frente. Escrever essas frases e guardar ajuda a lembrar delas no próximo ano.","pergunta":"Se você fosse escrever seus votos hoje, o que diria?","pratica":"Escreva um bilhete ao seu cônjuge renovando seu compromisso, com suas palavras, e deixe onde ele vá encontrar.","juntos":"Façam uma pequena cerimônia: cada um lê um voto curto e vocês oram juntos.","oracao":"Senhor, renovo diante de ti o meu compromisso. Aonde meu cônjuge for, irei. Guarda a nossa aliança até o fim. Amém."},{"id":"filhos-01","tema":"filhos","fase":1,"titulo":"Uma fé que passa adiante","ref":"2 Timóteo 1.3-7","link":"https://www.bible.com/pt/bible/129/2TI.1.3-7.NVI","versos":[[5,"Recordo-me da sua fé não fingida, que primeiro habitou em sua avó Lóide e em sua mãe Eunice, e estou convencido de que também habita em você."]],"r1":"Paulo lembra que a fé de Timóteo começou com a avó Loide e a mãe Eunice. Antes de ser líder, Timóteo viu a fé dentro de casa.","r2":"Os filhos aprendem mais com o que veem do que com o que ouvem. Uma oração sincera na mesa, um pedido de perdão, a Bíblia aberta no sofá: é assim que a fé atravessa gerações.","r3":"Fé que passa adiante não precisa de grandes discursos. Uma oração antes da refeição, uma música de louvor no carro, um 'vamos orar por isso' quando o filho conta um problema. São gestos pequenos que dizem: Deus faz parte da nossa casa.","pergunta":"Quem passou a fé para você? O que você quer passar adiante?","pratica":"Deixe seus filhos verem você orando ou lendo a Bíblia hoje, sem fazer disso um sermão.","juntos":"Contem aos filhos como a fé chegou à família de vocês: quem orava, quem levou para a igreja.","oracao":"Senhor, obrigado por quem plantou fé em mim. Que os meus filhos vejam em mim uma fé sincera e queiram te seguir também. Amém."},{"id":"filhos-02","tema":"filhos","fase":1,"titulo":"Palavras no caminho","ref":"Deuteronômio 6.4-9","link":"https://www.bible.com/pt/bible/129/DEU.6.4-9.NVI","versos":[[6,"Que todas estas palavras que hoje lhe ordeno estejam em seu coração."],[7,"Ensine-as com persistência a seus filhos. Converse sobre elas quando estiver sentado em casa, quando estiver andando pelo caminho, quando se deitar e quando se levantar."]],"r1":"Deus pediu que o povo ensinasse a Palavra aos filhos sentados em casa, andando pelo caminho, ao deitar e ao levantar. A fé fazia parte da rotina.","r2":"Você não precisa de um culto formal todo dia. As melhores conversas sobre Deus acontecem no carro, na fila do mercado, na hora de colocar para dormir.","r3":"Aproveite as perguntas das crianças. Quando perguntarem por que alguém está triste, por que a gente ora, por que o mundo é como é, responda com calma e, quando couber, traga uma história ou um versículo. A fé ensinada no caminho é a que mais fica.","pergunta":"Em que momento da rotina você poderia conversar sobre Deus com seus filhos?","pratica":"Escolha um momento fixo da rotina (o caminho da escola, por exemplo) para falar de Deus com naturalidade esta semana.","juntos":"Hoje, na hora de dormir, contem aos filhos uma história da Bíblia com suas palavras e orem juntos.","oracao":"Pai, que a tua Palavra esteja no meu coração e na minha boca. Ensina-me a falar de ti com naturalidade dentro de casa. Amém."},{"id":"filhos-03","tema":"filhos","fase":1,"titulo":"Herança do Senhor","ref":"Salmo 127.1-5","link":"https://www.bible.com/pt/bible/129/PSA.127.1-5.NVI","versos":[[1,"Se não for o Senhor o construtor da casa, será inútil trabalhar na construção. Se não é o Senhor que vigia a cidade, será inútil a sentinela montar guarda."],[3,"Os filhos são herança do Senhor, uma recompensa que ele dá."]],"r1":"O salmo começa lembrando que, se o Senhor não edificar a casa, é inútil o trabalho de quem a constrói. Depois chama os filhos de herança do Senhor.","r2":"Herança é algo que recebemos e não merecemos. Filhos não são propriedade nem projeto pessoal. São um presente que Deus confia a nós por um tempo.","r3":"Uma forma de viver esse salmo é tirar o peso da perfeição. Você não precisa ser um pai ou mãe perfeito. Precisa ser presente e confiar que Deus edifica a casa junto com você. Peça ajuda a Ele nas decisões difíceis da educação.","pergunta":"Como você enxerga seus filhos no dia a dia: como peso, como projeto ou como presente?","pratica":"Escreva o nome de cada filho e, ao lado, uma qualidade que você agradece a Deus por ver nele.","juntos":"Diga a cada filho, olhando nos olhos, uma qualidade que você admira nele.","oracao":"Senhor, edifica tu a minha casa. Obrigado pelos filhos que me confiaste. Ajuda-me a cuidar deles como herança tua. Amém."},{"id":"filhos-04","tema":"filhos","fase":1,"titulo":"Não irritem seus filhos","ref":"Efésios 6.1-4","link":"https://www.bible.com/pt/bible/129/EPH.6.1-4.NVI","versos":[[4,"Pais, não irritem seus filhos; antes criem-nos segundo a instrução e o conselho do Senhor."]],"r1":"Paulo pede aos filhos que obedeçam e aos pais que não provoquem os filhos à ira. A autoridade dos pais vem junto com responsabilidade.","r2":"Provocar à ira é corrigir com humilhação, cobrar sem explicar, prometer e não cumprir, comparar com outros. A disciplina cristã educa sem esmagar.","r3":"Corrigir com firmeza e calma é um aprendizado. Antes de corrigir, pergunte a si mesmo: estou corrigindo para ensinar ou para descarregar a minha raiva? Explique o porquê da regra. Filhos que entendem os motivos crescem mais seguros.","pergunta":"Que atitude sua pode estar irritando seus filhos sem você perceber?","pratica":"Se você foi duro demais recentemente, peça desculpas ao seu filho. Isso ensina mais do que mil sermões.","juntos":"Perguntem aos filhos, com calma: 'tem alguma coisa que eu faço que te deixa chateado?'. Só ouçam.","oracao":"Pai, quero educar como tu me educas: com firmeza e amor. Perdoa as vezes em que fui duro demais. Amém.","extra":{"ref":"Colossenses 3.21","link":"https://www.bible.com/pt/bible/129/COL.3.21.NVI","frase":"Paulo repete o conselho para que os filhos não desanimem."}},{"id":"filhos-05","tema":"filhos","fase":1,"titulo":"Ensinar o caminho","ref":"Provérbios 22.1-6","link":"https://www.bible.com/pt/bible/129/PRO.22.1-6.NVI","versos":[[6,"Instrua a criança segundo os objetivos que você tem para ela, e mesmo com o passar dos anos não se desviará deles."]],"r1":"Provérbios fala em ensinar a criança no caminho em que deve andar. A imagem é de quem conduz alguém por uma trilha que conhece.","r2":"Não temos controle sobre as escolhas futuras dos filhos. Mas podemos mostrar o caminho com clareza e paciência, e confiar o resultado a Deus.","r3":"Os valores ficam mais claros quando aparecem em situações reais. Ao ver uma injustiça na TV, conversem sobre ela. Ao receber um troco errado, devolva na frente do filho. Ele vai lembrar mais do que viu do que de qualquer lição.","pergunta":"Que valores você mais quer que seus filhos levem para a vida?","pratica":"Escolha um valor e pense em um exemplo prático de como vivê-lo na frente dos filhos esta semana.","juntos":"Escrevam juntos, num papel, três valores da família e colem na geladeira.","oracao":"Senhor, ajuda-me a mostrar o caminho com a minha vida. O que eu não posso controlar, eu entrego a ti. Amém."},{"id":"filhos-06","tema":"filhos","fase":2,"titulo":"Deixem vir as crianças","ref":"Marcos 10.13-16","link":"https://www.bible.com/pt/bible/129/MRK.10.13-16.NVI","versos":[[14,"Quando Jesus viu isso, ficou indignado e lhes disse: Deixem vir a mim as crianças, não as impeçam; pois o Reino de Deus pertence aos que são semelhantes a elas."]],"r1":"Os discípulos acharam que as crianças atrapalhavam Jesus. Ele ficou indignado e pediu que as deixassem vir, abraçou-as e as abençoou.","r2":"Jesus deu às crianças um lugar de honra. Elas não são o futuro da igreja, são parte dela agora. A fé delas é real, mesmo simples.","r3":"Crianças têm uma fé simples e profunda. Às vezes, as orações delas ensinam os adultos. Convide seus filhos a orar por você esta semana. Isso mostra que a fé não é só dos grandes e que a voz deles importa para Deus e para a família.","pergunta":"Seus filhos se sentem bem-vindos para falar de Deus com você?","pratica":"Pergunte a um filho: 'como você imagina Jesus?'. Ouça com curiosidade, sem corrigir.","juntos":"Coloquem a mão sobre a cabeça de cada filho e façam uma bênção curta com o nome dele.","oracao":"Jesus, obrigado por acolher as crianças. Que os meus filhos se sintam sempre bem-vindos perto de ti. Abençoa cada um deles. Amém."},{"id":"filhos-07","tema":"filhos","fase":2,"titulo":"Crescer em sabedoria","ref":"Lucas 2.41-52","link":"https://www.bible.com/pt/bible/129/LUK.2.41-52.NVI","versos":[[52,"Jesus ia crescendo em sabedoria, estatura e graça diante de Deus e dos homens."]],"r1":"Jesus, aos doze anos, se perdeu dos pais em Jerusalém. Foi encontrado no templo, ouvindo e perguntando. Depois voltou para casa e era obediente a eles.","r2":"O texto termina dizendo que Jesus crescia em sabedoria, estatura e graça diante de Deus e das pessoas. É um retrato de crescimento completo: corpo, mente, fé e relacionamentos.","r3":"Cuidar de todas as áreas não significa ocupar todos os horários do filho. Às vezes, o que ele mais precisa é de tempo livre, de brincar, de conversar sem pressa. Observe seu filho esta semana e pergunte: do que ele está precisando agora?","pergunta":"Em qual dessas áreas seus filhos precisam de mais atenção agora?","pratica":"Escolha uma área e planeje um passo concreto para cuidar dela esta semana.","juntos":"Façam uma atividade juntos que ajude em uma dessas áreas: um passeio, um livro, uma conversa.","oracao":"Pai, que os meus filhos cresçam em sabedoria, em saúde e na tua graça. Dá-me discernimento para cuidar de cada área. Amém."},{"id":"filhos-08","tema":"filhos","fase":2,"titulo":"O pai que corre","ref":"Lucas 15.11-24","link":"https://www.bible.com/pt/bible/129/LUK.15.11-24.NVI","versos":[[20,"A seguir, levantou-se e foi para seu pai. Estando ainda longe, seu pai o viu e, cheio de compaixão, correu para seu filho, e o abraçou e beijou."]],"r1":"Na parábola, o filho mais novo exige a herança, vai embora e desperdiça tudo. Quando volta, o pai o vê de longe e corre para abraçá-lo.","r2":"Esse pai é um retrato de Deus. E também é um modelo para pais e mães: a porta de casa fica aberta, mesmo quando o filho erra feio.","r3":"Ser o pai ou a mãe da parábola é deixar claro que o amor não depende do desempenho. Notas, escolhas e comportamento importam, mas não decidem se o filho é amado. Essa segurança é o que dá coragem para ele voltar quando errar.","pergunta":"Seus filhos sabem que podem voltar para você depois de errar?","pratica":"Diga a um filho, com estas ou outras palavras: 'não existe erro que faça eu deixar de te amar'.","juntos":"Leiam a parábola juntos e perguntem aos filhos o que eles acham que o pai sentiu.","oracao":"Pai de misericórdia, obrigado por correr ao meu encontro. Faz da minha casa um lugar para onde os meus filhos sempre queiram voltar. Amém."},{"id":"filhos-09","tema":"filhos","fase":2,"titulo":"Contar as obras de Deus","ref":"Salmo 78.1-7","link":"https://www.bible.com/pt/bible/129/PSA.78.1-7.NVI","versos":[[4,"Não os esconderemos dos nossos filhos; contaremos à próxima geração os louváveis feitos do Senhor, o seu poder e as maravilhas que fez."]],"r1":"O salmista diz que não vai esconder dos filhos as obras do Senhor. Ele quer que a próxima geração conheça o que Deus fez.","r2":"Toda família tem histórias de cuidado de Deus: uma porta que se abriu, uma doença superada, uma provisão inesperada. Contar essas histórias fortalece a fé dos filhos.","r3":"Uma ideia: crie um caderno da família onde vocês anotam respostas de oração e momentos em que viram o cuidado de Deus. Em datas especiais, leiam juntos. As crianças vão crescer sabendo que a fé da família tem história.","pergunta":"Qual história da sua família mostra o cuidado de Deus?","pratica":"Escreva essa história em poucas linhas para não se perder.","juntos":"Contem essa história aos filhos hoje, no jantar ou antes de dormir.","oracao":"Senhor, não quero esconder dos meus filhos o que fizeste por nós. Que eles conheçam as tuas obras e confiem em ti. Amém."},{"id":"filhos-10","tema":"filhos","fase":3,"titulo":"Disciplina com amor","ref":"Hebreus 12.7-11","link":"https://www.bible.com/pt/bible/129/HEB.12.7-11.NVI","versos":[[11,"Nenhuma disciplina parece ser motivo de alegria no momento, mas sim de tristeza. Mais tarde, porém, produz fruto de justiça e paz para aqueles que por ela foram exercitados."]],"r1":"O autor de Hebreus admite: nenhuma disciplina parece agradável na hora. Mas depois produz fruto de justiça e paz.","r2":"Disciplinar não é descontar a raiva. É corrigir com um objetivo: formar caráter. Deus nos disciplina porque nos ama, e os pais refletem isso quando corrigem com calma.","r3":"Depois de corrigir, faça as pazes. Um abraço, um 'eu te amo mesmo quando preciso te corrigir'. Isso mostra que a disciplina não é rejeição. Deus nos corrige e continua nos chamando de filhos. É esse o modelo.","pergunta":"Você corrige seus filhos mais quando está calmo ou quando está com raiva?","pratica":"Defina uma regra pessoal: nunca corrigir no pico da raiva. Respire, espere e depois converse.","juntos":"Combinem com os filhos, de forma clara, duas regras da casa e as consequências.","oracao":"Pai, ensina-me a corrigir com amor e paciência. Que a disciplina na minha casa produza paz e não medo. Amém."},{"id":"filhos-11","tema":"filhos","fase":3,"titulo":"Eu e a minha casa","ref":"Josué 24.14-15","link":"https://www.bible.com/pt/bible/129/JOS.24.14-15.NVI","versos":[[15,"Se, porém, não lhes agrada servir ao Senhor, escolham hoje a quem irão servir, se aos deuses que os seus antepassados serviram além do Eufrates, ou aos deuses dos amorreus, em cuja terra vocês estão vivendo. Mas, eu e a minha família serviremos ao Senhor."]],"r1":"Josué reuniu o povo e pediu uma decisão: a quem vocês vão servir? E antes que respondessem, ele declarou por si e por sua família.","r2":"Essa decisão não é uma frase bonita na parede. É escolher, dia após dia, quem vai estar no centro da casa: nas prioridades, no uso do tempo e no jeito de tratar uns aos outros.","r3":"Escolher servir ao Senhor como família pode começar com algo pequeno: um momento semanal de culto no lar, a oração na hora de dormir, um compromisso com a igreja. Decidam juntos qual será o primeiro passo da casa de vocês.","pergunta":"O que, na prática, mostra quem está no centro da sua casa?","pratica":"Escolha uma prioridade da família para ajustar esta semana.","juntos":"Leiam juntos o versículo 15 e cada pessoa diz o que ele significa para ela.","oracao":"Senhor, eu e a minha casa queremos te servir. Ocupa o centro do nosso lar. Amém."},{"id":"filhos-12","tema":"filhos","fase":3,"titulo":"Ana entrega o filho","ref":"1 Samuel 1.24-28","link":"https://www.bible.com/pt/bible/129/1SA.1.24-28.NVI","versos":[[27,"Era este menino que eu pedia, e o Senhor concedeu-me o pedido."],[28,"Por isso, agora, eu o dedico ao Senhor. Por toda a sua vida será dedicado ao Senhor. E ali adorou o Senhor."]],"r1":"Ana orou por anos para ter um filho. Quando Samuel nasceu, ela cumpriu a promessa e o consagrou a Deus.","r2":"Consagrar um filho é reconhecer que ele pertence primeiro a Deus. Isso tira de nós o peso de controlar tudo e nos coloca no lugar de cuidadores.","r3":"Consagrar os filhos alivia o coração dos pais. Você continua cuidando, educando e protegendo, mas sabe que não está sozinho. Quando a preocupação apertar, repita a oração de Ana: 'este filho eu entreguei ao Senhor'.","pergunta":"O que é mais difícil para você entregar a Deus em relação aos seus filhos?","pratica":"Faça uma oração consagrando cada filho, pelo nome, a Deus.","juntos":"Coloquem as mãos sobre cada filho e consagrem a vida dele a Deus em uma oração curta.","oracao":"Senhor, este filho eu pedi e tu me deste. Eu o entrego a ti. Cuida dele onde eu não posso alcançar. Amém."},{"id":"filhos-13","tema":"filhos","fase":3,"titulo":"A casa que ora junta","ref":"Atos 16.25-34","link":"https://www.bible.com/pt/bible/129/ACT.16.25-34.NVI","versos":[[31,"Eles responderam: Creia no Senhor Jesus, e serão salvos, você e os de sua casa."]],"r1":"Paulo e Silas estavam presos e cantavam à meia-noite. Depois de um terremoto, o carcereiro perguntou o que fazer para ser salvo, e a resposta envolveu a casa dele.","r2":"Naquela noite a família inteira ouviu a Palavra, se alegrou e recebeu Paulo e Silas à mesa. A fé de um começou a alcançar todos.","r3":"Orar juntos pode ser estranho no começo, principalmente com filhos adolescentes. Comece simples: cada um diz um motivo de gratidão e um pedido. Não force, não transforme em sermão. A constância faz mais do que a intensidade.","pergunta":"Quem da sua família você mais deseja ver perto de Deus?","pratica":"Ore hoje, pelo nome, por cada pessoa da sua casa.","juntos":"Façam uma roda de oração em que cada um ora pela pessoa à sua direita.","oracao":"Senhor Jesus, alcança toda a minha casa. Que cada um aqui conheça o teu amor. Amém."},{"id":"filhos-14","tema":"filhos","fase":3,"titulo":"Um lar como abrigo","ref":"Provérbios 24.3-4","link":"https://www.bible.com/pt/bible/129/PRO.24.3-4.NVI","versos":[[3,"Com sabedoria se constrói a casa, e com discernimento se consolida."],[4,"Pelo conhecimento os seus cômodos se enchem do que é precioso e agradável."]],"r1":"Provérbios diz que a casa se edifica com sabedoria, se firma com entendimento e se enche de tesouros pelo conhecimento.","r2":"Os tesouros de uma casa não são os móveis. São as memórias, o respeito, a confiança, o riso. Isso se constrói aos poucos, com decisões sábias.","r3":"Tesouros de família às vezes custam pouco: uma noite de pipoca, uma caminhada, uma conversa no fim do dia. O importante é estar presente de verdade, sem pressa e sem celular. É isso que os filhos levam quando saem de casa.","pergunta":"Que tesouro você gostaria que seus filhos levassem desta casa?","pratica":"Planeje um momento simples de família esta semana: uma refeição sem celular, um jogo, um passeio.","juntos":"Façam juntos o momento planejado e terminem com uma oração de gratidão.","oracao":"Senhor, dá-me sabedoria para edificar a minha casa. Que ela seja um abrigo cheio de tesouros que não se perdem. Amém."},{"id":"trabalho-01","tema":"trabalho","fase":1,"titulo":"Como
