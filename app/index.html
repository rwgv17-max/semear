para o Senhor","ref":"Colossenses 3.22-24","link":"https://www.bible.com/pt/bible/129/COL.3.22-24.NVI","versos":[[23,"Tudo o que fizerem, façam de todo o coração, como para o Senhor, e não para os homens,"]],"r1":"Paulo escreveu isso para escravos, pessoas sem escolha sobre o próprio trabalho. Mesmo assim, disse: façam tudo de coração, como para o Senhor.","r2":"Seu trabalho pode não ser o dos sonhos. Mas ele pode ser oferecido a Deus. Quando o chefe não vê, Deus vê. Isso muda a motivação de dentro para fora.","r3":"Uma forma prática de trabalhar para o Senhor é fazer bem até o que ninguém vai conferir: o relatório que só você lê, a limpeza do canto escondido, o atendimento ao cliente difícil. Excelência silenciosa é uma forma de adoração.","pergunta":"Para quem você tem trabalhado de verdade: para o salário, para o chefe ou para Deus?","pratica":"Antes de começar o trabalho amanhã, faça uma oração curta oferecendo o dia a Deus.","juntos":"","oracao":"Senhor, quero trabalhar como para ti. Que o meu esforço seja honesto, mesmo quando ninguém estiver olhando. Amém."},{"id":"trabalho-02","tema":"trabalho","fase":1,"titulo":"O trabalho é bom","ref":"Gênesis 2.8-15","link":"https://www.bible.com/pt/bible/129/GEN.2.8-15.NVI","versos":[[15,"O Senhor Deus colocou o homem no jardim do Éden para cuidar dele e cultivá-lo."]],"r1":"Antes de qualquer pecado, Deus colocou o homem no jardim para cuidar dele e cultivá-lo. O trabalho faz parte da criação, não é um castigo.","r2":"Cultivar e cuidar: duas palavras que dão sentido a qualquer trabalho. Seja numa empresa, numa loja ou em casa, você continua a obra de Deus de cuidar do mundo.","r3":"Na próxima vez que o trabalho parecer pequeno ou repetitivo, lembre que você está cuidando de algo ou de alguém. A comida que você prepara, o problema que você resolve, a casa que você mantém em ordem: tudo isso é cuidado com a criação.","pergunta":"Que parte do seu trabalho cuida de pessoas ou do mundo?","pratica":"Anote três formas em que o seu trabalho ajuda alguém, mesmo que indiretamente.","juntos":"","oracao":"Deus, obrigado pelo trabalho. Ajuda-me a ver nele uma forma de cuidar do que criaste e de servir pessoas. Amém."},{"id":"trabalho-03","tema":"trabalho","fase":1,"titulo":"José, fiel onde estava","ref":"Gênesis 39.1-6","link":"https://www.bible.com/pt/bible/129/GEN.39.1-6.NVI","versos":[[2,"O Senhor estava com José, de modo que este prosperou e passou a morar na casa do seu senhor egípcio."],[3,"Quando este percebeu que o Senhor estava com ele e que o fazia prosperar em tudo o que realizava,"]],"r1":"José foi vendido pelos irmãos e virou escravo no Egito. Lugar errado, situação injusta. Mesmo assim, o texto diz que o Senhor estava com ele e ele prosperava no que fazia.","r2":"José não esperou a situação ideal para ser fiel. Fez bem o trabalho que tinha nas mãos. Deus usou essa fidelidade no pequeno para levá-lo longe.","r3":"Fidelidade no lugar errado não é conformismo. José continuou sonhando, mas fez bem o que tinha nas mãos enquanto isso. Se você deseja mudar de emprego, prepare-se, procure, ore. E, enquanto estiver onde está, faça o seu melhor.","pergunta":"Você tem esperado o emprego ideal para dar o seu melhor?","pratica":"Escolha uma tarefa que você tem feito de qualquer jeito e faça hoje com excelência.","juntos":"","oracao":"Senhor, mesmo onde não escolhi estar, quero ser fiel. Que as pessoas percebam que estás comigo no meu trabalho. Amém."},{"id":"trabalho-04","tema":"trabalho","fase":1,"titulo":"A lição da formiga","ref":"Provérbios 6.6-11","link":"https://www.bible.com/pt/bible/129/PRO.6.6-11.NVI","versos":[[6,"Observe a formiga, preguiçoso, reflita nos caminhos dela e seja sábio!"],[7,"Ela não tem nem chefe, nem supervisor, nem governante,"],[8,"e ainda assim armazena as suas provisões no verão e na época da colheita ajunta o seu alimento."]],"r1":"Provérbios manda olhar para a formiga. Ninguém precisa mandar nela, e mesmo assim ela prepara no verão o que vai comer no inverno.","r2":"Diligência é constância nas pequenas coisas. Não é trabalhar até cair, é não deixar para depois o que precisa ser feito hoje.","r3":"Uma estratégia simples contra a procrastinação: dividir a tarefa grande em passos de 15 minutos e começar pelo primeiro. Muitas vezes, o mais difícil é só começar. A formiga não carrega o celeiro inteiro de uma vez. Ela carrega um grão de cada vez.","pergunta":"Que tarefa você está adiando há tempo demais?","pratica":"Resolva hoje a tarefa adiada, ou pelo menos o primeiro passo dela.","juntos":"","oracao":"Senhor, livra-me da preguiça e da procrastinação. Dá-me constância para fazer bem o que me cabe. Amém."},{"id":"trabalho-05","tema":"trabalho","fase":2,"titulo":"Daniel e a integridade","ref":"Daniel 6.1-10","link":"https://www.bible.com/pt/bible/129/DAN.6.1-10.NVI","versos":[[4,"Diante disso, os supervisores e os sátrapas procuraram motivos para acusar Daniel em sua administração governamental, mas nada conseguiram. Não puderam achar falta alguma nele, pois ele era fiel; não era desonesto nem negligente."]],"r1":"Os colegas de Daniel procuraram um erro no trabalho dele para derrubá-lo e não acharam nada. Ele era confiável e não havia corrupção nele.","r2":"Integridade é ser a mesma pessoa em qualquer lugar. Daniel continuou orando três vezes por dia mesmo sob ameaça. A fé dele aparecia no trabalho e fora dele.","r3":"Integridade é testada em pequenas decisões: o horário que você registra, o desconto que você inventa, o atestado que você pede. Cada escolha honesta constrói uma reputação que vale mais do que qualquer vantagem rápida.","pergunta":"Existe alguma área do seu trabalho em que você tem feito 'só um jeitinho'?","pratica":"Se houver algo errado, decida hoje como corrigir, mesmo que custe.","juntos":"","oracao":"Deus, quero ser íntegro como Daniel. Que não se ache em mim motivo de vergonha, e que a minha fé seja vista no meu trabalho. Amém."},{"id":"trabalho-06","tema":"trabalho","fase":2,"titulo":"O descanso também é ordem","ref":"Êxodo 20.8-11","link":"https://www.bible.com/pt/bible/129/EXO.20.8-11.NVI","versos":[[9,"Trabalharás seis dias e neles farás todos os teus trabalhos,"],[10,"mas o sétimo dia é o sábado dedicado ao Senhor teu Deus. Nesse dia não farás trabalho algum, nem tu, nem teus filhos ou filhas, nem teus servos ou servas, nem teus animais, nem os estrangeiros que morarem em tuas cidades."]],"r1":"No meio dos dez mandamentos, Deus ordena o descanso. Seis dias de trabalho e um dia separado. O próprio Deus descansou.","r2":"Descansar é um ato de confiança: o mundo não para se eu parar. Quem não descansa acaba trabalhando como se tudo dependesse só dele.","r3":"Descansar bem também é planejar. Defina um horário para parar de responder mensagens de trabalho. Reserve um tempo da semana para Deus, para a família e para você. O descanso de hoje é o que permite trabalhar melhor amanhã.","pergunta":"Quando foi seu último dia de descanso de verdade?","pratica":"Marque na agenda um período de descanso nesta semana e proteja esse tempo.","juntos":"Planejem juntos um tempo de descanso em família, sem trabalho e sem telas.","oracao":"Senhor, ensina-me a descansar em ti. Tira de mim a ideia de que tudo depende de mim. Amém.","extra":{"ref":"Marcos 2.27","link":"https://www.bible.com/pt/bible/129/MRK.2.27.NVI","frase":"Jesus explica que o sábado foi feito para o ser humano."}},{"id":"trabalho-07","tema":"trabalho","fase":2,"titulo":"Sal e luz","ref":"Mateus 5.13-16","link":"https://www.bible.com/pt/bible/129/MAT.5.13-16.NVI","versos":[[16,"Assim brilhe a luz de vocês diante dos homens, para que vejam as suas boas obras e glorifiquem ao Pai de vocês, que está nos céus."]],"r1":"Jesus diz que somos sal e luz. O sal dá sabor e conserva. A luz mostra o caminho. Os dois só funcionam quando estão no meio das coisas.","r2":"O trabalho é um dos lugares onde mais gente vê como você vive. Ser luz ali é tratar bem as pessoas, cumprir a palavra e ter esperança quando todos reclamam.","r3":"Ser luz no trabalho não é pregar para os colegas a toda hora. É ser a pessoa que não entra na fofoca, que ajuda quem está atrasado, que pede desculpas quando erra. Quando alguém perguntar por que você é assim, aí sim você conta.","pergunta":"Como as pessoas do seu trabalho descreveriam você?","pratica":"Faça hoje uma boa obra discreta para um colega: uma ajuda, um elogio, uma palavra de ânimo.","juntos":"","oracao":"Jesus, quero ser sal e luz onde trabalho. Que as pessoas vejam algo de ti no meu jeito de agir. Amém."},{"id":"trabalho-08","tema":"trabalho","fase":2,"titulo":"Planos nas mãos de Deus","ref":"Provérbios 16.1-9","link":"https://www.bible.com/pt/bible/129/PRO.16.1-9.NVI","versos":[[3,"Consagre ao Senhor tudo o que você faz, e os seus planos serão bem-sucedidos."],[9,"Em seu coração o homem planeja o seu caminho, mas o Senhor determina os seus passos."]],"r1":"Provérbios equilibra duas verdades: nós planejamos, mas é o Senhor quem dirige os passos. Consagrar os planos é entregá-los a Deus.","r2":"Planejar a carreira é sábio. Mas planejar sem Deus é arriscado. Quem consagra os planos fica livre para mudar de rota quando Deus mostrar outro caminho.","r3":"Escreva seus planos a lápis. Deus pode confirmar, ajustar ou mudar. Isso não é falta de foco. É reconhecer que Ele vê o que você não vê. Revise seus planos de tempos em tempos e pergunte se eles continuam alinhados com o que Deus mostrou.","pergunta":"Que plano profissional você precisa consagrar a Deus?","pratica":"Escreva seu principal plano profissional para este ano e ore entregando-o a Deus.","juntos":"","oracao":"Senhor, consagro a ti os meus planos. Dirige os meus passos, mesmo quando eles mudarem de direção. Amém."},{"id":"trabalho-09","tema":"trabalho","fase":2,"titulo":"Trabalhar com entusiasmo","ref":"Neemias 4.1-9","link":"https://www.bible.com/pt/bible/129/NEH.4.1-9.NVI","versos":[[6,"Nesse meio tempo fomos reconstruindo o muro, até que em toda a sua extensão chegamos à metade da sua altura, pois o povo estava totalmente dedicado ao trabalho."]],"r1":"Neemias liderava a reconstrução dos muros de Jerusalém. Houve zombaria e ameaças, mas o povo trabalhou com dedicação, orando e vigiando.","r2":"Todo projeto importante enfrenta oposição e desânimo. Neemias combinou duas coisas: oração e ação. Ele não escolheu entre confiar em Deus e trabalhar duro.","r3":"Neemias tinha uma oração curta para o meio do trabalho: 'lembra-te de mim, Senhor'. Você pode ter a sua. Escolha uma frase para repetir quando bater o desânimo, como 'Senhor, dá-me forças para continuar'.","pergunta":"Que projeto seu está enfrentando desânimo ou oposição?","pratica":"Dê hoje um passo concreto nesse projeto e ore por ele antes e depois.","juntos":"","oracao":"Deus, quando o desânimo vier, dá-me forças para continuar. Ensina-me a orar e a trabalhar com o mesmo empenho. Amém."},{"id":"trabalho-10","tema":"trabalho","fase":3,"titulo":"Quando o trabalho falta","ref":"Salmo 37.3-7","link":"https://www.bible.com/pt/bible/129/PSA.37.3-7.NVI","versos":[[5,"Entregue o seu caminho ao Senhor; confie nele, e ele agirá:"]],"r1":"Este salmo fala com quem vê os outros prosperarem enquanto a própria vida parece parada. O conselho é confiar, fazer o bem e entregar o caminho ao Senhor.","r2":"Desemprego e insegurança no trabalho mexem com a autoestima e com o sustento. Entregar o caminho a Deus não é cruzar os braços: é agir sem desespero.","r3":"Se o desemprego está batendo à sua porta ou à de alguém próximo, lembre que pedir ajuda não é fracasso. Converse com amigos, com a igreja, procure cursos gratuitos. Deus costuma abrir portas por meio de pessoas.","pergunta":"Como está a sua segurança no trabalho hoje?","pratica":"Se você ou alguém próximo está sem trabalho, faça hoje uma ação prática: atualizar o currículo, mandar uma mensagem, indicar uma vaga.","juntos":"","oracao":"Senhor, entrego a ti o meu caminho. Abre portas de trabalho para mim e para quem precisa. Afasta de nós o desespero. Amém."},{"id":"trabalho-11","tema":"trabalho","fase":3,"titulo":"Liderar servindo","ref":"Marcos 10.42-45","link":"https://www.bible.com/pt/bible/129/MRK.10.42-45.NVI","versos":[[43,"Não será assim entre vocês. Pelo contrário, quem quiser tornar-se importante entre vocês deverá ser servo;"],[44,"e quem quiser ser o primeiro deverá ser escravo de todos."]],"r1":"Jesus compara a liderança do mundo, que domina, com a liderança do Reino, que serve. Quem quiser ser grande, que seja servo.","r2":"Isso vale para quem lidera equipes, mas também para pais, irmãos mais velhos e qualquer um com alguma influência. Autoridade cristã existe para servir.","r3":"Liderar servindo aparece em atitudes concretas: reconhecer o trabalho da equipe em público, assumir a culpa quando algo dá errado, ouvir antes de decidir. Seja você chefe ou não, todos os dias há uma chance de servir quem está ao seu lado.","pergunta":"Sobre quem você tem alguma influência no trabalho ou em casa?","pratica":"Pergunte a alguém que depende de você: 'como posso te ajudar a fazer melhor o seu trabalho?'.","juntos":"","oracao":"Jesus, tu vieste para servir. Que eu use qualquer influência que tenho para servir e não para dominar. Amém."},{"id":"trabalho-12","tema":"trabalho","fase":3,"titulo":"Os talentos","ref":"Mateus 25.14-30","link":"https://www.bible.com/pt/bible/129/MAT.25.14-30.NVI","versos":[[21,"O senhor respondeu: ‘Muito bem, servo bom e fiel! Você foi fiel no pouco; eu o porei sobre o muito. Venha e participe da alegria do seu senhor!’"]],"r1":"Na parábola, cada servo recebe uma quantia diferente. O elogio do senhor não é pelo tamanho do resultado, mas pela fidelidade com o que foi confiado.","r2":"O servo que enterrou o talento tinha medo. O medo de errar também paralisa a gente no trabalho. Deus espera que usemos o que recebemos, mesmo correndo algum risco.","r3":"Pense em um talento que você usava e deixou de lado: cantar, ensinar, organizar, cozinhar, consertar. Que tal colocá-lo para funcionar de novo, no trabalho, na igreja ou na vizinhança? Talentos crescem quando são usados.","pergunta":"Que talento você tem enterrado por medo?","pratica":"Dê um passo para usar esse talento: ofereça ajuda, comece um curso, apresente uma ideia.","juntos":"","oracao":"Senhor, obrigado pelos dons que me deste. Livra-me do medo que paralisa. Quero ser fiel com o que confiaste a mim. Amém."},{"id":"trabalho-13","tema":"trabalho","fase":3,"titulo":"O prazer do trabalho","ref":"Eclesiastes 2.17-26","link":"https://www.bible.com/pt/bible/129/ECC.2.17-26.NVI","versos":[[24,"Para o homem não existe nada melhor do que comer, beber e encontrar prazer em seu trabalho. E vi que isso também vem da mão de Deus."]],"r1":"Eclesiastes começa com frustração: trabalhar tanto para quê? Mas termina reconhecendo que comer, beber e ter prazer no trabalho é presente de Deus.","r2":"O trabalho não precisa ser a fonte do seu valor nem o centro da sua vida. Quando Deus está no centro, dá para trabalhar com prazer e também saber parar.","r3":"Encontrar prazer no trabalho pode começar por mudar o foco: em vez de pensar só no que falta, repare no que deu certo hoje. Agradeça pelos colegas, pelo salário, pela capacidade de trabalhar. A gratidão transforma a rotina.","pergunta":"Que lugar o trabalho ocupa hoje na sua vida?","pratica":"Encontre hoje um momento de prazer simples no seu trabalho e agradeça a Deus por ele.","juntos":"","oracao":"Deus, tira de mim a frustração de trabalhar sem sentido. Que eu encontre prazer no trabalho e descanso em ti. Amém."},{"id":"trabalho-14","tema":"trabalho","fase":3,"titulo":"Trabalho que dura","ref":"1 Coríntios 15.58","link":"https://www.bible.com/pt/bible/129/1CO.15.58.NVI","versos":[[58,"Portanto, meus amados irmãos, mantenham-se firmes, e que nada os abale. Sejam sempre dedicados à obra do Senhor, pois vocês sabem que, no Senhor, o trabalho de vocês não será inútil."]],"r1":"Depois de falar da ressurreição, Paulo conclui: sejam firmes, dediquem-se ao trabalho do Senhor, porque ele não é em vão.","r2":"Nem todo esforço aparece no fim do mês. Mas nada do que é feito com amor e para Deus se perde. Essa certeza sustenta nos dias em que o trabalho parece inútil.","r3":"Nos dias em que tudo parecer em vão, olhe para trás e lembre de algo bom que o seu trabalho já produziu. Uma pessoa ajudada, uma família sustentada, um problema resolvido. Nada feito com amor e para Deus se perde.","pergunta":"Que esforço seu parece não ter dado em nada?","pratica":"Escreva um bilhete de agradecimento a alguém cujo trabalho costuma passar despercebido.","juntos":"","oracao":"Senhor, obrigado porque nada do que faço para ti é em vão. Dá-me firmeza para continuar. Amém."},{"id":"financas-01","tema":"financas","fase":1,"titulo":"O pão de cada dia","ref":"Provérbios 30.7-9","link":"https://www.bible.com/pt/bible/129/PRO.30.7-9.NVI","versos":[[8,"Mantém longe de mim a falsidade e a mentira; Não me dês nem pobreza nem riqueza; dá-me apenas o alimento necessário."],[9,"Se não, tendo demais, eu te negaria e te deixaria, e diria: ‘Quem é o Senhor?’ Se eu ficasse pobre, poderia vir a roubar, desonrando assim o nome do meu Deus."]],"r1":"Agur faz uma oração rara: não me dês pobreza nem riqueza, só o necessário. Ele sabia que a falta leva ao desespero e a sobra pode levar a esquecer Deus.","r2":"Pedir o suficiente é um ato de confiança. É reconhecer que o sustento vem de Deus e que o coração precisa de limite tanto quanto o bolso.","r3":"Uma conversa honesta com Deus sobre dinheiro começa por números reais. Saber quanto entra, quanto sai e para onde vai tira o dinheiro do campo do medo e o coloca no campo da administração. Orar sobre o orçamento é tão espiritual quanto orar pela família.","pergunta":"O que é 'o suficiente' para você e sua família hoje?","pratica":"Liste as despesas essenciais do mês e separe do que é desejo. Só observar já ajuda.","juntos":"Conversem sobre o que é essencial para a família e o que pode esperar.","oracao":"Pai, dá-me hoje o pão de cada dia. Livra-me da ansiedade da falta e da arrogância da sobra. Amém.","extra":{"ref":"Mateus 6.11","link":"https://www.bible.com/pt/bible/129/MAT.6.11.NVI","frase":"O mesmo pedido aparece no Pai Nosso."}},{"id":"financas-02","tema":"financas","fase":1,"titulo":"Aprender a ter contentamento","ref":"Filipenses 4.10-13","link":"https://www.bible.com/pt/bible/129/PHP.4.10-13.NVI","versos":[[11,"Não estou dizendo isso porque esteja necessitado, pois aprendi a adaptar-me a toda e qualquer circunstância."],[12,"Sei o que é passar necessidade e sei o que é ter fartura. Aprendi o segredo de viver contente em toda e qualquer situação, seja bem alimentado, seja com fome, tendo muito, ou passando necessidade."]],"r1":"Paulo escreveu essa carta preso. Ele diz que aprendeu a viver contente em qualquer situação, com fartura ou com fome.","r2":"Contentamento se aprende. Não é desistir de melhorar de vida. É não deixar que a sua paz dependa do que você tem ou deixa de ter.","r3":"Contentamento se treina em pequenas escolhas: adiar uma compra por uma semana, perguntar se aquilo é necessidade ou vontade, agradecer pelo que já tem antes de pensar no que falta. Com o tempo, a ansiedade de consumir perde força.","pergunta":"Em que área você tem vivido descontente?","pratica":"Passe um dia sem comprar nada que não seja essencial e observe como se sente.","juntos":"","oracao":"Senhor, ensina-me o segredo do contentamento. Que a minha paz esteja em ti e não no saldo da conta. Amém."},{"id":"financas-03","tema":"financas","fase":1,"titulo":"O amor ao dinheiro","ref":"1 Timóteo 6.6-10","link":"https://www.bible.com/pt/bible/129/1TI.6.6-10.NVI","versos":[[6,"De fato, a piedade com contentamento é grande fonte de lucro,"],[10,"pois o amor ao dinheiro é raiz de todos os males. Algumas pessoas, por cobiçarem o dinheiro, desviaram-se da fé e se atormentaram a si mesmas com muitos sofrimentos."]],"r1":"Paulo não diz que o dinheiro é mau. Diz que o amor ao dinheiro é raiz de muitos males. O problema é o lugar que ele ocupa no coração.","r2":"Quem ama o dinheiro nunca acha que tem o bastante. Piedade com contentamento, diz Paulo, é grande fonte de lucro.","r3":"Uma boa pergunta para fazer antes de decisões financeiras é: essa escolha me aproxima ou me afasta de Deus e das pessoas que amo? Dinheiro é ferramenta. Quando vira centro, começa a cobrar mais do que oferece.","pergunta":"O dinheiro tem ocupado que lugar nas suas decisões?","pratica":"Observe hoje quantas vezes você pensa em dinheiro e em que tom: preocupação, desejo, gratidão.","juntos":"","oracao":"Deus, guarda o meu coração do amor ao dinheiro. Que eu use o que tenho, sem ser usado por ele. Amém."},{"id":"financas-04","tema":"financas","fase":1,"titulo":"Onde está o seu tesouro","ref":"Mateus 6.19-24","link":"https://www.bible.com/pt/bible/129/MAT.6.19-24.NVI","versos":[[21,"Pois onde estiver o seu tesouro, aí também estará o seu coração."]],"r1":"Jesus diz que onde estiver o seu tesouro, ali estará o seu coração. Aquilo em que você investe mostra o que você ama.","r2":"Um jeito simples de saber onde está o coração é olhar o extrato do cartão. Ele conta uma história sobre as nossas prioridades.","r3":"Escolha uma prioridade que você quer ver refletida nos gastos: generosidade, tempo com a família, saúde, sair das dívidas. Separe um valor para ela no início do mês, não no fim. O que vem primeiro no orçamento mostra o que vem primeiro no coração.","pergunta":"O que o seu extrato bancário diz sobre o seu coração?","pratica":"Revise os gastos do último mês e marque o que reflete as prioridades que você quer ter.","juntos":"Revisem juntos os gastos do mês, sem acusações, só para entender a história que eles contam.","oracao":"Senhor, quero ajuntar tesouros no céu. Alinha o meu coração e os meus gastos com o que é eterno. Amém."},{"id":"financas-05","tema":"financas","fase":2,"titulo":"Fiel no pouco","ref":"Lucas 16.10-13","link":"https://www.bible.com/pt/bible/129/LUK.16.10-13.NVI","versos":[[10,"Quem é fiel no pouco, também é fiel no muito, e quem é desonesto no pouco, também é desonesto no muito."]],"r1":"Jesus diz que quem é fiel no pouco também é fiel no muito. A forma como tratamos pequenas quantias revela o nosso caráter.","r2":"Ser fiel no pouco é pagar o que deve, devolver o troco errado, não esconder gastos do cônjuge. São detalhes que formam uma vida confiável.","r3":"Fidelidade no pouco também aparece no trabalho: não usar o tempo da empresa para assuntos pessoais, prestar contas direito, não levar o que não é seu. Deus confia mais a quem cuida bem do que já tem.","pergunta":"Em que pequena coisa financeira você não tem sido tão fiel?","pratica":"Acerte hoje uma pendência pequena: uma conta, um empréstimo de amigo, um valor que precisa devolver.","juntos":"","oracao":"Senhor, quero ser fiel no pouco. Que eu seja confiável com o dinheiro, nas pequenas e nas grandes coisas. Amém."},{"id":"financas-06","tema":"financas","fase":2,"titulo":"Dívidas e liberdade","ref":"Provérbios 22.1-7","link":"https://www.bible.com/pt/bible/129/PRO.22.1-7.NVI","versos":[[7,"O rico domina sobre o pobre; quem toma emprestado é escravo de quem empresta."]],"r1":"Provérbios é direto: quem toma emprestado é servo de quem empresta. A dívida tira liberdade, sono e paz.","r2":"Nem toda dívida é pecado, mas viver endividado pesa sobre a família inteira. O primeiro passo para sair é encarar os números com honestidade.","r3":"Se as dívidas são muitas, procure orientação. Há cursos gratuitos de educação financeira e serviços que ajudam a renegociar. Comece pela dívida com juros mais altos. Cada parcela quitada é um passo de liberdade, e vale comemorar.","pergunta":"Como você se sente quando pensa nas suas dívidas?","pratica":"Faça uma lista de todas as dívidas, com valor e juros. Ver tudo no papel é o começo da saída.","juntos":"Façam juntos a lista das dívidas da família, sem culpar ninguém, e escolham qual atacar primeiro.","oracao":"Pai, eu quero ser livre. Dá-me sabedoria e disciplina para sair das dívidas, e paz enquanto caminho. Amém.","extra":{"ref":"Romanos 13.8","link":"https://www.bible.com/pt/bible/129/ROM.13.8.NVI","frase":"Paulo fala da única dívida que devemos manter."}},{"id":"financas-07","tema":"financas","fase":2,"titulo":"Calcular o custo","ref":"Lucas 14.28-30","link":"https://www.bible.com/pt/bible/129/LUK.14.28-30.NVI","versos":[[28,"Qual de vocês, se quiser construir uma torre, primeiro não se assenta e calcula o preço, para ver se tem dinheiro suficiente para completá-la?"]],"r1":"Jesus usa um exemplo de construção: ninguém começa uma torre sem calcular se tem dinheiro para terminá-la.","r2":"Planejar é sabedoria bíblica. Orçamento não é falta de fé. É cuidar bem do que Deus confiou e evitar começar o que não dá para terminar.","r3":"Planejar inclui pensar no inesperado: remédio, conserto do carro, conta que vem maior. Um orçamento que deixa uma pequena margem ajuda a não entrar em desespero quando o imprevisto chega. Planejamento é cuidado com o futuro da família.","pergunta":"Você tem um orçamento? Ele é real ou só fica na cabeça?","pratica":"Monte um orçamento simples para o próximo mês: entradas, gastos fixos, gastos variáveis e uma reserva.","juntos":"Montem o orçamento juntos e definam um valor para cada um gastar livremente.","oracao":"Senhor, dá-me sabedoria para planejar. Que eu não comece o que não posso terminar e cuide bem do que me deste. Amém."},{"id":"financas-08","tema":"financas","fase":2,"titulo":"Dar com alegria","ref":"2 Coríntios 9.6-8","link":"https://www.bible.com/pt/bible/129/2CO.9.6-8.NVI","versos":[[7,"Cada um dê conforme determinou em seu coração, não com pesar ou por obrigação, pois Deus ama quem dá com alegria."]],"r1":"Paulo pede uma oferta para irmãos em necessidade e diz: cada um dê conforme decidiu no coração, não com tristeza ou por obrigação.","r2":"Deus não quer a sua oferta como pagamento ou troca. Ele ama quem dá com alegria. Generosidade é o fruto de um coração que confia que Deus é suficiente.","r3":"Generosidade não depende de ter muito. Pode ser uma cesta básica, um tempo de ajuda, uma carona, um presente simples. Comece com algo que caiba no seu bolso e no seu coração. Dar com alegria é melhor do que dar muito com peso.","pergunta":"Dar tem sido uma alegria ou um peso para você?","pratica":"Escolha uma forma de ser generoso esta semana: ajudar alguém, ofertar, pagar um café.","juntos":"Escolham juntos alguém para abençoar esta semana.","oracao":"Deus, tu és generoso comigo. Quero dar com alegria, não por obrigação. Abre as minhas mãos. Amém."},{"id":"financas-09","tema":"financas","fase":2,"titulo":"A oferta da viúva","ref":"Marcos 12.41-44","link":"https://www.bible.com/pt/bible/129/MRK.12.41-44.NVI","versos":[[43,"Chamando a si os seus discípulos, Jesus declarou: Afirmo-lhes que esta viúva pobre colocou na caixa de ofertas mais do que todos os outros."],[44,"Todos deram do que lhes sobrava; mas ela, da sua pobreza, deu tudo o que possuía para viver."]],"r1":"Jesus observava as ofertas no templo. Ricos davam muito, e uma viúva deu duas moedinhas. Jesus disse que ela deu mais do que todos.","r2":"Para Deus, o valor da oferta não está no número, está no coração. Ela deu do que lhe fazia falta, confiando que Deus cuidaria dela.","r3":"A viúva ensina que Deus olha o coração por trás da oferta. Antes de ofertar, ore e decida com sinceridade. Nenhuma oferta compra bênção. Ela é uma resposta de gratidão a um Deus que já nos deu tudo.","pergunta":"O que essa viúva te ensina sobre confiança?","pratica":"Pense em algo que você pode oferecer a Deus que tenha valor para você: tempo, dinheiro, talento.","juntos":"","oracao":"Senhor, olha o meu coração mais do que a minha oferta. Ensina-me a confiar em ti como aquela viúva. Amém."},{"id":"financas-10","tema":"financas","fase":3,"titulo":"Guardar com prudência","ref":"Provérbios 21.17-21","link":"https://www.bible.com/pt/bible/129/PRO.21.17-21.NVI","versos":[[20,"Na casa do sábio há comida e azeite armazenados, mas o tolo devora tudo o que pode."]],"r1":"Provérbios diz que na casa do sábio há comida e azeite armazenados, mas o tolo gasta tudo o que tem.","r2":"Guardar não é falta de fé. É prudência. Uma reserva para emergências tira um peso enorme e evita dívidas quando o imprevisto chega.","r3":"Uma regra simples para começar a guardar: separar o valor da reserva assim que o dinheiro entra, como se fosse uma conta a pagar. Mesmo que seja pouco, o hábito importa mais que o valor. A formiga começa com um grão.","pergunta":"Você tem alguma reserva para emergências?","pratica":"Separe hoje um valor, mesmo pequeno, para começar ou aumentar sua reserva.","juntos":"Definam juntos uma meta de reserva e um valor mensal para guardar.","oracao":"Pai, dá-me prudência para guardar e generosidade para repartir. Que eu seja sábio com o que tenho. Amém.","extra":{"ref":"Provérbios 6.6-8","link":"https://www.bible.com/pt/bible/129/PRO.6.6-8.NVI","frase":"A formiga que guarda no verão."}},{"id":"financas-11","tema":"financas","fase":3,"titulo":"Deus cuida das aves","ref":"Mateus 6.25-30","link":"https://www.bible.com/pt/bible/129/MAT.6.25-30.NVI","versos":[[26,"Observem as aves do céu: não semeiam nem colhem nem armazenam em celeiros; contudo, o Pai celestial as alimenta. Não têm vocês muito mais valor do que elas?"]],"r1":"Jesus aponta para as aves e para os lírios. Elas não plantam nem colhem, e Deus as alimenta. Vocês não valem muito mais do que elas?","r2":"Isso não é desculpa para não trabalhar. É um convite para trabalhar sem a angústia de quem acha que está sozinho. Seu valor para Deus é a base da sua confiança.","r3":"Confiar no cuidado de Deus não exclui procurar soluções. Exclui o desespero. Faça o que está ao seu alcance hoje: uma ligação, um orçamento, uma conversa difícil. Depois, entregue o restante e durma em paz.","pergunta":"Que preocupação financeira tem tirado o seu sono?","pratica":"Escreva essa preocupação e, ao lado, um passo prático que está ao seu alcance. Faça o passo e entregue o resto a Deus.","juntos":"","oracao":"Senhor, tu cuidas das aves e dos lírios. Ajuda-me a confiar que também cuidas de mim e da minha casa. Amém."},{"id":"financas-12","tema":"financas","fase":3,"titulo":"A riqueza que voa","ref":"Provérbios 23.1-5","link":"https://www.bible.com/pt/bible/129/PRO.23.1-5.NVI","versos":[[4,"Não esgote suas forças tentando ficar rico; tenha bom senso!"],[5,"As riquezas desaparecem assim que você as contempla; elas criam asas e voam como águias pelo céu."]],"r1":"Provérbios usa uma imagem curiosa: a riqueza cria asas e voa como a águia. Num instante, ela pode ir embora.","r2":"Correr atrás de riqueza a qualquer custo é perigoso, porque ela não oferece segurança verdadeira. Quem se desgasta para enriquecer pode perder o que tem mais valor.","r3":"Antes de aceitar mais trabalho para ganhar mais, pergunte: o que vou perder com isso? Às vezes vale a pena. Às vezes, o custo é a saúde, o casamento ou o tempo com os filhos. A riqueza voa, as relações ficam.","pergunta":"O que você tem sacrificado para ganhar mais?","pratica":"Avalie se algum projeto de 'ganhar mais' está custando tempo com Deus ou com a família.","juntos":"Conversem sobre o equilíbrio entre trabalho, dinheiro e tempo juntos.","oracao":"Deus, que eu não me desgaste correndo atrás do que voa. Ensina-me a buscar o que permanece. Amém."},{"id":"financas-13","tema":"financas","fase":3,"titulo":"O celeiro maior","ref":"Lucas 12.13-21","link":"https://www.bible.com/pt/bible/129/LUK.12.13-21.NVI","versos":[[15,"Então lhes disse: Cuidado! Fiquem de sobreaviso contra todo tipo de ganância; a vida de um homem não consiste na quantidade dos seus bens."]],"r1":"Um homem pede que Jesus resolva uma briga de herança. Jesus responde com uma parábola sobre um rico que só pensava em construir celeiros maiores.","r2":"A vida de alguém não consiste na quantidade de bens. O rico da parábola planejou tudo, menos a eternidade. Ser rico para com Deus é o que importa.","r3":"Ser rico para com Deus é investir no que dura: pessoas, generosidade, fé. Pense em uma forma de usar parte dos seus recursos para abençoar alguém este mês. O celeiro maior raramente traz a paz que promete.","pergunta":"O que significa, para você, ser 'rico para com Deus'?","pratica":"Doe algo que está parado em casa e pode ser útil para alguém.","juntos":"Separem juntos roupas, brinquedos ou objetos para doar.","oracao":"Senhor, guarda-me da ganância. Que eu seja rico para contigo e generoso com quem precisa. Amém."},{"id":"financas-14","tema":"financas","fase":3,"titulo":"Mais feliz em dar","ref":"Atos 20.32-35","link":"https://www.bible.com/pt/bible/129/ACT.20.32-35.NVI","versos":[[35,"Em tudo o que fiz, mostrei-lhes que mediante trabalho árduo devemos ajudar os fracos, lembrando as palavras do próprio Senhor Jesus, que disse: ‘Há maior felicidade em dar do que em receber’ ."]],"r1":"Paulo se despede dos líderes de Éfeso e lembra uma frase de Jesus: há maior felicidade em dar do que em receber.","r2":"A generosidade não é só para quem tem muito. Paulo trabalhou com as próprias mãos para ajudar os necessitados. Dar faz bem a quem recebe e a quem dá.","r3":"A alegria de dar fica ainda maior quando é feita em família. Envolver os filhos na escolha de uma doação ensina, desde cedo, que dinheiro também serve para cuidar dos outros. Generosidade é uma herança que vale mais do que bens.","pergunta":"Quando foi a última vez que você sentiu a alegria de dar?","pratica":"Faça hoje um gesto de generosidade sem contar para ninguém.","juntos":"","oracao":"Jesus, tu me deste tudo. Quero experimentar a alegria de dar. Usa o que tenho para abençoar alguém. Amém."},{"id":"ansiedade-01","tema":"ansiedade","fase":1,"titulo":"Lancem sobre Ele","ref":"1 Pedro 5.6-7","link":"https://www.bible.com/pt/bible/129/1PE.5.6-7.NVI","versos":[[7,"Lancem sobre ele toda a sua ansiedade, porque ele tem cuidado de vocês."]],"r1":"Pedro usa um verbo forte: lançar. É jogar longe, como quem tira um peso das costas. A razão é simples: Ele tem cuidado de você.","r2":"A ansiedade quer que você carregue sozinho o que ainda nem aconteceu. Lançar sobre Deus é um exercício diário, às vezes várias vezes ao dia.","r3":"Lançar a ansiedade sobre Deus pode ser bem concreto: escreva num papel o que está te preocupando, ore entregando cada item e guarde o papel numa gaveta. Quando a preocupação voltar, lembre: 'isso já está entregue'. Pode ser preciso entregar de novo, e tudo bem.","pergunta":"Qual ansiedade você precisa lançar sobre Deus hoje?","pratica":"Toda vez que a preocupação voltar hoje, respire fundo e diga: 'Senhor, isto é teu'.","juntos":"","oracao":"Senhor, lanço sobre ti esta ansiedade [diga qual]. Obrigado porque cuidas de mim. Amém."},{"id":"ansiedade-02","tema":"ansiedade","fase":1,"titulo":"Não andem ansiosos","ref":"Filipenses 4.4-7","link":"https://www.bible.com/pt/bible/129/PHP.4.4-7.NVI","versos":[[6,"Não andem ansiosos por coisa alguma, mas em tudo, pela oração e súplicas, e com ação de graças, apresentem seus pedidos a Deus."],[7,"E a paz de Deus, que excede todo o entendimento, guardará os seus corações e as suas mentes em Cristo Jesus."]],"r1":"Paulo não diz apenas 'pare de se preocupar'. Ele dá um caminho: transformar a preocupação em oração, com pedidos e com gratidão.","r2":"A promessa não é que tudo vai se resolver como você quer. É que a paz de Deus vai guardar o seu coração e a sua mente. A paz vem antes da resposta.","r3":"Uma prática útil é a oração com as mãos abertas: sente-se, abra as mãos sobre os joelhos e diga a Deus cada preocupação. Depois, feche as mãos e agradeça por algo. O corpo ajuda a mente a entender que você está soltando o controle.","pergunta":"Que pedido você pode fazer a Deus agora, junto com um agradecimento?","pratica":"Pegue cada preocupação de hoje e transforme em uma frase de oração com um 'obrigado' no fim.","juntos":"","oracao":"Pai, apresento a ti os meus pedidos [diga quais] e te agradeço por [diga algo]. Guarda o meu coração com a tua paz. Amém."},{"id":"ansiedade-03","tema":"ansiedade","fase":1,"titulo":"A paz que eu dou","ref":"João 14.25-27","link":"https://www.bible.com/pt/bible/129/JHN.14.25-27.NVI","versos":[[27,"Deixo-lhes a paz; a minha paz lhes dou. Não a dou como o mundo a dá. Não se perturbem os seus corações, nem tenham medo."]],"r1":"Jesus disse essas palavras na véspera de ser preso. Ele sabia o que vinha e mesmo assim falou de paz.","r2":"A paz do mundo depende de tudo estar bem. A paz de Jesus é diferente: ela existe mesmo quando as coisas não estão bem, porque vem da presença dEle.","r3":"A paz de Jesus não depende de cenário calmo. Ela pode estar presente numa fila de hospital, numa reunião tensa, numa noite de insônia. Quando o coração disparar, respire devagar e diga, mentalmente: 'a tua paz está comigo'.","pergunta":"Que tipo de paz você tem buscado: a do mundo ou a de Jesus?","pratica":"Repita o versículo 27 algumas vezes ao longo do dia, especialmente quando sentir o coração acelerar.","juntos":"","oracao":"Jesus, deixa comigo a tua paz. Não quero que o meu coração se perturbe nem tenha medo. Amém."},{"id":"ansiedade-04","tema":"ansiedade","fase":1,"titulo":"O Senhor é meu pastor","ref":"Salmo 23.1-6","link":"https://www.bible.com/pt/bible/129/PSA.23.1-6.NVI","versos":[[1,"O Senhor é o meu pastor; de nada terei falta."],[2,"Em verdes pastagens me faz repousar e me conduz a águas tranquilas;"],[3,"restaura-me o vigor. Guia-me nas veredas da justiça por amor do seu nome."]],"r1":"Talvez seja o texto mais conhecido da Bíblia. Davi, que foi pastor, sabia como as ovelhas dependem de alguém para encontrar água, pasto e proteção.","r2":"O salmo não promete ausência de vales escuros. Promete companhia dentro deles. Você não atravessa nada sozinho.","r3":"Repare em quantas imagens de cuidado existem no salmo: pastos verdes, águas tranquilas, mesa preparada, cálice transbordando. Escolha uma delas e imagine-se ali por alguns minutos. Deixe que essa imagem acompanhe você nos momentos de medo.","pergunta":"Em que vale você está caminhando agora?","pratica":"Leia o Salmo 23 em voz alta antes de dormir hoje.","juntos":"Leiam o Salmo 23 juntos antes de dormir, cada um lendo um versículo.","oracao":"Senhor, tu és o meu pastor. Nada me faltará. Mesmo no vale, não temerei, porque tu estás comigo. Amém."},{"id":"ansiedade-05","tema":"ansiedade","fase":2,"titulo":"Pensamentos que pesam","ref":"Filipenses 4.8-9","link":"https://www.bible.com/pt/bible/129/PHP.4.8-9.NVI","versos":[[8,"Finalmente, irmãos, tudo o que for verdadeiro, tudo o que for nobre, tudo o que for correto, tudo o que for puro, tudo o que for amável, tudo o que for de boa fama, se houver algo de excelente ou digno de louvor, pensem nessas coisas."]],"r1":"Logo depois de falar da paz, Paulo fala dos pensamentos. Ele lista o que deve ocupar a mente: o que é verdadeiro, nobre, correto, puro, amável.","r2":"A ansiedade costuma alimentar pensamentos de catástrofe. Escolher onde a mente vai pousar é um exercício. Começa pelo que é verdadeiro, não pelo pior cenário.","r3":"Um exercício simples: quando um pensamento ansioso aparecer, escreva-o e responda com três perguntas: isso é verdade? É provável? O que eu posso fazer agora? Muitos medos encolhem quando são colocados no papel e olhados de frente.","pergunta":"Que pensamento tem ocupado sua mente sem pedir licença?","pratica":"Quando um pensamento ansioso aparecer, pergunte: isso é verdade? Depois troque por uma verdade da Palavra.","juntos":"","oracao":"Senhor, guarda a minha mente. Ajuda-me a pensar no que é verdadeiro e bom, e não no medo. Amém."},{"id":"ansiedade-06","tema":"ansiedade","fase":2,"titulo":"Um dia de cada vez","ref":"Mateus 6.25-34","link":"https://www.bible.com/pt/bible/129/MAT.6.25-34.NVI","versos":[[34,"Portanto, não se preocupem com o amanhã, pois o amanhã se preocupará consigo mesmo. Basta a cada dia o seu próprio mal."]],"r1":"Jesus termina o ensino sobre preocupação com uma frase prática: não se preocupem com o amanhã, cada dia tem seu próprio mal.","r2":"A ansiedade adora viver no futuro. Jesus convida a voltar para hoje. Hoje você tem o que precisa para hoje.","r3":"Viver um dia de cada vez inclui cuidar do básico: dormir, comer, caminhar, conversar com alguém. A ansiedade cresce quando o corpo está esgotado. Cuidar de si não é egoísmo. É cuidar do templo que Deus te deu.","pergunta":"Quanto do seu dia você passa vivendo no amanhã?","pratica":"Planeje o amanhã por cinco minutos, anote e depois deixe a agenda fechada. O resto do dia é para viver o hoje.","juntos":"","oracao":"Pai, me ensina a viver um dia de cada vez. O amanhã está nas tuas mãos. Hoje eu confio em ti. Amém."},{"id":"ansiedade-07","tema":"ansiedade","fase":2,"titulo":"Elias debaixo da árvore","ref":"1 Reis 19.3-8","link":"https://www.bible.com/pt/bible/129/1KI.19.3-8.NVI","versos":[[5,"Depois se deitou debaixo da árvore e dormiu. De repente um anjo tocou nele e disse: Levante-se e coma."],[6,"Elias olhou ao redor e ali, junto à sua cabeça, havia um pão assado sobre brasas quentes e um jarro de água. Ele comeu, bebeu e deitou-se de novo."],[7,"O anjo do Senhor voltou, tocou nele e disse: Levante-se e coma, pois a sua viagem será muito longa."]],"r1":"Depois de uma grande vitória, Elias desabou. Fugiu, se sentou debaixo de uma árvore e disse que não aguentava mais. Estava esgotado.","r2":"Deus não deu um sermão. Mandou um anjo com comida e deixou Elias dormir. Às vezes o cuidado de Deus vem como descanso, alimento e ajuda de outras pessoas, inclusive de profissionais.","r3":"Se a tristeza ou a ansiedade estão durando semanas, atrapalhando o sono, o trabalho ou a vontade de viver, procure ajuda profissional. Isso não é falta de fé. Deus usou um anjo para alimentar Elias e pode usar um médico, um psicólogo ou um amigo para cuidar de você. Em crise, ligue 188 (CVV).","pergunta":"Do que o seu corpo e a sua mente estão precisando agora?","pratica":"Cuide do básico hoje: durma mais cedo, coma direito e, se o peso estiver grande demais, procure ajuda de um profissional de saúde.","juntos":"","oracao":"Senhor, estou cansado. Cuida de mim como cuidaste de Elias. Dá-me descanso e coloca pessoas certas no meu caminho. Amém."},{"id":"ansiedade-08","tema":"ansiedade","fase":2,"titulo":"Jesus no barco","ref":"Marcos 4.35-41","link":"https://www.bible.com/pt/bible/129/MRK.4.35-41.NVI","versos":[[39,"Ele se levantou, repreendeu o vento e disse ao mar: Aquiete-se! Acalme-se! O vento se aquietou, e fez-se completa bonança."],[40,"Então perguntou aos seus discípulos: Por que vocês estão com tanto medo? Ainda não têm fé?"]],"r1":"Os discípulos estavam no barco com Jesus quando veio a tempestade. Ele dormia. Eles acordaram Jesus perguntando se Ele não se importava.","r2":"Jesus acalmou o mar e depois fez uma pergunta: por que vocês estão com tanto medo? A presença dEle no barco não impediu a tempestade, mas garantiu que não afundariam.","r3":"Jesus no barco não impediu a tempestade, mas mudou o desfecho. Quando o medo bater, faça uma oração curta como a dos discípulos: 'Senhor, me ajuda'. Não precisa de mais. Ele está perto e ouve.","pergunta":"Que tempestade está balançando o seu barco hoje?","pratica":"Escreva o nome da sua tempestade e, embaixo, a frase: 'Jesus está no barco'.","juntos":"","oracao":"Jesus, tu estás no meu barco. Fala às minhas tempestades e acalma o meu coração. Amém."},{"id":"ansiedade-09","tema":"ansiedade","fase":3,"titulo":"Força para o cansado","ref":"Isaías 40.28-31","link":"https://www.bible.com/pt/bible/129/ISA.40.28-31.NVI","versos":[[31,"mas aqueles que esperam no Senhor renovam as suas forças. Voam bem alto como águias; correm e não ficam exaustos, andam e não se cansam."]],"r1":"Isaías lembra que Deus não se cansa nem fica exausto. E diz que Ele dá força ao cansado. Até os jovens tropeçam, mas quem espera no Senhor renova as forças.","r2":"Esperar no Senhor é diferente de esperar parado. É confiar e continuar, um passo de cada vez, sabendo de onde vem a força.","r3":"Renovar as forças às vezes é questão de pausa. Uma caminhada curta, uma janela aberta, um copo de água tomado devagar. Use esses pequenos intervalos para lembrar que a sua força vem de Deus e não só da sua resistência.","pergunta":"Onde você tem buscado forças quando está esgotado?","pratica":"Faça hoje uma caminhada curta, de preferência ao ar livre, orando e respirando com calma.","juntos":"","oracao":"Senhor, tu não te cansas. Renova as minhas forças. Que eu caminhe e não me fatigue. Amém."},{"id":"ansiedade-10","tema":"ansiedade","fase":3,"titulo":"Quando eu tiver medo","ref":"Salmo 56.1-4","link":"https://www.bible.com/pt/bible/129/PSA.56.1-4.NVI","versos":[[3,"Mas eu, quando estiver com medo, confiarei em ti."],[4,"Em Deus, cuja palavra eu louvo, em Deus eu confio, e não temerei. Que poderá fazer-me o simples mortal?"]],"r1":"Davi escreveu esse salmo quando estava em perigo real. Ele não nega o medo: diz 'quando eu tiver medo'. Mas decide onde colocar a confiança.","r2":"O medo vai aparecer. A questão é o que você faz com ele. Davi transforma o medo em um ponto de partida para confiar.","r3":"Dar nome ao medo diminui o poder dele. Diga em voz alta: 'estou com medo de...'. Depois, complete com uma promessa de Deus. O medo pode continuar ali por um tempo, mas ele deixa de ser o único a falar.","pergunta":"Qual é o seu maior medo hoje?","pratica":"Escreva seu medo e complete a frase: 'Quando eu tiver medo, confiarei em ti, porque...'.","juntos":"","oracao":"Senhor, quando eu tiver medo, confiarei em ti. Em ti eu ponho a minha confiança. Amém."},{"id":"ansiedade-11","tema":"ansiedade","fase":3,"titulo":"Deitar em paz","ref":"Salmo 4.1-8","link":"https://www.bible.com/pt/bible/129/PSA.4.1-8.NVI","versos":[[8,"Em paz me deito e logo adormeço, pois só tu, Senhor, me fazes viver em segurança."]],"r1":"Davi termina este salmo dizendo que se deita e logo adormece em paz, porque só o Senhor o faz viver em segurança.","r2":"Muitos ansiosos sofrem justamente na hora de dormir, quando os pensamentos aceleram. Criar um ritual de entrega antes de dormir ajuda o corpo e a alma a descansar.","r3":"Crie um ritual de noite que diga ao corpo que o dia acabou: luz mais baixa, celular longe, uma leitura curta e uma oração. Se a mente acelerar, troque a lista de preocupações por uma lista de agradecimentos.","pergunta":"Como costumam ser as suas noites?","pratica":"Crie um ritual hoje: celular longe da cama, uma leitura curta e uma oração de entrega.","juntos":"Façam juntos uma oração de entrega antes de dormir.","oracao":"Senhor, em paz me deito e logo adormeço. Só tu me fazes viver em segurança. Guarda a minha noite. Amém."},{"id":"ansiedade-12","tema":"ansiedade","fase":3,"titulo":"Não tema","ref":"Isaías 41.8-13","link":"https://www.bible.com/pt/bible/129/ISA.41.8-13.NVI","versos":[[10,"Por isso não tema, pois estou com você; não tenha medo, pois sou o seu Deus. Eu o fortalecerei e o ajudarei; Eu o segurarei com a minha mão direita vitoriosa."]],"r1":"Deus fala a um povo com medo e diz: não tema, eu estou com você. Eu o fortaleço, eu o ajudo, eu o seguro com a minha mão.","r2":"São três promessas em sequência: força, ajuda e sustento. Repare que nenhuma delas diz que o problema vai sumir. A promessa é presença.","r3":"Repare que Deus diz 'eu o seguro com a minha mão'. Quando a ansiedade apertar, segure algo com a mão, uma caneca ou a mão de alguém, e lembre que você também está sendo segurado. Gestos simples ajudam o coração a lembrar das promessas.","pergunta":"Qual dessas promessas você mais precisa hoje: força, ajuda ou sustento?","pratica":"Escreva o versículo 10 num papel e leve com você hoje.","juntos":"","oracao":"Deus, tu estás comigo. Fortalece-me, ajuda-me, segura-me com a tua mão. Amém."},{"id":"ansiedade-13","tema":"ansiedade","fase":3,"titulo":"Coração firme","ref":"Salmo 112.1-8","link":"https://www.bible.com/pt/bible/129/PSA.112.1-8.NVI","versos":[[7,"Não temerá más notícias; seu coração está firme, confiante no Senhor."]],"r1":"O salmo descreve alguém que não teme más notícias. Não porque elas não chegam, mas porque o coração dele está firme, confiando no Senhor.","r2":"Notícias ruins vão chegar. A firmeza não vem de controlar o que acontece, mas de onde o coração está ancorado.","r3":"Ter um coração firme não significa ignorar as notícias. Significa escolher a quantidade e a hora. Experimente ler notícias só uma vez por dia e nunca antes de dormir. Proteger a mente é uma forma de cuidar do coração.","pergunta":"Como você costuma reagir a uma notícia ruim?","pratica":"Diminua hoje a quantidade de notícias que consome e observe a diferença no seu coração.","juntos":"","oracao":"Senhor, firma o meu coração em ti. Que más notícias não me derrubem, porque eu confio em ti. Amém."},{"id":"ansiedade-14","tema":"ansiedade","fase":3,"titulo":"Coragem, eu venci","ref":"João 16.31-33","link":"https://www.bible.com/pt/bible/129/JHN.16.31-33.NVI","versos":[[33,"Eu lhes disse essas coisas para que em mim vocês tenham paz. Neste mundo vocês terão aflições; contudo, tenham ânimo! Eu venci o mundo."]],"r1":"Jesus é honesto: no mundo vocês terão aflições. Ele não promete uma vida sem problemas. Mas termina com uma palavra de ânimo: eu venci o mundo.","r2":"A paz cristã não é negação da dor. É saber que a última palavra é de Jesus. A ansiedade diz que tudo vai dar errado. Jesus diz: tenham ânimo.","r3":"Aflições virão. A pergunta é com quem você vai atravessá-las. Lembre de alguém que pode orar com você esta semana e mande uma mensagem pedindo isso. Ânimo também se compartilha.","pergunta":"Que aflição você precisa olhar à luz da vitória de Jesus?","pratica":"Mande uma mensagem de ânimo para alguém que você sabe que está ansioso.","juntos":"","oracao":"Jesus, no mundo terei aflições, mas tu venceste. Dá-me ânimo e paz em ti. Amém."},{"id":"relacionamentos-01","tema":"relacionamentos","fase":1,"titulo":"Setenta vezes sete","ref":"Mateus 18.21-22","link":"https://www.bible.com/pt/bible/129/MAT.18.21-22.NVI","versos":[[21,"Então Pedro aproximou-se de Jesus e perguntou: Senhor, quantas vezes deverei perdoar a meu irmão quando ele pecar contra mim? Até sete vezes?"],[22,"Jesus respondeu: Eu lhe digo: não até sete, mas até setenta vezes sete."]],"r1":"Pedro achou que estava sendo generoso ao sugerir perdoar sete vezes. Jesus respondeu com setenta vezes sete, um jeito de dizer: pare de contar.","r2":"Perdão não é uma conta que se encerra. É uma postura. Isso não significa aceitar abuso, significa não deixar que a mágoa governe o seu coração.","r3":"Perdoar não significa esquecer nem confiar de novo imediatamente. Confiança se reconstrói com o tempo. Perdoar é soltar o desejo de vingança e entregar a justiça a Deus. É um passo que liberta mais quem perdoa do que quem é perdoado.","pergunta":"Existe alguém que você parou de perdoar?","pratica":"Escreva o nome dessa pessoa e ore por ela, pedindo a Deus que te ajude a perdoar.","juntos":"","oracao":"Senhor, quero parar de contar as ofensas. Ensina-me a perdoar como tu me perdoas. Amém."},{"id":"relacionamentos-02","tema":"relacionamentos","fase":1,"titulo":"A dívida perdoada","ref":"Mateus 18.23-35","link":"https://www.bible.com/pt/bible/129/MAT.18.23-35.NVI","versos":[[33,"Você não devia ter tido misericórdia do seu conservo como eu tive de você?’"]],"r1":"Na parábola, um servo é perdoado de uma dívida impagável e logo depois manda prender um colega que lhe devia pouco.","r2":"Quando lembramos do tamanho do perdão que recebemos de Deus, fica mais fácil perdoar os outros. A falta de perdão nasce do esquecimento da graça.","r3":"Quando for difícil perdoar alguém, faça uma lista do que Deus já perdoou em você. Não para se sentir culpado, mas para lembrar de quanta graça você recebeu. A misericórdia que recebemos é a fonte da misericórdia que damos.","pergunta":"Você tem lembrado do quanto já foi perdoado?","pratica":"Faça uma lista de coisas pelas quais Deus já te perdoou. Depois, ore pela pessoa que você precisa perdoar.","juntos":"","oracao":"Pai, tu perdoaste uma dívida que eu nunca poderia pagar. Que eu tenha misericórdia como tiveste de mim. Amém."},{"id":"relacionamentos-03","tema":"relacionamentos","fase":1,"titulo":"Reconciliar primeiro","ref":"Mateus 5.21-24","link":"https://www.bible.com/pt/bible/129/MAT.5.21-24.NVI","versos":[[23,"Portanto, se você estiver apresentando sua oferta diante do altar e ali se lembrar de que seu irmão tem algo contra você,"],[24,"deixe sua oferta ali, diante do altar, e vá primeiro reconciliar-se com seu irmão; depois volte e apresente sua oferta."]],"r1":"Jesus diz que, se você lembrar no altar que alguém tem algo contra você, deve deixar a oferta e ir primeiro se reconciliar.","r2":"Para Jesus, a relação com Deus e a relação com as pessoas andam juntas. Não dá para ter o coração em paz com Deus e em guerra com o irmão de propósito.","r3":"Reconciliar pode começar com uma mensagem simples: 'tenho pensado em você e queria conversar'. Se a outra pessoa não quiser, você fez a sua parte. Ore por ela e deixe a porta aberta. A reconciliação depende de dois, mas o primeiro passo pode ser seu.","pergunta":"Quem pode ter algo contra você?","pratica":"Dê um passo de reconciliação esta semana: uma mensagem, uma ligação, um pedido de desculpas.","juntos":"","oracao":"Senhor, mostra-me com quem preciso me reconciliar. Dá-me humildade para dar o primeiro passo. Amém."},{"id":"relacionamentos-04","tema":"relacionamentos","fase":1,"titulo":"A conversa a sós","ref":"Mateus 18.15-17","link":"https://www.bible.com/pt/bible/129/MAT.18.15-17.NVI","versos":[[15,"Se o seu irmão pecar contra você, vá e, a sós com ele, mostre-lhe o erro. Se ele o ouvir, você ganhou seu irmão."]],"r1":"Jesus ensina um caminho para quando alguém nos ofende: ir até a pessoa e conversar a sós. Não espalhar, não guardar, conversar.","r2":"Muitos conflitos crescem porque falamos sobre a pessoa com todo mundo, menos com ela. Uma conversa honesta e gentil resolve muito mais do que parece.","r3":"Antes de uma conversa difícil, ore pela pessoa e por você. Escolha um momento calmo, fale do que você sentiu, e não do que acha que o outro é. 'Fiquei magoado quando...' abre mais caminhos do que 'você é sempre assim'.","pergunta":"Com quem você tem falado de alguém, em vez de falar com ele?","pratica":"Se houver uma conversa necessária, planeje como começar com respeito e marque um momento.","juntos":"","oracao":"Pai, dá-me coragem para conversar diretamente e sabedoria para falar com amor. Livra-me da fofoca. Amém."},{"id":"relacionamentos-05","tema":"relacionamentos","fase":2,"titulo":"José perdoa os irmãos","ref":"Gênesis 50.15-21","link":"https://www.bible.com/pt/bible/129/GEN.50.15-21.NVI","versos":[[20,"Vocês planejaram o mal contra mim, mas Deus o tornou em bem, para que hoje fosse preservada a vida de muitos."]],"r1":"Os irmãos de José o venderam como escravo. Anos depois, com poder nas mãos, José escolheu perdoar e ainda cuidou deles.","r2":"José não fingiu que não doeu. Ele disse: vocês planejaram o mal, mas Deus o transformou em bem. Perdoar foi possível porque ele viu a mão de Deus na história.","r3":"Olhar a história com os olhos de José leva tempo. Às vezes só enxergamos o bem anos depois. Enquanto isso, perdoar pode ser uma decisão diária. Peça a Deus que mostre, aos poucos, como Ele pode usar até as feridas para algo bom.","pergunta":"Que dor do passado Deus pode estar transformando?","pratica":"Escreva como Deus já usou uma situação difícil da sua vida para algo bom.","juntos":"","oracao":"Senhor, o que planejaram para o mal, tu podes transformar em bem. Ajuda-me a perdoar e a confiar na tua mão. Amém."},{"id":"relacionamentos-06","tema":"relacionamentos","fase":2,"titulo":"Amar os inimigos","ref":"Lucas 6.27-36","link":"https://www.bible.com/pt/bible/129/LUK.6.27-36.NVI","versos":[[27,"Mas eu digo a vocês que estão me ouvindo: Amem os seus inimigos, façam o bem aos que os odeiam,"],[28,"abençoem os que os amaldiçoam, orem por aqueles que os maltratam."]],"r1":"Jesus pede algo que vai contra tudo o que sentimos: amar os inimigos, fazer o bem a quem nos odeia, orar por quem nos maltrata.","r2":"Amar o inimigo não é concordar com ele nem se colocar em risco. É recusar o ódio. Começa com uma oração, mesmo que seja difícil de fazer.","r3":"Orar pelo inimigo muda primeiro quem ora. No começo, a oração pode sair seca, quase obrigada. Continue. Com o tempo, o ódio perde força. E, se a pessoa representa um perigo real, ore por ela de longe, mantendo a sua segurança.","pergunta":"Por quem é mais difícil você orar?","pratica":"Ore hoje por essa pessoa, pedindo o bem para ela.","juntos":"","oracao":"Pai, é difícil, mas eu oro por [nome]. Abençoa essa pessoa e cura o meu coração. Amém."},{"id":"relacionamentos-07","tema":"relacionamentos","fase":2,"titulo":"A resposta branda","ref":"Provérbios 15.1-4","link":"https://www.bible.com/pt/bible/129/PRO.15.1-4.NVI","versos":[[1,"A resposta calma desvia a fúria, mas a palavra ríspida desperta a ira."]],"r1":"Provérbios ensina que a resposta calma desvia a fúria, mas a palavra ríspida desperta a ira. O tom muda o rumo da conversa.","r2":"Em muitas discussões, o problema nem é o assunto, é o jeito. Baixar a voz e escolher palavras gentis pode impedir que uma faísca vire incêndio.","r3":"Uma estratégia útil: quando sentir a raiva subir, conte até dez, beba um gole de água ou peça um tempo. Uma resposta pensada evita muitas palavras que depois precisam de pedido de desculpas.","pergunta":"Como costuma ser o seu tom quando você está irritado?","pratica":"Na próxima discussão, fale mais baixo e mais devagar de propósito e observe a reação.","juntos":"Combinem um sinal para quando a conversa esquentar: uma palavra que significa 'vamos dar uma pausa'.","oracao":"Senhor, coloca brandura nas minhas palavras. Que eu apague incêndios em vez de começá-los. Amém."},{"id":"relacionamentos-08","tema":"relacionamentos","fase":2,"titulo":"Vencer o mal com o bem","ref":"Romanos 12.17-21","link":"https://www.bible.com/pt/bible/129/ROM.12.17-21.NVI","versos":[[18,"Façam todo o possível para viver em paz com todos."],[21,"Não se deixem vencer pelo mal, mas vençam o mal com o bem."]],"r1":"Paulo diz para não retribuir mal com mal e, no que depender de nós, viver em paz com todos. E termina: vença o mal com o bem.","r2":"'No que depender de você' reconhece que a paz nem sempre é possível. Mas a nossa parte é sempre possível: não alimentar a vingança.","r3":"Responder o mal com o bem não é ser ingênuo. É recusar entrar no jogo da vingança. Pode ser um cumprimento educado, uma ajuda inesperada, ou simplesmente não espalhar o que a pessoa fez. Pequenas escolhas quebram grandes ciclos.","pergunta":"Qual é a sua parte para viver em paz com alguém hoje?","pratica":"Responda hoje com um bem a alguém que te tratou mal.","juntos":"","oracao":"Deus, no que depender de mim, quero viver em paz. Dá-me forças para vencer o mal com o bem. Amém."},{"id":"relacionamentos-09","tema":"relacionamentos","fase":2,"titulo":"Suportar com amor","ref":"Efésios 4.1-3","link":"https://www.bible.com/pt/bible/129/EPH.4.1-3.NVI","versos":[[2,"Sejam completamente humildes e dóceis, e sejam pacientes, suportando uns aos outros com amor."],[3,"Façam todo o esforço para conservar a unidade do Espírito pelo vínculo da paz."]],"r1":"Paulo pede humildade, mansidão e paciência, suportando uns aos outros com amor. Suportar é carregar junto, mesmo quando o outro pesa.","r2":"Toda relação próxima exige paciência com os defeitos do outro, como os outros têm com os nossos. A unidade é um esforço diário.","r3":"Lembre-se de que os outros também têm paciência com você. Pense em um defeito seu que as pessoas próximas suportam com amor. Isso ajuda a olhar com mais graça para os defeitos de quem convive com você.","pergunta":"De quem você tem tido pouca paciência ultimamente?","pratica":"Faça hoje um gesto de paciência intencional com essa pessoa.","juntos":"","oracao":"Senhor, dá-me humildade e paciência. Que eu me esforce para manter a paz com quem convivo. Amém."},{"id":"relacionamentos-10","tema":"relacionamentos","fase":3,"titulo":"Amizade verdadeira","ref":"1 Samuel 18.1-4","link":"https://www.bible.com/pt/bible/129/1SA.18.1-4.NVI","versos":[[1,"Depois dessa conversa de Davi com Saul, surgiu tão grande amizade entre Jônatas e Davi que Jônatas tornou-se o seu melhor amigo."],[3,"E Jônatas fez um acordo de amizade com Davi, pois se tornara o melhor amigo de Davi."]],"r1":"Jônatas e Davi fizeram uma aliança de amizade. Jônatas era filho do rei e mesmo assim protegeu Davi, que seria rei no lugar dele.","r2":"Amizade verdadeira não compete, protege. Provérbios diz que o amigo ama em todos os momentos. Esse tipo de amizade é um presente que precisa de cuidado.","r3":"Boas amizades precisam de tempo. Marque um café, uma ligação, um passeio. Amigos verdadeiros não aparecem só nas festas. Eles estão presentes nos dias difíceis, e isso se constrói nos dias comuns.","pergunta":"Quem é um amigo verdadeiro na sua vida? Quando foi a última vez que você disse isso a ele?","pratica":"Mande hoje uma mensagem para um amigo dizendo o quanto ele é importante.","juntos":"","oracao":"Senhor, obrigado pelos amigos que colocaste no meu caminho. Ensina-me a ser um amigo fiel. Amém.","extra":{"ref":"Provérbios 17.17","link":"https://www.bible.com/pt/bible/129/PRO.17.17.NVI","frase":"O amigo ama em todos os momentos."}},{"id":"relacionamentos-11","tema":"relacionamentos","fase":3,"titulo":"A trave no olho","ref":"Mateus 7.1-5","link":"https://www.bible.com/pt/bible/129/MAT.7.1-5.NVI","versos":[[3,"Por que você repara no cisco que está no olho do seu irmão, e não se dá conta da viga que está em seu próprio olho?"],[5,"Hipócrita, tire primeiro a viga do seu olho, e então você verá claramente para tirar o cisco do olho do seu irmão."]],"r1":"Jesus usa uma imagem exagerada de propósito: alguém com uma trave no olho tentando tirar um cisco do olho do irmão.","r2":"Antes de apontar o erro do outro, Jesus pede que a gente olhe para o próprio. Isso não impede corrigir, mas muda o tom: de juiz para irmão.","r3":"Antes de criticar, faça uma pergunta: eu sei de toda a história? Muitas vezes, julgamos sem conhecer o que a pessoa está enfrentando. Uma pergunta gentil pode trazer mais entendimento do que uma crítica certeira.","pergunta":"Que defeito você critica nos outros e também tem?","pratica":"Antes de criticar alguém hoje, pergunte: onde eu também erro nisso?","juntos":"","oracao":"Senhor, mostra-me as traves nos meus olhos. Livra-me do julgamento e dá-me um olhar de misericórdia. Amém."},{"id":"relacionamentos-12","tema":"relacionamentos","fase":3,"titulo":"A graça que eu recebi","ref":"Salmo 103.8-14","link":"https://www.bible.com/pt/bible/129/PSA.103.8-14.NVI","versos":[[12,"e como o Oriente está longe do Ocidente, assim ele afasta para longe de nós as nossas transgressões."]],"r1":"O salmista diz que Deus afasta de nós as transgressões como o Oriente está longe do Ocidente. É uma distância que não se mede.","r2":"Às vezes a pessoa mais difícil de perdoar somos nós mesmos. Se Deus já afastou o pecado confessado, não há razão para você continuar carregando.","r3":"Receber o perdão de Deus inclui parar de se punir. Quando a lembrança do erro voltar, responda com o versículo de hoje. Você pode aprender com o passado sem morar nele.","pergunta":"Existe algum erro do passado que você ainda não se permitiu deixar para trás?","pratica":"Escreva esse erro, ore entregando a Deus e jogue o papel fora como símbolo.","juntos":"","oracao":"Pai, tu afastaste de mim os meus pecados. Ajuda-me a receber o teu perdão e a deixar o passado para trás. Amém."},{"id":"relacionamentos-13","tema":"relacionamentos","fase":3,"titulo":"Amor em ação","ref":"1 João 3.16-18","link":"https://www.bible.com/pt/bible/129/1JN.3.16-18.NVI","versos":[[18,"Filhinhos, não amemos de palavra nem de boca, mas em ação e em verdade."]],"r1":"João diz que conhecemos o amor porque Jesus deu a vida por nós. E conclui: não amemos de palavra, mas com ações e em verdade.","r2":"Amor que fica só em palavras não alimenta ninguém. Relacionamentos são curados e fortalecidos com atitudes concretas.","r3":"Pense em alguém próximo que está passando por um momento difícil e faça algo concreto: levar uma refeição, ajudar com uma tarefa, fazer uma visita. O amor em ação fala mais alto do que qualquer mensagem.","pergunta":"Que ação de amor alguém próximo de você está precisando?","pratica":"Faça hoje uma ação prática de amor por alguém: uma visita, uma ajuda, um presente simples.","juntos":"","oracao":"Jesus, tu me amaste com ações. Que o meu amor seja de verdade, não só de palavras. Amém."},{"id":"relacionamentos-14","tema":"relacionamentos","fase":3,"titulo":"Ministros da reconciliação","ref":"2 Coríntios 5.17-20","link":"https://www.bible.com/pt/bible/129/2CO.5.17-20.NVI","versos":[[17,"Portanto, se alguém está em Cristo, é nova criação. As coisas antigas já passaram; eis que surgiram coisas novas!"],[18,"Tudo isso provém de Deus, que nos reconciliou consigo mesmo por meio de Cristo e nos deu o ministério da reconciliação,"]],"r1":"Paulo diz que quem está em Cristo é nova criação. E que Deus nos deu o ministério da reconciliação.","r2":"Fomos reconciliados com Deus para sermos pontes entre as pessoas. Onde há conflito, o cristão pode ser quem aproxima e não quem divide.","r3":"Ser ponte exige cuidado. Não é tomar partido nem levar recados. É ajudar as pessoas a se ouvirem, orar por elas e lembrar o que as une. Às vezes a melhor contribuição é simplesmente não alimentar o conflito.","pergunta":"Onde você pode ser uma ponte entre pessoas em conflito?","pratica":"Se houver um conflito na família ou no trabalho, ofereça-se para ajudar a aproximar, com cuidado.","juntos":"","oracao":"Senhor, faz de mim um instrumento de reconciliação. Onde houver divisão, que eu leve a tua paz. Amém."},{"id":"proposito-01","tema":"proposito","fase":1,"titulo":"Planos de esperança","ref":"Jeremias 29.10-13","link":"https://www.bible.com/pt/bible/129/JER.29.10-13.NVI","versos":[[11,"Porque sou eu que conheço os planos que tenho para vocês, diz o Senhor, planos de fazê-los prosperar e não de lhes causar dano, planos de dar-lhes esperança e um futuro."]],"r1":"Esse versículo famoso foi escrito para um povo exilado na Babilônia, que ficaria lá setenta anos. A promessa veio no meio da espera, não no fim dela.","r2":"Deus tem planos de bem, mas eles nem sempre seguem o nosso calendário. Enquanto espera, o convite é buscar a Deus de todo o coração.","r3":"Enquanto o povo esperava, Deus mandou que construíssem casas, plantassem e buscassem o bem da cidade. Esperar não é parar a vida. Pergunte: o que posso construir e plantar onde estou agora, mesmo sem saber quando a espera vai acabar?","pergunta":"Em que área você tem esperado há muito tempo?","pratica":"Faça uma oração entregando essa espera e liste uma coisa que você pode fazer bem enquanto espera.","juntos":"","oracao":"Senhor, confio que os teus planos são de bem. Ensina-me a esperar buscando a ti de todo o coração. Amém."},{"id":"proposito-02","tema":"proposito","fase":1,"titulo":"Confie de todo coração","ref":"Provérbios 3.5-8","link":"https://www.bible.com/pt/bible/129/PRO.3.5-8.NVI","versos":[[5,"Confie no Senhor de todo o seu coração e não se apóie em seu próprio entendimento;"],[6,"reconheça o Senhor em todos os seus caminhos, e ele endireitará as suas veredas."]],"r1":"Provérbios pede confiança total: de todo o coração. E alerta para não se apoiar no próprio entendimento.","r2":"Reconhecer a Deus em todos os caminhos é levar a Ele todas as decisões, não só as grandes. A promessa é que Ele endireita as veredas.","r3":"Confiar de todo coração é diferente de não pensar. Pense, pesquise, converse e ore. Depois, decida com paz. Se a decisão não trouxer paz, espere um pouco mais e continue orando. Deus conduz quem está disposto a ser conduzido.","pergunta":"Que decisão você está tentando tomar sozinho?","pratica":"Antes de decidir, escreva os prós e contras e ore sobre cada um.","juntos":"","oracao":"Senhor, não quero me apoiar só no meu entendimento. Reconheço-te em todos os meus caminhos. Endireita as minhas veredas. Amém."},{"id":"proposito-03","tema":"proposito","fase":1,"titulo":"Peça sabedoria","ref":"Tiago 1.5-8","link":"https://www.bible.com/pt/bible/129/JAS.1.5-8.NVI","versos":[[5,"Se algum de vocês tem falta de sabedoria, peça-a a Deus, que a todos dá livremente, de boa vontade; e lhe será concedida."]],"r1":"Tiago diz que, se alguém tem falta de sabedoria, peça a Deus, que dá a todos com generosidade e sem repreender.","r2":"Deus não se irrita com as nossas dúvidas. Ele gosta de ser procurado. Pedir sabedoria é o primeiro passo de qualquer boa decisão.","r3":"Sabedoria chega por caminhos variados: a leitura da Bíblia, um conselho, uma experiência, uma porta que se fecha. Fique atento esta semana e anote o que perceber. Muitas respostas aparecem quando a gente para e presta atenção.","pergunta":"Em que situação você mais precisa de sabedoria agora?","pratica":"Faça hoje um pedido específico de sabedoria e fique atento às respostas: um texto, um conselho, uma ideia.","juntos":"","oracao":"Pai, tenho falta de sabedoria em [diga a situação]. Dá-me com generosidade, como prometeste. Amém."},{"id":"proposito-04","tema":"proposito","fase":1,"titulo":"Muitos conselheiros","ref":"Provérbios 15.22","link":"https://www.bible.com/pt/bible/129/PRO.15.22.NVI","versos":[[22,"Os planos fracassam por falta de conselho, mas são bem sucedidos quando há muitos conselheiros."]],"r1":"Provérbios diz que os planos fracassam por falta de conselho, mas são bem-sucedidos quando há muitos conselheiros.","r2":"Decidir sozinho parece mais rápido, mas é arriscado. Pessoas maduras e que amam você enxergam o que você não vê.","r3":"Escolha conselheiros que tenham fruto na vida: pessoas maduras, honestas e que querem o seu bem, não só concordar com você. Ouça com humildade, mesmo quando o conselho não for o que você esperava.","pergunta":"Quem são as pessoas de confiança a quem você pode pedir conselho?","pratica":"Escolha uma decisão importante e peça a opinião de duas pessoas maduras antes de decidir.","juntos":"","oracao":"Senhor, dá-me humildade para ouvir conselhos e coloca pessoas sábias perto de mim. Amém."},{"id":"proposito-05","tema":"proposito","fase":1,"titulo":"Feitos para boas obras","ref":"Efésios 2.8-10","link":"https://www.bible.com/pt/bible/129/EPH.2.8-10.NVI","versos":[[10,"Porque somos criação de Deus realizada em Cristo Jesus para fazermos boas obras, as quais Deus preparou de antemão para que nós as praticássemos."]],"r1":"Depois de dizer que somos salvos pela graça, não pelas obras, Paulo afirma: somos criação de Deus, feitos para boas obras.","r2":"Primeiro vem a graça, depois as obras. Não fazemos o bem para ganhar o amor de Deus, fazemos porque já fomos amados. E Ele preparou caminhos para isso.","r3":"Boas obras raramente são grandiosas. Estão no cotidiano: um telefonema para alguém sozinho, uma ajuda ao vizinho, um elogio sincero. Pergunte a Deus de manhã e preste atenção às oportunidades que aparecem.","pergunta":"Que boa obra pode estar esperando por você nesta semana?","pratica":"Pergunte a Deus de manhã: 'qual boa obra preparaste para mim hoje?'. Fique atento.","juntos":"","oracao":"Deus, obrigado pela tua graça. Mostra-me as boas obras que preparaste para mim e dá-me disposição para fazê-las. Amém."},{"id":"proposito-06","tema":"proposito","fase":2,"titulo":"Cada um com seu dom","ref":"1 Pedro 4.8-11","link":"https://www.bible.com/pt/bible/129/1PE.4.8-11.NVI","versos":[[10,"Cada um exerça o dom que recebeu para servir aos outros, administrando fielmente a graça de Deus em suas múltiplas formas."]],"r1":"Pedro diz que cada um recebeu um dom e deve usá-lo para servir os outros. Os dons são diferentes, mas o propósito é o mesmo.","r2":"Seu propósito tem a ver com aquilo que você faz bem e que ajuda pessoas. Não precisa ser algo grandioso. Precisa ser colocado a serviço.","r3":"Dons crescem quando são usados. Procure um lugar para servir com o seu: na igreja, num projeto social, na família. Se não souber por onde começar, ofereça ajuda onde há necessidade. Muitas pessoas descobrem seus dons servindo.","pergunta":"Que dom as pessoas costumam reconhecer em você?","pratica":"Pergunte a três pessoas próximas: 'em que você acha que eu sou bom?'. Anote as respostas.","juntos":"","oracao":"Senhor, obrigado pelos dons que me deste. Quero usá-los para servir. Mostra-me onde. Amém."},{"id":"proposito-07","tema":"proposito","fase":2,"titulo":"Para um momento como este","ref":"Ester 4.12-16","link":"https://www.bible.com/pt/bible/129/EST.4.12-16.NVI","versos":[[14,"pois, se você ficar calada nesta hora, socorro e livramento surgirão de outra parte para os judeus, mas você e a família de seu pai morrerão. Quem sabe se não foi para um momento como este que você chegou à posição de rainha?"]],"r1":"Ester era rainha e podia ficar quieta. Mordecai a lembrou de que talvez ela tivesse chegado àquela posição para um momento como aquele.","r2":"Os lugares onde você está não são por acaso: sua família, seu trabalho, sua cidade. Pode ser que você esteja ali para fazer diferença na vida de alguém.","r3":"Ester precisou de coragem e de oração. Ela pediu que o povo jejuasse e orasse com ela antes de agir. Quando Deus colocar diante de você uma decisão corajosa, não vá sozinho: peça a pessoas de fé que orem com você.","pergunta":"Por que você acha que Deus te colocou onde você está hoje?","pratica":"Identifique uma pessoa ou situação ao seu redor em que você pode fazer diferença e dê um passo.","juntos":"","oracao":"Senhor, não quero me omitir. Mostra-me para qual momento me colocaste aqui e dá-me coragem. Amém."},{"id":"proposito-08","tema":"proposito","fase":2,"titulo":"As desculpas de Moisés","ref":"Êxodo 4.10-12","link":"https://www.bible.com/pt/bible/129/EXO.4.10-12.NVI","versos":[[11,"Disse-lhe o Senhor: Quem deu boca ao homem? Quem o fez surdo ou mudo? Quem lhe concede vista ou o torna cego? Não sou eu, o Senhor?"],[12,"Agora, pois, vá; eu estarei com você, ensinando-lhe o que dizer."]],"r1":"Quando Deus chamou Moisés, ele deu desculpas: não sei falar bem, não sou a pessoa certa. Deus respondeu: quem deu a boca ao homem?","r2":"Deus não chama os preparados, Ele prepara os chamados. Suas limitações não surpreendem Deus. Ele promete estar com você.","r3":"Repare que Deus não tirou as limitações de Moisés na hora. Ele deu companhia e promessa. Talvez o seu medo continue, mas você pode dar o passo mesmo assim, com Deus ao seu lado. Coragem é agir mesmo com medo.","pergunta":"Que desculpa você tem dado para não fazer algo que sente que Deus pede?","pratica":"Escreva sua desculpa e, ao lado, a promessa do versículo 12.","juntos":"","oracao":"Senhor, eu tenho medo e me sinto incapaz. Mas tu prometes estar comigo. Ensina-me o que fazer e dizer. Amém."},{"id":"proposito-09","tema":"proposito","fase":2,"titulo":"Tempo para tudo","ref":"Eclesiastes 3.1-8","link":"https://www.bible.com/pt/bible/129/ECC.3.1-8.NVI","versos":[[1,"Para tudo há uma ocasião, e um tempo para cada propósito debaixo do céu:"]],"r1":"Eclesiastes lembra que há tempo para tudo: plantar e colher, chorar e rir, calar e falar. A vida tem estações.","r2":"Parte da sabedoria é reconhecer em que estação você está. Nem toda fase é de colher. Algumas são de plantar e esperar.","r3":"Cada estação tem suas tarefas. Na fase de plantar, o trabalho é paciente e pouco visível. Na fase de colher, é intenso. Aceitar a estação atual tira a frustração de querer estar em outra e ajuda a viver bem o tempo presente.","pergunta":"Que estação você está vivendo agora?","pratica":"Escreva o que essa estação está pedindo de você e o que ela não está pedindo.","juntos":"","oracao":"Senhor, ajuda-me a entender o tempo que estou vivendo. Que eu não tente colher na época de plantar. Amém."},{"id":"proposito-10","tema":"proposito","fase":3,"titulo":"Mente renovada","ref":"Romanos 12.1-2","link":"https://www.bible.com/pt/bible/129/ROM.12.1-2.NVI","versos":[[2,"Não se amoldem ao padrão deste mundo, mas transformem-se pela renovação da sua mente, para que sejam capazes de experimentar e comprovar a boa, agradável e perfeita vontade de Deus."]],"r1":"Paulo pede que não nos amoldemos ao padrão deste mundo, mas sejamos transformados pela renovação da mente. Só assim discernimos a vontade de Deus.","r2":"A vontade de Deus não é um mapa escondido. Ela fica mais clara à medida que a nossa mente é transformada pela Palavra e pela convivência com Ele.","r3":"Renovar a mente é um processo diário, como uma dieta para os pensamentos. O que você consome todos os dias molda a forma como pensa. Escolha alimentar a mente com a Palavra, boas conversas e conteúdos que edificam.","pergunta":"Que padrão do mundo tem moldado o seu jeito de pensar?","pratica":"Troque hoje 15 minutos de conteúdo que você costuma consumir por leitura da Bíblia.","juntos":"","oracao":"Deus, renova a minha mente. Que eu não me molde ao mundo e possa entender a tua vontade. Amém."},{"id":"proposito-11","tema":"proposito","fase":3,"titulo":"Tudo coopera","ref":"Romanos 8.26-30","link":"https://www.bible.com/pt/bible/129/ROM.8.26-30.NVI","versos":[[28,"Sabemos que Deus age em todas as coisas para o bem daqueles que o amam, dos que foram chamados de acordo com o seu propósito."]],"r1":"Esse versículo é muitas vezes usado para dizer que tudo vai dar certo. Mas Paulo diz que Deus age em todas as coisas para o bem de quem o ama.","r2":"Nem tudo o que acontece é bom. Mas Deus é capaz de tecer até as coisas ruins em um propósito maior. Isso dá esperança sem negar a dor.","r3":"Deus agir para o bem não significa que você vai entender tudo agora. Às vezes, só olhando para trás percebemos o desenho. Enquanto isso, continue amando a Deus e fazendo o bem. É nesse caminho que a promessa se cumpre.","pergunta":"Que situação difícil você precisa olhar com essa esperança?","pratica":"Escreva uma situação difícil e ore pedindo que Deus mostre o bem que pode sair dela.","juntos":"","oracao":"Pai, mesmo no que não entendo, confio que trabalhas para o bem. Dá-me esperança e paciência. Amém."},{"id":"proposito-12","tema":"proposito","fase":3,"titulo":"Sair sem saber","ref":"Hebreus 11.8-10","link":"https://www.bible.com/pt/bible/129/HEB.11.8-10.NVI","versos":[[8,"Pela fé Abraão, quando chamado, obedeceu e dirigiu-se a um lugar que mais tarde receberia como herança, embora não soubesse para onde estava indo."]],"r1":"Abraão obedeceu e saiu sem saber para onde ia. Ele não tinha todas as respostas, mas tinha a promessa de Deus.","r2":"Às vezes Deus mostra só o primeiro passo. Esperar ter tudo claro pode paralisar. A fé é obedecer ao que já foi mostrado.","r3":"Dar o primeiro passo sem ver o caminho todo exige fé, mas também prudência. Ore, peça conselho e então dê o passo que está claro. Deus costuma mostrar o segundo passo depois que o primeiro é dado.","pergunta":"Que passo você sabe que precisa dar, mesmo sem ver o resto do caminho?","pratica":"Dê esse primeiro passo hoje, por menor que seja.","juntos":"","oracao":"Senhor, como Abraão, quero obedecer mesmo sem ver tudo. Dá-me fé para o próximo passo. Amém."},{"id":"proposito-13","tema":"proposito","fase":3,"titulo":"A bússola do amor","ref":"Mateus 22.34-40","link":"https://www.bible.com/pt/bible/129/MAT.22.34-40.NVI","versos":[[37,"Respondeu Jesus: ‘Ame o Senhor, o seu Deus de todo o seu coração, de toda a sua alma e de todo o seu entendimento’."],[38,"Este é o primeiro e maior mandamento."],[39,"E o segundo é semelhante a ele: ‘Ame o seu próximo como a si mesmo’."]],"r1":"Perguntaram a Jesus qual era o maior mandamento. Ele resumiu toda a Lei em dois: amar a Deus e amar o próximo.","r2":"Quando você não souber o que fazer, use essa bússola: essa escolha me aproxima de Deus? Ela ama as pessoas? Muitas decisões ficam mais claras assim.","r3":"Use essa bússola nas escolhas
